schema_version: 2
program_id: slide_open_drawer
integration:
  robot_profile: expert_program_ur5_slide
  scene_registry: expert_program_open_drawer
  runtime_preset: safe
targets: {}
program:
  kind: segment
  name: open_drawer
  steps:
    kind: invoke
    call:
      kind: registered
      call_id: embodichain_tasks.open_drawer
      schema_version: 1
      arguments:
        handle: drawer_handle
        direction: pull
        hand_interp_steps: 12
        approach_distance: 0.10
        translation_distance: 0.18
      resources:
        primary: manipulator
  post:
    - kind: wait_stable
      entity: drawer
      preset: articulation
  validators:
    - kind: articulation_joint_position
      articulation: drawer
      joint: cabinet_to_drawer
      minimum_position: 0.10
