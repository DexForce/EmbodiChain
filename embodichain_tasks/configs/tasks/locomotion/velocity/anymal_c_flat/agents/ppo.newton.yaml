trainer:
  exp_name: anymal_c_flat_ppo_newton
  gym_config: embodichain_tasks/configs/tasks/locomotion/velocity/anymal_c_flat/env.newton.yaml
  seed: 42
  device: cuda:0
  headless: true
  renderer: hybrid
  num_envs: 4096
  iterations: 500
  buffer_size: 24
  enable_eval: false
  save_frequency_updates: 50
  use_wandb: false
  wandb_project_name: embodichain-locomotion
policy:
  name: actor_critic
  obs_groups:
    actor:
    - policy
    critic:
    - critic
  actor:
    type: mlp
    network_cfg:
      hidden_sizes:
      - 128
      - 128
      - 128
      activation: elu
  critic:
    type: mlp
    network_cfg:
      hidden_sizes:
      - 128
      - 128
      - 128
      activation: elu
  initial_action_std: 1.0
algorithm:
  name: ppo
  cfg:
    optimizer:
      name: adam
      learning_rate: 0.001
    schedule: adaptive
    desired_kl: 0.01
    minimum_learning_rate: 1.0e-05
    maximum_learning_rate: 0.01
    n_epochs: 5
    num_mini_batches: 4
    batch_size: 24576
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    ent_coef: 0.005
    vf_coef: 1.0
    use_clipped_value_loss: true
    max_grad_norm: 1.0
