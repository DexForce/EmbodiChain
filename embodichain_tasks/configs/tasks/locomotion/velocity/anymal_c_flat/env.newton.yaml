id: ANYmalCFlatRL-v1
max_episode_steps: 1000
num_envs: 8
headless: true
device: cuda:0
arena_space: 4.0
render_cfg:
  renderer: hybrid
physics_config:
  sync_to_renderer: false
  gravity:
  - 0.0
  - 0.0
  - -9.81
  num_substeps: 1
  solver_cfg:
    solver_type: mujoco_warp
    njmax: 1024
    nconmax: 256
    iterations: 10
    ls_iterations: 20
    integrator: implicitfast
    separate_worlds: true
    tolerance: 1.0e-08
  physics_dt: 0.005
env:
  sim_steps_per_control: 4
  control_parts:
  - locomotion
  events: {}
  observations:
    policy:
      func: velocity_locomotion_observation
      mode: add
      name: policy
      params:
        privileged: false
        enable_corruption: false
    critic:
      func: velocity_locomotion_observation
      mode: add
      name: critic
      params:
        privileged: true
        enable_corruption: false
  rewards:
    total:
      func: velocity_locomotion_total_reward
      mode: add
      weight: 1.0
      params: {}
  actions:
    joint_position:
      func: DefaultJointPositionTerm
      params: {}
  extensions: {}
robot:
  uid: robot
  fpath: ANYmalCLocomotion/usd/anymal_c.usda
  build_pk_chain: false
  init_pos:
  - 0.0
  - 0.0
  - 0.6
  init_qpos:
  - 0.0
  - 0.0
  - 0.0
  - 0.0
  - 0.4
  - -0.4
  - 0.4
  - -0.4
  - -0.8
  - 0.8
  - -0.8
  - 0.8
  qpos_limits:
    LF_HAA:
    - -0.72
    - 0.49
    LF_HFE:
    - -6.283185307179586
    - 6.283185307179586
    LF_KFE:
    - -6.283185307179586
    - 6.283185307179586
    LH_HAA:
    - -0.72
    - 0.49
    LH_HFE:
    - -6.283185307179586
    - 6.283185307179586
    LH_KFE:
    - -6.283185307179586
    - 6.283185307179586
    RF_HAA:
    - -0.49
    - 0.72
    RF_HFE:
    - -6.283185307179586
    - 6.283185307179586
    RF_KFE:
    - -6.283185307179586
    - 6.283185307179586
    RH_HAA:
    - -0.49
    - 0.72
    RH_HFE:
    - -6.283185307179586
    - 6.283185307179586
    RH_KFE:
    - -6.283185307179586
    - 6.283185307179586
  control_parts:
    locomotion:
    - LF_HAA
    - LF_HFE
    - LF_KFE
    - LH_HAA
    - LH_HFE
    - LH_KFE
    - RF_HAA
    - RF_HFE
    - RF_KFE
    - RH_HAA
    - RH_HFE
    - RH_KFE
  root_props:
    fixed_base: false
    min_position_iters: 4
    min_velocity_iters: 0
    self_collision_enabled: true
  joint_drive_props:
    drive_type: force
    stiffness: 40.0
    damping: 5.0
    max_effort: 80.0
    max_velocity: 7.5
  asset_physics_mode: overlay
sensor:
- uid: locomotion_contacts
  sensor_type: ContactSensor
  articulation_cfg_list:
  - articulation_uid: robot
    link_name_list:
    - LF_FOOT
    - LH_FOOT
    - RF_FOOT
    - RH_FOOT
    - base
    - LF_THIGH
    - LH_THIGH
    - RF_THIGH
    - RH_THIGH
  filter_need_both_actor: false
  max_contacts_per_env: 96
  track_substeps: true
light: {}
background: []
rigid_object: []
rigid_object_group: []
articulation: []
physics: newton
