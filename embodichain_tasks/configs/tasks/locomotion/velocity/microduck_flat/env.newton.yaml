id: MicroDuckFlatRL-v1
max_episode_steps: 1000
num_envs: 8
headless: true
device: cuda:0
arena_space: 2.5
render_cfg:
  renderer: hybrid
physics_config:
  sync_to_renderer: false
  gravity:
  - 0.0
  - 0.0
  - -9.81
  num_substeps: 1
  solver_cfg:
    solver_type: mujoco_warp
    njmax: 1024
    nconmax: 256
    iterations: 10
    ls_iterations: 50
    integrator: implicitfast
    separate_worlds: true
    tolerance: 1.0e-08
  physics_dt: 0.002
env:
  sim_steps_per_control: 10
  control_parts:
  - locomotion
  events:
    push_robot:
      func: push_articulation_by_setting_velocity
      mode: interval
      interval_step: 1
      is_global: false
      params:
        entity_cfg:
          uid: robot
        interval_range_s:
        - 3.0
        - 6.0
        velocity_range:
          x:
          - -0.3
          - 0.3
          y:
          - -0.3
          - 0.3
          z:
          - 0.0
          - 0.0
          roll:
          - 0.0
          - 0.0
          pitch:
          - 0.0
          - 0.0
          yaw:
          - 0.0
          - 0.0
  observations:
    policy:
      func: velocity_locomotion_observation
      mode: add
      name: policy
      params:
        privileged: false
        enable_corruption: true
    critic:
      func: velocity_locomotion_observation
      mode: add
      name: critic
      params:
        privileged: true
        enable_corruption: false
  rewards:
    total:
      func: velocity_locomotion_total_reward
      mode: add
      weight: 1.0
      params: {}
  actions:
    joint_position:
      func: DefaultJointPositionAction
      params: {}
  extensions: {}
robot:
  uid: robot
  fpath: MicroDuckLocomotion/microduck.urdf
  build_pk_chain: false
  init_pos:
  - 0.0
  - 0.0
  - 0.12
  init_qpos:
  - 0.0
  - 0.3491
  - 0.0
  - -0.0873
  - 0.3491
  - 0.0873
  - -0.4579
  - 0.0
  - 0.4579
  - -0.0049
  - 0.0
  - 0.0049
  - 0.453
  - -0.453
  control_parts:
    locomotion:
    - left_hip_yaw
    - left_hip_roll
    - left_hip_pitch
    - left_knee
    - left_ankle
    - neck_pitch
    - head_pitch
    - head_yaw
    - head_roll
    - right_hip_yaw
    - right_hip_roll
    - right_hip_pitch
    - right_knee
    - right_ankle
  root_props:
    fixed_base: false
    min_position_iters: 4
    min_velocity_iters: 1
    self_collision_enabled: false
  joint_drive_props:
    drive_type: force
    stiffness:
      .*: 0.55
    damping:
      .*: 0.053
    max_effort:
      .*: 0.96
  asset_physics_mode: overlay
sensor:
- uid: locomotion_contacts
  sensor_type: ContactSensor
  articulation_cfg_list:
  - articulation_uid: robot
    link_name_list:
    - trunk_base
    - yaw2roll
    - hip_l
    - upper_leg_left
    - leg
    - ankle_left
    - neck
    - neck_pitch
    - yaw_roll_motion
    - jaw_soft
    - bearing_roll
    - hip_l_2
    - upper_leg_right
    - leg_2
    - ankle_right
  filter_need_both_actor: false
  max_contacts_per_env: 64
light: {}
background: []
rigid_object: []
rigid_object_group: []
articulation: []
physics: newton
