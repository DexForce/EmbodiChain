environment_id: repeated_pick_place
physics: newton
max_episodes: 1
max_episode_steps: 1200
num_envs: 1
arena_space: 2.5

# This is the Newton companion to envs/default.yaml. Keep the control
# cadence and scene geometry identical to the Default reference; only the backend-owned
# solver/contact fields differ.
physics_config:
  physics_dt: 0.01
  gravity: [0.0, 0.0, -9.81]
  # 0.5 ms solver steps keep the PGI grasp stable during the transport turn.
  num_substeps: 20
  collision_cfg: null
  solver_cfg:
    solver_type: dexuni
    mujoco_options:
      solver: newton
      integrator: implicitfast
      iterations: 20
      ls_iterations: 100
      cone: elliptic
      impratio: 1000.0
      enable_multiccd: true

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
      - uid: rect_light
        light_type: rect
        color: [1.0, 1.0, 1.0]
        intensity: 8.0
        init_pos: [-0.42, 0.08, 0.8]
        direction: [0.0, 0.0, -1.0]
        rect_width: 0.5
        rect_height: 0.5
  background: []
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.025]
      attrs:
        mass_props:
          mass: 0.05
        rigid_props:
          linear_damping: 0.2
          angular_damping: 0.2
        collision_props:
          backend: newton
          condim: 4
        material_props:
          dynamic_friction: 0.97
          static_friction: 0.99
          backend: newton
          # Contact stiffness/damping follows Newton's cube-stacking scale;
          # the same values are used on the PGI fingertips in the embodiment
          # component.  condim=4 enables the torsional term below.
          ke: 40000.0
          kd: 400.0
          torsional_friction: 0.1
          rolling_friction: 0.01
  rigid_object_group: []
  articulation: []

env:
  sim_steps_per_control: 4
  events: {}
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        # Keep the Newton deployment's dataset contract aligned with Default.
        save_path: /tmp/repeated-pick-place/datasets
        instruction:
          lang: Move the cube through the repeated pick and place program.
        extra:
          scene_type: tabletop
          task_description: repeated_pick_place_combined
          data_type: sim
        use_videos: true
