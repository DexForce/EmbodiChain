environment_id: repeated_pick_place
physics: default
max_episodes: 1
max_episode_steps: 1200
num_envs: 1
arena_space: 2.5

simulation:
  light:
    direct:
      - uid: main_light
        color: [0.6, 0.6, 0.6]
        intensity: 30.0
        init_pos: [1.0, 0.0, 3.0]
  background: []
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.025]
      attrs:
        mass_props:
          mass: 0.05
        rigid_props:
          linear_damping: 0.2
          angular_damping: 0.2
        material_props:
          dynamic_friction: 0.97
          static_friction: 0.99
  rigid_object_group: []
  articulation: []

env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
