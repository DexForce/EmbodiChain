id: TaskProgramRepeatedPickPlace-Generation-UR5-v1

environment:
  component: env.yaml

task_program:
  program: task_program/program.yaml
  integration: task_program/integration.yaml
  execution_policy: ../../../components/execution_policies/trajectory_open_loop.yaml

embodiment:
  component: ../../../components/embodiments/ur5_dh_pgi_140_80.yaml
  overrides:
    init_qpos: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0, 0.0, 0.0]

generation:
  runtime:
    num_envs: 16
    arena_space: 2.5
    simulation:
      light:
        direct:
          - uid: main_light
            light_type: sun
            color: [0.6, 0.6, 0.6]
            intensity: 5.0
            direction: [0.0, 0.0, -1.0]
          - uid: rect_light
            light_type: rect
            color: [1.0, 1.0, 1.0]
            intensity: 8.0
            init_pos: [-0.42, 0.08, 0.8]
            direction: [0.0, 0.0, -1.0]
            rect_width: 0.5
            rect_height: 0.5
    env:
      events:
        generation_profile_reset:
          func: apply_generation_profile_reset
          mode: reset
          params: {}
        record_camera:
          func: record_camera_data
          mode: interval
          interval_step: 1
          params:
            name: repeated_pick_place_16grid
            resolution: [320, 240]
            eye: [-1.25, -1.15, 0.95]
            target: [-0.25, -0.02, 0.25]
            up: [0.0, 0.0, 1.0]
            max_env_num: 16
            save_path: /tmp/repeated-pick-place-camera
  policy:
    component: ../../../components/generation_policies/task_program_episode.yaml
  overrides:
    source:
      source_id: repeated_cube_pick_place
      source_revision: config:repeated_pick_place_v1
      template_id: repeated_pick_place_episode
    scene_randomization:
      enabled: true
      reference_family_count: 4
      profile: cube_initial_pose
      change_scope: cube_initial_pose_only
      keep_drop_targets: true
    affordance:
      enabled: true
      branches_per_family: 4
      max_proposals: 128
      fallback: next_surviving_branch
    trajectory:
      variants_per_family: 4
      spatial:
        enabled: true
        operators: [joint_residual, via_points]
        joint_offset_scale: 0.005
        via_count: 1
      timing:
        enabled: false
    visual:
      enabled: true
      profile_file: generation_profiles/rgb_visual.yaml
      profiles: [rgb_canonical, rgb_material_01, rgb_camera_01, rgb_light_01]
      apply_per_rollout: true
      balance: round_robin
      restore_before_next_candidate: true
    observation:
      profiles: [rgb_lowres]
      capture_rgb: true
      capture_video: false
    scheduling:
      policy: round_robin_fifo
      candidate_budget: 64
      reference_family_budget: 4
      queue_max_items: 64
      queue_max_bytes: 536870912
    execution:
      max_inflight: 16
      compatibility: strict
      restore_initial_state: true
      cancel_policy: safe_finish_and_drain
    persistence:
      sink: lerobot
      output_dir: /tmp/repeated-pick-place-generation
      write_trajectories: true
      write_observations: true
      write_manifest: true
  candidate_indices: [0, 16, 32, 48]
