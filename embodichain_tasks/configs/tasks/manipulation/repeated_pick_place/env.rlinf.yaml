environment_id: repeated_pick_place_rlinf
physics: default
max_episodes: 1
max_episode_steps: 240
num_envs: 1
arena_space: 2.5

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  background:
    - uid: target
      shape:
        shape_type: Cube
        size: [0.11, 0.11, 0.01]
      body_type: kinematic
      init_pos: [-0.40, 0.48, 0.005]
      attrs:
        material_props: {static_friction: 0.0, dynamic_friction: 0.0}
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.025]
      attrs:
        mass_props: {mass: 0.05}
        rigid_props: {linear_damping: 0.2, angular_damping: 0.2}
        material_props: {dynamic_friction: 0.97, static_friction: 0.99}

env:
  sim_steps_per_control: 4
  observations:
    eef_pose:
      func: get_robot_eef_pose
      mode: add
      name: robot/eef_pose
      params: {part_name: arm, position_only: false}
  actions:
    eef_pose_gripper:
      func: EefPoseGripperTerm
      params: {scale: 1.0, pose_dim: 6, part_name: arm}
  rewards:
    success_bonus:
      func: success_reward
      mode: add
      weight: 10.0
      params: {}
