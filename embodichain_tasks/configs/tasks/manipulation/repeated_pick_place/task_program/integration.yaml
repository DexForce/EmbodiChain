scene:
  registry_id: task_program_repeated_pick_place
  rigid_objects:
  - entity_id: cube
    dynamics: dynamic
    semantic_type: cube
  antipodal_grasps:
  - entity_id: cube_grasp
    object_id: cube
robot_profile:
  profile_id: task_program_ur5_pick_place
  resources:
  - resource_id: manipulator
    endpoints:
    - endpoint_id: motion
      control_part: arm
      capabilities:
      - kinematics.batch_inverse
      - motion.cartesian_pose
      - kinematics.forward
    - endpoint_id: grasp
      control_part: hand
      capabilities:
      - interaction.grasp
      command_preset: parallel_jaw_commands
  command_presets:
  - preset_id: parallel_jaw_commands
    control_part: hand
    commands:
      open:
      - 0.0
      grasp:
      - 0.024
  defaults:
    pick_up:
      primary: manipulator
    place:
      primary: manipulator
  presets:
  - preset_id: trajectory
    action_options:
      pick:
        kind: pick_up
      place:
        kind: place
    motion:
      sample_count: 40
      dynamic_collision_mode: 'off'
    tracking:
      kind: timed
    recovery:
      max_replans: 0
      max_action_retries: 0
    workflow_recovery:
      max_recovery_attempts: 0
    runner:
      minimum_cycle_time: 0.0
      hold_on_completion: false
      hold_during_effect_verification: false
    effect_assurance: projected
    effect_monitors: {}
  default_preset: trajectory
runtime_services:
  grasp_pose_generators:
    hand:
      kind: antipodal_parallel_jaw
      sample_count: 1000
      opening_margin: 0.002
      point_sample_density: 0.012
      filter_ground_collision: false
      model: dh_pgi_140_80
