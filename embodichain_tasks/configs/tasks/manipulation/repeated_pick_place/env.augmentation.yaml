environment_id: repeated_pick_place_augmentation
physics: default
max_episodes: 5
max_episode_steps: 3000
num_envs: 4
arena_space: 2.5

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  background: []
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.025]
      attrs:
        mass_props:
          mass: 0.05
        rigid_props:
          linear_damping: 0.2
          angular_damping: 0.2
        material_props:
          dynamic_friction: 0.97
          static_friction: 0.99
  rigid_object_group: []
  articulation: []

env:
  sim_steps_per_control: 4
  events: {}
  expert_trajectory:
    affordance_augmentation:
      branches: 4
      max_batches: 200
      required_assurance: measured
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        robot_meta:
          robot_type: UR5
        instruction:
          lang: Pick and place the cube repeatedly between the two targets
        extra:
          task_description: Repeated cube pick and place with measured acceptance
          data_type: sim
        use_videos: false
