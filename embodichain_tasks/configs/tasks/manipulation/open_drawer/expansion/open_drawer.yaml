# Task-facing expansion overrides. Referenced by task.ur5.yaml.
policy:
  component: ../../../../components/expansion_policies/task_program_episode.yaml
overrides:
  source:
    source_id: slide_open_drawer
    source_revision: config:open_drawer_v1
    template_id: slide
    call_count: 1
    affordance_call_indices: []
    trajectory_call_indices: [0]
    phase_permissions:
      approach: []
      reach: []
      close: []
      pull: [joint_residual]
      open: []
    phase_kinds:
      approach: free
      reach: contact
      close: contact
      pull: free
      open: contact
  trajectory:
    variants_per_family: 3
    spatial:
      enabled: true
      operators: [joint_residual]
      joint_offset_scale: 0.001
      via_count: 1
    timing:
      enabled: false
  scheduling:
    policy: round_robin_fifo
    candidate_budget: 3
    reference_family_budget: 1
  persistence:
    sink: lerobot
    output_dir: /tmp/open-drawer-expansion
collection:
  target_episodes: 3
  max_attempts: 3
  selection:
    mode: sequential
    start_recipe_index: 0
