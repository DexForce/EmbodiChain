environment_id: open_drawer
max_episodes: 1
max_episode_steps: 600
num_envs: 1
arena_space: 3.0

simulation:
  light:
    direct:
      - uid: main_light
        color: [0.6, 0.6, 0.6]
        intensity: 30.0
        init_pos: [0.0, 0.0, 3.0]
  background: []
  rigid_object: []
  rigid_object_group: []
  articulation:
    - uid: drawer
      fpath: Drawer/model_split_links_with_inertials.urdf
      init_pos: [-1.1, 0.0, 0.0]
      init_rot: [0.0, 0.0, 90.0]
      init_qpos: [0.0]
      root_props:
        fixed_base: true
      asset_physics_mode: overlay
      joint_drive_props:
        drive_type: none
      attrs:
        material_props:
          static_friction: 1.0
          dynamic_friction: 1.0

env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
