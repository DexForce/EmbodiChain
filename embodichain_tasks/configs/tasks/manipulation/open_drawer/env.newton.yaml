environment_id: open_drawer
physics: newton
max_episodes: 1
max_episode_steps: 600
num_envs: 1
arena_space: 3.0

# Newton companion of env.yaml.  The drawer geometry, pose, and control period
# stay unchanged so the Default and Newton traces can be compared directly.
physics_config:
  physics_dt: 0.01
  gravity: [0.0, 0.0, -9.81]
  num_substeps: 20
  collision_cfg: null
  solver_cfg:
    solver_type: mujoco_warp
    solver: newton
    integrator: implicitfast
    iterations: 20
    ls_iterations: 100
    cone: elliptic
    impratio: 1000.0
    use_mujoco_contacts: true
    enable_multiccd: true

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  background: []
  rigid_object: []
  rigid_object_group: []
  articulation:
    - uid: drawer
      fpath: Drawer/model_split_links_with_inertials.urdf
      init_pos: [-1.1, 0.0, 0.0]
      init_rot: [0.0, 0.0, 90.0]
      init_qpos: [0.0]
      root_props:
        fixed_base: true
      asset_physics_mode: overlay
      joint_drive_props:
        drive_type: none
      attrs:
        material_props:
          static_friction: 1.0
          dynamic_friction: 1.0
      link_attrs:
        newton_handle_contacts:
          link_names_expr: ["large_handle_bar"]
          attrs:
            collision_props:
              backend: newton
              condim: 4
            material_props:
              backend: newton
              ke: 40000.0
              kd: 400.0
              torsional_friction: 0.1
              rolling_friction: 0.01

env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
