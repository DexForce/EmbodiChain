environment_id: twist
physics: default
max_episodes: 1
max_episode_steps: 600
num_envs: 1
arena_space: 3.0

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  background: []
  rigid_object: []
  rigid_object_group: []
  articulation:
    - uid: microwave
      fpath: MicrowaveOven/microwave_oven_with_inertials.urdf
      init_pos: [-1.0, -0.30, 0.4]
      init_rot: [0.0, 0.0, 90.0]
      init_qpos: [0.0, 0.0, 0.0, 0.0]
      root_props:
        fixed_base: true
      asset_physics_mode: overlay
      joint_drive_props:
        drive_type: force
        # Hold unrelated joints; the manipulated knob has damping only.
        target_mode:
          "door_hinge|start_button_press|timer_knob_rotation": position_velocity
          power_knob_rotation: velocity
        stiffness:
          "door_hinge|start_button_press|timer_knob_rotation": 1.0
          power_knob_rotation: 0.0
        damping: 1.0
        max_effort:
          "door_hinge|start_button_press|timer_knob_rotation": 0.1
          power_knob_rotation: 0.05

env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
