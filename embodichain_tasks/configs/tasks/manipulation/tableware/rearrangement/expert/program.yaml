program_id: arrange_fork_and_spoon_around_plate
integration:
  robot_profile: expert_program_cobotmagic_rearrangement
  scene_registry: expert_program_tableware_rearrangement
  runtime_preset: trajectory
targets:
  fork_target_pose:
    kind: cyclic_pose
    values:
      - position: [0.6, 0.16, 0.884]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  spoon_target_pose:
    kind: cyclic_pose
    values:
      - position: [0.6, -0.16, 0.887]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
program:
  kind: sequence
  items:
    - kind: segment
      name: push_fork_toward_plate_slot
      steps:
        kind: sequence
        items:
          - kind: invoke
            call:
              kind: registered
              call_id: simulation.push_object
              arguments:
                object: fork
                target: plate_fork_slot
              resources:
                primary: left_manipulator
      post:
        - kind: wait_stable
          entity: fork
    - kind: segment
      name: refine_fork_at_plate_slot
      steps:
        kind: sequence
        items:
          - kind: invoke
            call:
              kind: registered
              call_id: simulation.push_object
              arguments:
                object: fork
                target: plate_fork_slot
              resources:
                primary: left_manipulator
      post:
        - kind: wait_stable
          entity: fork
      validators:
        - kind: object_near_target
          object: fork
          target: fork_target_pose
          position_tolerance: 0.075
    - kind: segment
      name: push_spoon_toward_plate_slot
      steps:
        kind: sequence
        items:
          - kind: invoke
            call:
              kind: registered
              call_id: simulation.push_object
              arguments:
                object: spoon
                target: plate_spoon_slot
              resources:
                primary: right_manipulator
      post:
        - kind: wait_stable
          entity: spoon
    - kind: segment
      name: refine_spoon_at_plate_slot
      steps:
        kind: sequence
        items:
          - kind: invoke
            call:
              kind: registered
              call_id: simulation.push_object
              arguments:
                object: spoon
                target: plate_spoon_slot
              resources:
                primary: right_manipulator
      post:
        - kind: wait_stable
          entity: spoon
      validators:
        - kind: object_near_target
          object: spoon
          target: spoon_target_pose
          position_tolerance: 0.075
