program_id: pour_water_with_right_arm
integration:
  robot_profile: task_program_cobotmagic_pour
  scene_registry: task_program_pour_water
  runtime_preset: trajectory
targets:
  bottle_return_pose:
    kind: cyclic_pose
    values:
      - position: [0.75, -0.1, 0.962]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
program:
  kind: segment
  name: pour_and_return_bottle
  steps:
    kind: sequence
    items:
      - kind: invoke
        call:
          kind: pick
          object: bottle
          grasp: bottle_grasp
          resources:
            primary: right_manipulator
      - kind: invoke
        call:
          kind: registered
          call_id: simulation.move_held_object
          arguments:
            target: cup_pour_pose
          resources:
            primary: right_manipulator
      - kind: invoke
        call:
          kind: registered
          call_id: simulation.pour
          arguments:
            object: bottle
          resources:
            primary: right_manipulator
      - kind: invoke
        call:
          kind: place
          object: bottle
          at:
            kind: target_ref
            target: bottle_return_pose
          resources:
            primary: right_manipulator
  post:
    - kind: wait_stable
      entity: bottle
    - kind: wait_stable
      entity: cup
  validators:
    - kind: object_near_target
      object: bottle
      target: bottle_return_pose
      position_tolerance: 0.05
