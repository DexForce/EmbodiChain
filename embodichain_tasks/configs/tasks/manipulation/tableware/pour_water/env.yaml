environment_id: pour_water
max_episodes: 5
max_episode_steps: 600
num_envs: 1
arena_space: 3.0

simulation:
  light:
    direct:
      - uid: light_1
        light_type: point
        color: [1.0, 1.0, 1.0]
        intensity: 50.0
        init_pos: [2, 0, 2]
        radius: 10.0
  background:
    - uid: table
      shape:
        shape_type: Mesh
        fpath: CircleTableSimple/circle_table_simple.ply
        compute_uv: true
      attrs:
        mass_props:
          mass: 10.0
        material_props:
          static_friction: 0.95
          dynamic_friction: 0.9
          restitution: 0.01
      body_scale: [1, 1, 1]
      body_type: kinematic
      init_pos: [0.725, 0.0, 0.825]
      init_rot: [0, 90, 0]
  rigid_object:
    - uid: cup
      shape:
        shape_type: Mesh
        fpath: PaperCup/paper_cup.ply
        compute_uv: true
        collision:
          approximation: convex_decomposition
          max_hulls: 8
      attrs:
        mass_props:
          mass: 0.01
        rigid_props:
          max_depenetration_velocity: 10.0
          min_position_iters: 32
          min_velocity_iters: 8
        collision_props:
          contact_offset: 0.003
          rest_offset: 0.001
        material_props:
          restitution: 0.01
      init_pos: [0.75, 0.1, 0.9]
      body_scale: [0.75, 0.75, 1.0]
    - uid: bottle
      shape:
        shape_type: Mesh
        fpath: ScannedBottle/kashijia_processed.ply
        compute_uv: true
        collision:
          approximation: convex_decomposition
          max_hulls: 8
      attrs:
        mass_props:
          mass: 0.01
        rigid_props:
          max_depenetration_velocity: 10.0
          min_position_iters: 32
          min_velocity_iters: 8
        collision_props:
          contact_offset: 0.003
          rest_offset: 0.001
        material_props:
          restitution: 0.01
      init_pos: [0.75, -0.1, 0.932]
      body_scale: [1, 1, 1]
  rigid_object_group: []
  articulation: []

env:
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        position_range:
          - [-0.5, -0.5, 2]
          - [0.5, 0.5, 2]
        color_range:
          - [0.6, 0.6, 0.6]
          - [1, 1, 1]
        intensity_range: [50.0, 100.0]
    settle_pour_objects_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: bottle
          - uid: cup
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        robot_meta:
          robot_type: CobotMagic
        instruction:
          lang: Pour water from bottle to cup
        extra:
          scene_type: Commercial
          task_description: Pour water
          data_type: sim
        use_videos: true
  control_parts: [left_arm, left_eef, right_arm, right_eef]
