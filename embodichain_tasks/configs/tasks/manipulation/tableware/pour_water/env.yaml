id: PourWater-v1
max_episodes: 5
max_episode_steps: 600
num_envs: 1
arena_space: 3.0

task_program:
  program: task_program/program.yaml
  integration: task_program/integration.yaml
  execution_policy: ../../../../components/execution_policies/trajectory_open_loop_dense.yaml

embodiment:
  component: ../../../../components/embodiments/cobotmagic_right_arm.yaml

scene:
  component: task_program/scene.yaml

env:
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        position_range:
          - [-0.5, -0.5, 2]
          - [0.5, 0.5, 2]
        color_range:
          - [0.6, 0.6, 0.6]
          - [1, 1, 1]
        intensity_range: [50.0, 100.0]
    settle_pour_objects_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: bottle
          - uid: cup
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        robot_meta:
          robot_type: CobotMagic
        instruction:
          lang: Pour water from bottle to cup
        extra:
          scene_type: Commercial
          task_description: Pour water
          data_type: sim
        use_videos: true
  control_parts: [left_arm, left_eef, right_arm, right_eef]
