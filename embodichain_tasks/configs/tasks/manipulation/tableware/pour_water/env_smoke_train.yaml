environment_id: pour_water
max_episodes: 16
max_episode_steps: 600
num_envs: 1
arena_space: 3.0
simulation:
  light:
    direct:
    - uid: light_1
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 50.0
      init_pos:
      - 2
      - 0
      - 2
      radius: 10.0
  background:
  - uid: table
    shape:
      shape_type: Mesh
      fpath: CircleTableSimple/circle_table_simple.ply
      compute_uv: true
    attrs:
      mass_props:
        mass: 10.0
      rigid_props:
        angular_damping: 0.7
        linear_damping: 0.7
        max_depenetration_velocity: 10.0
        sleep_threshold: 0.001
        min_position_iters: 4
        min_velocity_iters: 1
        max_linear_velocity: 100.0
        max_angular_velocity: 100.0
        enable_ccd: false
      collision_props:
        contact_offset: 0.002
        rest_offset: 0.0
      material_props:
        restitution: 0.01
        dynamic_friction: 0.9
        static_friction: 0.95
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    init_rot:
    - 0
    - 90
    - 0
  rigid_object:
  - uid: cup
    shape:
      shape_type: Mesh
      fpath: PaperCup/paper_cup.ply
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 8
        acd_method: coacd
    attrs:
      mass_props:
        mass: 0.01
      rigid_props:
        angular_damping: 0.7
        linear_damping: 0.7
        max_depenetration_velocity: 10.0
        sleep_threshold: 0.001
        min_position_iters: 32
        min_velocity_iters: 8
        max_linear_velocity: 100.0
        max_angular_velocity: 100.0
        enable_ccd: false
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        restitution: 0.01
        dynamic_friction: 0.5
        static_friction: 0.5
    init_pos:
    - 0.75
    - 0.1
    - 0.9
    body_scale:
    - 0.75
    - 0.75
    - 1.0
  - uid: bottle
    shape:
      shape_type: Mesh
      fpath: ScannedBottle/kashijia_processed.ply
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 8
        acd_method: coacd
    attrs:
      mass_props:
        mass: 0.01
      rigid_props:
        angular_damping: 0.7
        linear_damping: 0.7
        max_depenetration_velocity: 10.0
        sleep_threshold: 0.001
        min_position_iters: 32
        min_velocity_iters: 8
        max_linear_velocity: 100.0
        max_angular_velocity: 100.0
        enable_ccd: false
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        restitution: 0.01
        dynamic_friction: 0.5
        static_friction: 0.5
    init_pos:
    - 0.75
    - -0.1
    - 0.932
    body_scale:
    - 1
    - 1
    - 1
  rigid_object_group: []
  articulation: []
env:
  observations:
    cup_pose:
      func: get_rigid_object_pose
      mode: add
      name: observation/cup_pose
      params:
        entity_cfg:
          uid: cup
    bottle_pose:
      func: get_rigid_object_pose
      mode: add
      name: observation/bottle_pose
      params:
        entity_cfg:
          uid: bottle
  events:
    randomize_cup:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: cup
        position_range:
        - - 0.74
          - 0.09
          - 0.9
        - - 0.76
          - 0.11
          - 0.9
        rotation_range:
        - - 0
          - 0
          - -2.0
        - - 0
          - 0
          - 2.0
        relative_position: false
    randomize_bottle:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: bottle
        position_range:
        - - 0.74
          - -0.11
          - 0.932
        - - 0.76
          - -0.09
          - 0.932
        rotation_range:
        - - 0
          - 0
          - -2.0
        - - 0
          - 0
          - 2.0
        relative_position: false
    settle_pour_objects_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: bottle
        - uid: cup
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        robot_meta:
          robot_type: CobotMagic
        instruction:
          lang: Pour water from bottle to cup
        extra:
          scene_type: Commercial
          task_description: Pour water
          data_type: sim
          spatial_profile: smoke_train
        use_videos: true
        save_path: /path/to/datasets/embodichain/pour_water/smoke/train
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
physics: default
