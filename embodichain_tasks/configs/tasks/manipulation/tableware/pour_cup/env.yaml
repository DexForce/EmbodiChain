environment_id: pour_cup
physics: default
max_episodes: 1
max_episode_steps: 1200
num_envs: 1
arena_space: 2.5

physics_config:
  physics_dt: 0.005
  gravity: [0.0, 0.0, -9.81]
  enable_ccd: true

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [1.0, 1.0, 1.0]
        intensity: 4.0
        direction: [-0.3, 0.2, -1.0]
      - uid: fill_light
        light_type: rect
        color: [1.0, 1.0, 1.0]
        intensity: 6.0
        init_pos: [-0.5, -0.4, 1.2]
        direction: [0.0, 0.0, -1.0]
        rect_width: 0.7
        rect_height: 0.7
  background: []
  rigid_object:
    - uid: cup
      shape:
        shape_type: Mesh
        fpath: PourCupDemo/cup.glb
        compute_uv: true
        collision:
          approximation: convex_decomposition
          max_hulls: 32
      body_type: dynamic
      init_pos: [-0.485, -0.08, 0.052]
      body_scale: [1.0, 1.0, 1.0]
      attrs:
        mass_props:
          mass: 0.30
        rigid_props:
          linear_damping: 0.2
          angular_damping: 0.2
          min_position_iters: 64
          min_velocity_iters: 16
          max_depenetration_velocity: 1.0
        collision_props:
          contact_offset: 0.0005
          rest_offset: 0.0001
          torsional_patch_radius: 0.009
          min_torsional_patch_radius: 0.008
        material_props:
          dynamic_friction: 1.2
          static_friction: 1.2
          restitution: 0.0
  rigid_object_group: []
  articulation: []

env:
  sim_steps_per_control: 10
  control_parts: [arm, eef]
  events:
    settle_cup:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: cup
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
    record_demo:
      func: record_camera_data
      mode: interval
      interval_step: 1
      params:
        name: franka_side_pour_mug
        resolution: [1280, 960]
        intrinsics: [1000.0, 1000.0, 640.0, 480.0]
        eye: [-1.1, -1.25, 0.85]
        target: [-0.22, -0.02, 0.32]
        up: [0.0, 0.0, 1.0]
        save_path: outputs/franka_pour_cup/videos
  dataset: {}
