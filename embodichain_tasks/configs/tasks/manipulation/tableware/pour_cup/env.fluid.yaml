environment_id: pour_cup_fluid
physics: newton
num_envs: 2
arena_space: 2.5
max_episode_steps: 2000
max_episodes: 1
physics_config:
  physics_dt: 0.0006944444444444445
  num_substeps: 1
  collision_cfg: null
  solver_cfg:
    solver_type: sph
    sph_method: dfsph
    particle_support_radius: 0.003375
    max_neighbors: 192
    viscosity: 0.0006
    surface_tension_coefficient: 0.002
    surface_normal_threshold: 0.08
    pressure_relaxation: 0.2
    divergence_max_iterations: 10
    density_max_iterations: 20
    max_velocity: 2.0
    volume_map_boundary_enabled: true
    volume_map_resolution: 192
    volume_map_quadrature_samples: 6
    volume_map_volume_scale: 0.8
    sdf_boundary_enabled: false
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 4.0
      direction:
      - -0.3
      - 0.2
      - -1.0
    - uid: fill_light
      light_type: rect
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 6.0
      init_pos:
      - -0.5
      - -0.4
      - 1.2
      direction:
      - 0.0
      - 0.0
      - -1.0
      rect_width: 0.7
      rect_height: 0.7
  background:
  - uid: cup_platform
    body_type: kinematic
    shape:
      shape_type: Mesh
      fpath: ./assets/fluid_table.obj
      collision:
        approximation: sdf
        force_sdf: false
        sdf_resolution: 192
        sdf_narrow_band_range:
        - -0.025
        - 0.025
        sdf_padding: 0.012
        sdf_texture_format: uint16
      visual_material:
        uid: fluid_table
        base_color:
        - 0.23
        - 0.29
        - 0.34
        - 1.0
        roughness: 0.6
        metallic: 0.5
        ior: 1.0
    init_pos:
    - -0.91
    - -0.08
    - 0.25
    attrs:
      collision_props:
        backend: newton
        has_particle_collision: true
      material_props:
        backend: newton
        dynamic_friction: 0.2
  - uid: fluid_floor
    body_type: kinematic
    shape:
      shape_type: Mesh
      fpath: ./assets/fluid_floor.obj
      collision:
        approximation: sdf
        force_sdf: false
        sdf_resolution: 192
        sdf_narrow_band_range:
        - -0.025
        - 0.025
        sdf_padding: 0.012
        sdf_texture_format: uint16
    init_pos:
    - -0.5
    - 0
    - -0.055
    attrs:
      collision_props:
        backend: newton
        has_particle_collision: true
      material_props:
        backend: newton
        dynamic_friction: 0.2
    render_enabled: false
  - uid: cup
    body_type: kinematic
    shape:
      shape_type: Mesh
      fpath: ./assets/mug_wall.obj
      collision:
        approximation: sdf
        force_sdf: false
        sdf_resolution: 192
        sdf_narrow_band_range:
        - -0.025
        - 0.025
        sdf_padding: 0.012
        sdf_texture_format: uint16
    init_pos:
    - -0.75
    - 0
    - 0.552
    attrs:
      collision_props:
        backend: newton
        has_particle_collision: true
      material_props:
        backend: newton
        dynamic_friction: 0.2
    visual_shape:
      shape_type: Mesh
      fpath: ./assets/cup.glb
  - uid: receiver
    body_type: kinematic
    shape:
      shape_type: Mesh
      fpath: ./assets/receiver_wall.obj
      collision:
        approximation: sdf
        force_sdf: false
        sdf_resolution: 192
        sdf_narrow_band_range:
        - -0.025
        - 0.025
        sdf_padding: 0.012
        sdf_texture_format: uint16
      visual_material:
        uid: fluid_receiver
        base_color:
        - 0.82
        - 0.85
        - 0.88
        - 1.0
        roughness: 0.22
        metallic: 0.5
        ior: 1.0
    init_pos:
    - -0.755
    - -0.137
    - 0.5
    attrs:
      collision_props:
        backend: newton
        has_particle_collision: true
      material_props:
        backend: newton
        dynamic_friction: 0.2
  fluid_object:
  - uid: water
    density: 1000.0
    particle_spacing: 0.0015
    particle_radius: 0.00045
    spawn:
      kind: points
      file_path: ./assets/water_fill.npz
      reference_uid: cup
    render:
      mode: mesh_surface
      render_radius: 0.00045
      clip_below_z: 0.49
      material:
        base_color:
        - 0.9452768
        - 0.982207
        - 1.0
        - 1.0
        roughness: 0.025
        metallic: 0.0
        ior: 1.333
        transmission: 0.96
        volume_thickness: 0.04
        volume_attenuation_distance: 0.6
        volume_attenuation_color:
        - 0.8
        - 0.92
        - 1.0
      mesh_surface:
        gpu_enabled: true
        cell_size: 0.0008100000000000001
        max_res: 512
        kernel_radius: 0.001515
        iso_density: 0.57
        density_smooth_iters: 2
        aabb_trim_fraction: 0.0
        min_component_tris: 32
        laplacian_iters: 4
        laplacian_alpha: 0.11
        update_period: 1
env:
  sim_steps_per_control: 60
  control_parts:
  - arm
  - eef
  observations:
    water_summary:
      func: get_fluid_summary
      mode: add
      name: fluid/summary
      params:
        entity_cfg:
          uid: water
      extra:
        shape:
        - 5
    received_volume:
      func: get_fluid_volume_in_region
      mode: add
      name: fluid/received_volume
      params:
        entity_cfgs:
        - uid: water
        - uid: receiver
        lower:
        - -0.1
        - -0.1
        - 0.0045000000000000005
        upper:
        - 0.1
        - 0.1
        - 0.0675
        sphere_center:
        - 0
        - 0
        - 0.088
        sphere_radius: 0.093
      extra:
        shape:
        - 1
  dataset: {}
