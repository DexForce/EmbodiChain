environment_id: pour_cup
physics: newton
max_episodes: 1
max_episode_steps: 1400
num_envs: 1
arena_space: 2.5

physics_config:
  physics_dt: 0.005
  gravity: [0.0, 0.0, -9.81]
  # Each 5 ms physics step contains fifty 0.1 ms MuJoCo solver steps.
  num_substeps: 50
  collision_cfg: null
  solver_cfg:
    solver_type: mujoco_warp
    solver: newton
    integrator: implicitfast
    iterations: 50
    ls_iterations: 100
    cone: elliptic
    impratio: 1000.0
    use_mujoco_contacts: true
    enable_multiccd: true

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [1.0, 1.0, 1.0]
        intensity: 4.0
        direction: [-0.3, 0.2, -1.0]
      - uid: fill_light
        light_type: rect
        color: [1.0, 1.0, 1.0]
        intensity: 6.0
        init_pos: [-0.5, -0.4, 1.2]
        direction: [0.0, 0.0, -1.0]
        rect_width: 0.7
        rect_height: 0.7
  background:
    - uid: cup_platform
      shape:
        shape_type: Cube
        size: [0.4, 0.5, 0.5]
      body_type: static
      init_pos: [-0.9, 0.0, 0.25]
      attrs:
        collision_props:
          backend: newton
          condim: 6
        material_props:
          backend: newton
          dynamic_friction: 1.0
          ke: 400000.0
          kd: 1265.0
          torsional_friction: 0.1
          rolling_friction: 0.03
  rigid_object:
    - uid: cup
      shape:
        shape_type: Mesh
        fpath: PourCupDemo/cup.glb
        compute_uv: true
        collision:
          approximation: convex_decomposition
          max_hulls: 32
      body_type: dynamic
      init_pos: [-0.75, 0.0, 0.552]
      body_scale: [1.0, 1.0, 1.0]
      attrs:
        mass_props:
          mass: 0.30
        collision_props:
          backend: newton
          contact_offset: 0.0005
          rest_offset: 0.0001
          condim: 6
        material_props:
          backend: newton
          dynamic_friction: 1.2
          ke: 400000.0
          kd: 1265.0
          torsional_friction: 0.1
          rolling_friction: 0.03
  rigid_object_group: []
  articulation: []

env:
  sim_steps_per_control: 10
  control_parts: [arm, eef]
  events:
    settle_cup:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: cup
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
    record_demo:
      func: record_camera_data
      mode: interval
      interval_step: 1
      params:
        name: franka_newton_smooth_pour_mug
        resolution: [1280, 960]
        intrinsics: [1000.0, 1000.0, 640.0, 480.0]
        eye: [-1.4, -1.5, 1.15]
        target: [-0.4, 0.0, 0.45]
        up: [0.0, 0.0, 1.0]
        save_path: outputs/franka_pour_cup/videos
  dataset: {}
