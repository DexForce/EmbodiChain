      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  background: []
  rigid_object: []
  rigid_object_group: []
  articulation:
    - uid: rubiks_cube
