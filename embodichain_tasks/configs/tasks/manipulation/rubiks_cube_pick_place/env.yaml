      init_pos: [-0.42, -0.10878000028431416, 0.0288]
      init_qpos: [0.0]
      qpos_limits:
        top_turn: [0.0, 0.0]
      root_props:
        fixed_base: false

env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
