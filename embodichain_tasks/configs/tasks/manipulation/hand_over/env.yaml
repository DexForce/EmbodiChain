id: HandOver-v1
max_episodes: 1
max_episode_steps: 1200
num_envs: 1
arena_space: 3.0

physics_config:
  enable_ccd: true

task_program:
  program: task_program/program.yaml
  integration: task_program/integration.yaml
  execution_policy: ../../../components/execution_policies/motion_gen_verified.yaml

embodiment:
  component: ../../../components/embodiments/dual_ur5_handover.yaml

scene:
  component: task_program/scene.yaml

env:
  sim_steps_per_control: 4
  events:
    settle_can_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: handover_object
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  extensions: {}
