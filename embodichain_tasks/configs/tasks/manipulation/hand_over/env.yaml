environment_id: hand_over
physics: default
max_episodes: 1
max_episode_steps: 1200
num_envs: 1
arena_space: 3.0

physics_config:
  enable_ccd: true

simulation:
  light:
    direct:
      - uid: main_light
        color: [0.6, 0.6, 0.6]
        intensity: 30.0
        init_pos: [0.0, -0.4, 3.0]
  background:
    - uid: support_surface
      shape:
        shape_type: Cube
        size: [0.8, 1.2, 0.02]
      attrs:
        mass_props:
          mass: 10.0
        material_props:
          dynamic_friction: 0.9
          static_friction: 0.95
          restitution: 0.01
      body_type: static
      init_pos: [0.0, 0.0, 0.49]
      init_rot: [0.0, 0.0, 0.0]
  rigid_object:
    - uid: handover_object
      shape:
        shape_type: Mesh
        fpath: SodaCan/simple_cola_can.obj
        compute_uv: false
        collision:
          approximation: convex_decomposition
          max_hulls: 16
      attrs:
        mass_props:
          mass: 0.33
        rigid_props:
          angular_damping: 1.0
          linear_damping: 0.5
          min_position_iters: 32
          min_velocity_iters: 8
          max_depenetration_velocity: 2.0
        collision_props:
          contact_offset: 0.001
          rest_offset: 0.0
        material_props:
          dynamic_friction: 0.97
          static_friction: 0.99
          restitution: 0.01
      init_pos: [0.0, 0.02, 0.62]
      init_rot: [90.0, 0.0, 0.0]
      body_scale: [0.56, 0.56, 0.56]
  rigid_object_group: []
  articulation: []

env:
  sim_steps_per_control: 4
  events:
    settle_can_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: handover_object
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  extensions: {}
