scene_id: dual_ur5_handover_default

simulation:
  light:
    direct:
      - uid: main_light
        color: [0.6, 0.6, 0.6]
        intensity: 30.0
        init_pos: [0.0, -0.4, 3.0]
  background:
    - uid: support_surface
      shape:
        shape_type: Cube
        size: [0.8, 1.2, 0.02]
      attrs:
        mass: 10.0
        dynamic_friction: 0.9
        static_friction: 0.95
        restitution: 0.01
      body_type: static
      init_pos: [0.0, 0.0, 0.49]
      init_rot: [0.0, 0.0, 0.0]
  rigid_object:
    - uid: handover_object
      shape:
        shape_type: Mesh
        fpath: SodaCan/simple_cola_can.obj
        compute_uv: false
      attrs:
        mass: 0.33
        dynamic_friction: 0.97
        static_friction: 0.99
        angular_damping: 1.0
        linear_damping: 0.5
        contact_offset: 0.001
        rest_offset: 0.0
        restitution: 0.01
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      max_convex_hull_num: 16
      init_pos: [0.0, 0.02, 0.62]
      init_rot: [90.0, 0.0, 0.0]
      body_scale: [0.56, 0.56, 0.56]
  rigid_object_group: []
  articulation: []

task_program:
  contract_id: hand_over_scene_v1
  registry_id: dual_ur5_handover_v1
  rigid_objects:
    - entity_id: can
      simulation_uid: handover_object
      dynamics: dynamic
      semantic_type: soda_can
      affordances:
        - entity_id: can_antipodal_grasp
          kind: antipodal_grasp
    - entity_id: support_surface
      dynamics: static
      semantic_type: support_surface
