environment_id: press
physics: default
max_episodes: 1
max_episode_steps: 600
num_envs: 1
arena_space: 3.0

simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  background: []
  rigid_object: []
  rigid_object_group: []
  articulation:
    - uid: microwave
      fpath: MicrowaveOven/microwave_oven_with_inertials.urdf
      init_pos: [-1.0, -0.30, 0.4]
      init_rot: [0.0, 0.0, 90.0]
      init_qpos: [0.0, 0.0, 0.0, 0.0]
      root_props:
        fixed_base: true
      asset_physics_mode: overlay
      joint_drive_props:
        drive_type: force
        stiffness: 0.001
        damping: 100.0
        max_effort: 0.01

env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
