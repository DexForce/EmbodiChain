environment_id: repeated_move_joint
physics: default
max_episode_steps: 2000
num_envs: 1
arena_space: 2.5
simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
env:
  sim_steps_per_control: 1
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: /tmp/embodichain-manipulation/repeated_move_joint/datasets
        extra:
          scene_type: tabletop
          task_description: repeated_move_joint
          data_type: sim
        use_videos: true
  seed: 0
