<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmbodiChain · 扩增结果回放</title>
<link rel="stylesheet" href="/preview.css">
<header>
  <div>
    <h1 data-text="title"></h1>
    <p data-text="subtitle"></p>
  </div>
  <div class="header-controls">
    <label class="language-control" for="language">
      <span data-text="language"></span>
      <select id="language">
        <option value="zh-CN" lang="zh-CN" selected>简体中文</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
    <span class="badge" id="connection"></span>
  </div>
</header>
<main>
  <section class="stage">
    <div class="toolbar">
      <button id="play" aria-keyshortcuts="Space"></button>
      <button id="reset" data-text="reset"></button>
      <select id="align" data-label="alignment">
        <option value="phase" data-text="alignPhase"></option>
        <option value="time" data-text="alignTime"></option>
      </select>
      <select id="camera" data-label="camera">
        <option value="custom" data-text="cameraCustom"></option>
        <option value="orbit" data-text="cameraOrbit"></option>
        <option value="top" data-text="cameraTop"></option>
        <option value="front" data-text="cameraSide"></option>
        <option value="close" data-text="cameraClose"></option>
      </select>
      <span class="controls-help"><kbd data-text="spaceKey"></kbd> <span data-text="controlsHelp"></span></span>
    </div>
    <div class="viewport" id="viewport">
      <div class="overlay" id="caption"></div>
    </div>
    <div class="timeline">
      <input id="progress" data-label="progress" type="range" min="0" max="1000" value="400">
      <div class="timeinfo"><span id="clock">—</span><span id="phase">—</span></div>
    </div>
  </section>
  <aside class="side">
    <section class="panel" id="coverage-panel" hidden>
      <h2 data-text="coverageTitle"></h2>
      <p id="coverage-summary"></p>
      <details>
        <summary data-text="coverageDetails"></summary>
        <div class="detail" id="coverage-details"></div>
      </details>
    </section>
    <section class="panel">
      <h2 data-text="filters"></h2>
      <div class="field">
        <label for="space" data-text="layoutGroup"></label>
        <select id="space"><option value="all" data-text="allSpaces"></option></select>
      </div>
      <div class="field">
        <label for="aff" data-text="affordance"></label>
        <select id="aff"><option value="all" data-text="allAffordances"></option></select>
      </div>
      <div class="field">
        <label for="variant" data-text="trajectory"></label>
        <select id="variant"><option value="all" data-text="allVariants"></option></select>
      </div>
      <div><strong class="count" id="count">—</strong><span id="total" data-text="matching"></span></div>
      <div class="candidates" id="candidates"></div>
    </section>
    <section class="panel">
      <h2 data-text="layers"></h2>
      <div class="field"><label for="ghosts" data-text="showGhosts"></label><input id="ghosts" type="checkbox"></div>
      <div class="field"><label for="paths" data-text="showPaths"></label><input id="paths" type="checkbox" checked></div>
      <div class="field"><label for="targets" data-text="showTargets"></label><input id="targets" type="checkbox" checked></div>
      <div class="field"><label for="positions" data-text="showPositions"></label><input id="positions" type="checkbox" checked></div>
      <div class="legend" data-text="layersHelp"></div>
    </section>
    <section class="panel">
      <h2 data-text="execution"></h2>
      <div class="detail" id="detail"></div>
    </section>
  </aside>
  <section class="deviations" aria-labelledby="deviation-title">
    <div class="chart-heading">
      <div>
        <h2 id="deviation-title" data-text="deviations"></h2>
        <p id="deviation-description"></p>
      </div>
      <output id="deviation-time"></output>
    </div>
    <div class="chart-grid" id="deviation-panels" hidden>
      <section class="panel" id="tcp-deviations"><h3 data-text="tcpDeviations"></h3></section>
      <section class="panel" id="joint-deviations"><h3 data-text="jointDeviations"></h3></section>
    </div>
  </section>
  <section class="heatmap" aria-labelledby="heatmap-title">
    <h2 id="heatmap-title" data-text="heatmapTitle"></h2>
    <p id="heatmap-description"></p>
    <div class="heatmap-panel panel" id="heatmap-panel" hidden>
      <canvas id="heatmap-plot" role="img"></canvas>
      <div>
        <label class="heatmap-controls" for="heatmap-object">
          <span data-text="heatmapObject"></span>
          <select id="heatmap-object"></select>
        </label>
        <dl>
          <div><dt data-text="heatmapX"></dt><dd id="heatmap-x"></dd></div>
          <div><dt data-text="heatmapY"></dt><dd id="heatmap-y"></dd></div>
          <div><dt data-text="heatmapCellSize"></dt><dd id="heatmap-step"></dd></div>
          <div><dt data-text="heatmapMostVisited"></dt><dd id="heatmap-peak"></dd></div>
        </dl>
        <div class="heatmap-legend">
          <span data-text="heatmapLegend"></span>
          <div class="heatmap-scale" id="heatmap-scale" aria-hidden="true"></div>
          <div class="heatmap-ticks"><span>0</span><span id="heatmap-scale-max"></span></div>
        </div>
        <output id="heatmap-cell" class="heatmap-readout"></output>
      </div>
    </div>
  </section>
</main>
<footer data-text="footer"></footer>
<div id="RTC_Videos" hidden></div>
<span id="RTC_Status" hidden></span>
<button id="RTC_Stop" type="button" hidden tabindex="-1" aria-hidden="true">Stop</button>
<script src="/browser.js"></script>
<script src="/preview-text.js"></script>
<script src="/preview-charts.js"></script>
<script src="/preview-heatmap.js"></script>
<script src="/preview-controls.js"></script></html>
