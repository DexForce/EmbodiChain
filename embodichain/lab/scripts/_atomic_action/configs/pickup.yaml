# Same scene and default skill options as the standalone atomic example.
skill: pickup
physics: default
robot: ur5
planner: trapezoidal
seed: 0
runtime:
  num_envs: 16
  device: cpu
  renderer: auto
  headless: false
  real_time: false
options: {}
grasp:
  n_sample: 10000
  force_reannotate: false
expansion:
  affordance:
    enabled: true
    branches_per_family: 4
  trajectory:
    variants_per_family: 4
    max_proposals: 128
    spatial:
      enabled: true
      operators:
      - joint_residual
      - via_points
      joint_offset_scale: 0.005
      dedup_tolerance: 0.002
      via_count: 3
output:
  directory: /tmp/atomic-action/pickup
  save_video: false
  save_trajectories: true
