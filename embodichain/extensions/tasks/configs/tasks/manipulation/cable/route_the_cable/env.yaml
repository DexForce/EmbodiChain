# Material coefficients follow the pinned upstream RodSpec and its scene-friction pass.
environment_id: route_the_cable
enable_ground_plane: true
physics: newton
physics_config:
  physics_dt: 0.004166666666666667
  num_substeps: 4
  collision_cfg: null
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    coupling: two_way
    contact_mode: full
    vbd_options:
      iterations: 20
      rigid_contact_history: true
      # Keep moving cable/pad anchors without snapping slow bodies in world space.
      rigid_contact_stick_freeze_translation_eps: 0.0
      rigid_contact_stick_freeze_angular_eps: 0.0
      rigid_body_contact_buffer_size: 256
    collision_options:
      contact_matching: latest
max_episode_steps: 12000
num_envs: 1
arena_space: 2.0
simulation:
  background:
  - uid: bench
    shape:
      shape_type: Cube
      size:
      - 0.595
      - 1.3
      - 0.1
    init_pos:
    - 0.6
    - 0
    - 0.7
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 0.02
        ke: 10000.0
        kd: 0.1
  - uid: spool_0_foot
    shape:
      shape_type: Cylinder
      radius: 0.0125
      half_height: 0.00125
    init_pos:
    - 0.525
    - -0.26
    - 0.75125
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: spool_0_shaft
    shape:
      shape_type: Cylinder
      radius: 0.00475
      half_height: 0.0085895
    init_pos:
    - 0.525
    - -0.26
    - 0.7610895
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: spool_0_rim
    shape:
      shape_type: Cylinder
      radius: 0.0125
      half_height: 0.0019105000000000007
    init_pos:
    - 0.525
    - -0.26
    - 0.7715895
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: spool_1_foot
    shape:
      shape_type: Cylinder
      radius: 0.0125
      half_height: 0.00125
    init_pos:
    - 0.525
    - -0.02
    - 0.75125
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: spool_1_shaft
    shape:
      shape_type: Cylinder
      radius: 0.00475
      half_height: 0.0085895
    init_pos:
    - 0.525
    - -0.02
    - 0.7610895
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: spool_1_rim
    shape:
      shape_type: Cylinder
      radius: 0.0125
      half_height: 0.0019105000000000007
    init_pos:
    - 0.525
    - -0.02
    - 0.7715895
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: port_wall_a
    shape:
      shape_type: Cube
      size:
      - 0.011
      - 0.032
      - 0.0125
    init_pos:
    - 0.5755
    - 0.08
    - 0.75625
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        # Keep resting contact inside the geometric channel by 0.1 mm.
        rest_offset: 0.0001
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: port_wall_b
    shape:
      shape_type: Cube
      size:
      - 0.011
      - 0.032
      - 0.0125
    init_pos:
    - 0.5965
    - 0.08
    - 0.75625
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0001
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: port_back
    shape:
      shape_type: Cube
      size:
      - 0.01
      - 0.0064
      - 0.0125
    init_pos:
    - 0.586
    - 0.0928
    - 0.75625
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  - uid: anchor
    shape:
      shape_type: Cube
      size:
      - 0.032
      - 0.032
      - 0.006
    init_pos:
    - 0.42
    - -0.352
    - 0.76
    body_type: static
    attrs:
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0
      material_props:
        backend: newton
        dynamic_friction: 2.0
        ke: 10000.0
        kd: 0.1
  usd_scene:
    name: cable_scene
    source:
      file_path: ./cable.usda
    asset_cfgs:
      /World/cable:
        uid: cable
        fixed_segments:
        - 0
        attrs:
          density: 350.0
          bend_stiffness: 0.00111572809234342
          bend_damping: 0.00167359213851513
          twist_stiffness: 0.00111572809234342
          twist_damping: 0.00167359213851513
          collision_props:
            contact_offset: 0.01
            rest_offset: 0.0
          material_props:
            backend: newton
            dynamic_friction: 60.0
            ke: 10000.0
            kd: 0.1
          stretch_stiffness: 200000.0
          stretch_damping: 1.0
          shear_stiffness: 200000.0
          shear_damping: 1.0
env:
  sim_steps_per_control: 4
  ignore_terminations: true
  task_instruction: Route the anchored cable around both spools and place its free
    end in the port.
