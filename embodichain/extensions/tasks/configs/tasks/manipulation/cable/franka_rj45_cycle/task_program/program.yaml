program_id: franka_rj45_cycle
instruction: Pick up the RJ45 plug, insert it, release it, press its latch to withdraw it, and return it to the floor.
targets: {}
# A feedback call owns one control tick so it can read the last physical state.
program:
- segment: home
  steps:
    kind: invoke
    call:
      kind: registered
      call_id: simulation.franka_rj45_phase
      arguments: {phase: home}
- segment: floor_pickup
  instruction: Grasp the plug body on the floor and lift it.
  steps:
    kind: repeat
    count: 300
    body:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.franka_rj45_phase
        arguments: {phase: floor_pickup}
- segment: approach_socket
  instruction: Carry the plug and align it with the socket.
  steps:
    kind: repeat
    count: 240
    body:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.franka_rj45_phase
        arguments: {phase: approach_socket}
- segment: insert_and_release
  instruction: Seat the plug in the socket and open the jaws.
  steps:
    kind: repeat
    count: 240
    body:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.franka_rj45_phase
        arguments: {phase: insert_and_release}
- segment: seated_hold
  instruction: Move away while the plug remains seated.
  steps:
    kind: invoke
    call:
      kind: registered
      call_id: simulation.franka_rj45_phase
      arguments: {phase: seated_hold}
- segment: latch_grasp
  instruction: Grasp the plug vertically, depressing the latch with the finger.
  steps:
    kind: repeat
    count: 360
    body:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.franka_rj45_phase
        arguments: {phase: latch_grasp}
- segment: withdraw
  instruction: Pull the plug out and lift it clear of the socket.
  steps:
    kind: repeat
    count: 180
    body:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.franka_rj45_phase
        arguments: {phase: withdraw}
- segment: place_and_release
  instruction: Rotate the plug onto its side, place it on the floor and release it.
  steps:
    kind: repeat
    count: 360
    body:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.franka_rj45_phase
        arguments: {phase: place_and_release}
- segment: return_home
  instruction: Retreat and return the arm to its starting posture.
  steps:
    kind: invoke
    call:
      kind: registered
      call_id: simulation.franka_rj45_phase
      arguments: {phase: return_home}
  validators:
  - kind: condition
    ref: rj45_success
