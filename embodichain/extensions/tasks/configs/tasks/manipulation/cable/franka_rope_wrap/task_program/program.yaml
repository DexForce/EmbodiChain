    call:
      kind: registered
      call_id: simulation.joint_trajectory_phase
      arguments:
        phase: orbit
- segment: tighten
  steps:
  - kind: invoke
    call:
      kind: registered
      call_id: simulation.joint_trajectory_phase
      arguments:
        phase: tighten
- segment: settle
  steps:
  - kind: invoke
    call:
      kind: registered
      call_id: simulation.joint_trajectory_phase
      arguments:
        phase: settle
- segment: hold_closed
  steps:
