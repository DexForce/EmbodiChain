program_id: franka_rope_wrap
instruction: Grasp the free end of the floor cable, wrap it around the post and hold the tightened wrap.
targets: {}
program:
- segment: home
  steps:
  - kind: invoke
    call:
      kind: registered
      call_id: simulation.joint_trajectory_phase
      arguments:
        phase: home
- segment: pickup
