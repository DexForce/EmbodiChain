trainer:
  exp_name: blind_peg_default_assets_seed0
  gym_config: embodichain/extensions/tasks/configs/tasks/manipulation/assembly/peg_insertion/task.study.default_assets.yaml
  seed: 0
  device: cuda:0
  headless: true
  renderer: no-render
  num_envs: 4096
  iterations: 1000
  buffer_size: 32
  enable_eval: true
  num_eval_envs: 64
  num_eval_episodes: 256
  eval_freq: 6553600
  save_freq: 6553600
  use_wandb: false
  best_eval_metric: eval/success_rate
policy:
  name: actor_critic
  obs_groups:
    actor:
    - proprioception
    critic:
    - privileged
  initial_action_std: 0.5
  actor_obs_normalization: true
  critic_obs_normalization: false
  actor:
    type: temporal
    network_cfg:
      frame_dim: 33
      history_length: 30
      latent_dim: 32
      architecture_version: official_v1
      hidden_sizes:
      - 256
      - 256
      - 128
  critic:
    type: MLP
    network_cfg:
      hidden_sizes:
      - 256
      - 256
      - 128
  auxiliary_tasks:
    contact:
      type: contact_prediction
      contact_points: 64
      contact_classes: 3
      hidden_sizes:
      - 128
      - 128
      class_weights:
      - 0.25
      - 3.0
      - 2.0
      observation_group: contact_labels
algorithm:
  name: ppo
  cfg:
    optimizer:
      name: adam
      learning_rate: 0.0003
    n_epochs: 5
    num_mini_batches: 20
    gamma: 0.98
    gae_lambda: 0.95
    clip_coef: 0.2
    use_clipped_value_loss: true
    ent_coef: 0.003
    vf_coef: 1.0
    max_grad_norm: 1.0
    auxiliary_coef: 1.0
