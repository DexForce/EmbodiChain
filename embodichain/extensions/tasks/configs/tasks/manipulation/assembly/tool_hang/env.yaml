environment_id: robosuite_tool_hang
physics: newton
max_episode_steps: 200
num_envs: 1
arena_space: 2.0
physics_config:
  physics_dt: 0.0025
  num_substeps: 1
  sync_to_renderer: false
  solver_cfg:
    solver_type: mujoco_warp
    integrator: implicitfast
    separate_worlds: true
    iterations: 50
    njmax: 512
    nconmax: 256
render_cfg: {renderer: no-render}
simulation:
  background:
  - uid: table
    body_type: static
    shape: {shape_type: Cube, size: [0.8, 0.8, 0.05]}
    init_pos: [0, 0, 0.775]
  articulation:
  - uid: stand
    fpath: RobosuiteToolHangV1/stand.urdf
    build_pk_chain: false
    init_pos: [-0.08, 0, 0.881]
    root_props: {fixed_base: true}
    asset_physics_mode: overlay
  - uid: frame
    fpath: RobosuiteToolHangV1/frame.urdf
    build_pk_chain: false
    init_pos: [-0.04, -0.24, 0.8137]
    init_rot: [-90, 0, 150]
    # Keep submillimetre fixture and ring clearances under load.
    attrs: &contact_material
      material_props:
        backend: newton
        solref: [0.005, 1.0]
        solimp: [0.95, 0.999, 0.001, 0.5, 2.0]
    root_props: {fixed_base: false}
    asset_physics_mode: overlay
  - uid: tool
    fpath: RobosuiteToolHangV1/tool.urdf
    build_pk_chain: false
    init_pos: [0.04, -0.20, 0.816]
    init_rot: [0, 0, -110]
    attrs: *contact_material
    root_props: {fixed_base: false}
    asset_physics_mode: overlay
env:
  control_parts: [arm, eef]
  sim_steps_per_control: 20
  actions:
    arm_delta:
      func: RelativeEefDlsAction
      params: {part_name: arm, translation_scale: 0.05, rotation_scale: 0.5}
    gripper:
      func: ParallelGripperAction
      params:
        part_name: eef
        command_mode: binary
        open_command: {'fr3_finger_joint[1-2]': 0.04}
        close_command: {'fr3_finger_joint[1-2]': 0}
  observations:
    stand:
      func: get_object_pose
      name: stand
      mode: add
      params: {entity_cfg: {uid: stand}, to_matrix: false}
    frame:
      func: get_object_pose
      name: frame
      mode: add
      params: {entity_cfg: {uid: frame}, to_matrix: false}
    tool:
      func: get_object_pose
      name: tool
      mode: add
      params: {entity_cfg: {uid: tool}, to_matrix: false}
  events:
    place_objects:
      func: reset_tool_hang
      mode: reset
      params: {xy_jitter: 0.02, yaw_jitter_deg: 10, joint_jitter: 0.02}
  rewards:
    success:
      func: success_reward
      mode: add
      weight: 1
      params: {}
