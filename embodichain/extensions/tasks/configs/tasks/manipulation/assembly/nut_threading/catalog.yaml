    config: task.fullrange.nominal.yaml
  study_reference:
    note: Gated reference profile. Requires qualified robot assets and heterogeneous per-arena geometry.
    config: task.study.yaml
  fullrange_reference:
    note: Gated reference profile. Requires qualified robot assets and heterogeneous per-arena geometry.
    config: task.fullrange.yaml
