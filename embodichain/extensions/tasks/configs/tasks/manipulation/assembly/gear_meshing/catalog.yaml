task_key: gear_meshing
title: Blind Gear Meshing
summary: Native proprioceptive assembly development task with explicitly approximate
  jaw carriages; formal reproduction profiles remain gated.
tags:
- manipulation
- assembly
- proprioception
- reinforcement_learning
default_deployment: study_nominal
deployments:
  study_nominal:
    note: Development profile using one geometry per run. See the task README for robot and gripper assumptions.
    config: task.study.nominal.yaml
  fullrange_nominal:
    note: Development profile using one geometry per run. See the task README for robot and gripper assumptions.
    config: task.fullrange.nominal.yaml
  study_reference:
    note: Gated reference profile. Requires qualified robot assets and heterogeneous per-arena geometry.
    config: task.study.yaml
  fullrange_reference:
    note: Gated reference profile. Requires qualified robot assets and heterogeneous per-arena geometry.
    config: task.fullrange.yaml
  dexuni:
    config: task.study.default_assets.dexuni.yaml
    note: The geometry-informed reference seats the gear against the collar and engages the passive neighboring gear.
  dexuni_nominal:
    config: task.study.nominal.dexuni.yaml
    note: Nominal single-geometry study profile for PPO experiments.
