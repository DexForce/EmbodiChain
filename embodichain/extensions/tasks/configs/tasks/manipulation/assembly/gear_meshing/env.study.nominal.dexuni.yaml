environment_id: gear_meshing_study.nominal
physics: newton
max_episode_steps: 500
num_envs: 1
arena_space: 2.0
physics_config:
  physics_dt: 0.001
  num_substeps: 1
  sync_to_renderer: false
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      njmax: 4096
      nconmax: 4096
      iterations: 100
      ls_iterations: 50
      integrator: implicitfast
      separate_worlds: true
      tolerance: 1.0e-08
render_cfg:
  renderer: no-render
simulation: {}
env:
  control_parts:
  - arm
  sim_steps_per_control: 20
  enable_sensor: true
  init_rollout_buffer: false
  actions:
    arm_delta:
      func: AssemblyJointPositionAction
      params:
        part_name: arm
        scale: 0.04
  observations:
    proprioception:
      func: AssemblyProprioception
      mode: add
      name: proprioception
      params:
        history_length: 30
    privileged:
      func: assembly_privileged_state
      mode: add
      name: privileged
      params: {}
    contact_labels:
      func: assembly_contact_labels
      mode: add
      name: contact_labels
      params: {}
  events:
    initialize_assembly:
      func: initialize_assembly
      mode: startup
      params: {}
    update_assembly:
      func: update_assembly
      mode: interval
      interval_step: 1
      params: {}
    reset_assembly:
      func: reset_assembly
      mode: reset
      params: {}
  rewards:
    assembly_milestones:
      func: assembly_milestone_reward
      mode: add
      weight: 1.0
      params:
        weights:
        - 1.0
        - 1.0
        - 1.0
        - 0.0
  extensions:
    assembly:
      kind: gear
      robot_entity_cfg:
        uid: FlexivRizon4SRobotiq
      moving_entity_cfg:
        uid: gear_b
      fixture_entity_cfg:
        uid: shaft
      arm_part: arm
      gripper_part: eef
      action_term: arm_delta
      orientation_representation: euler_xyz
      grasp_link_names:
      - gripper_right_pad
      - gripper_left_pad
      grasp_aperture_coefficients:
      - 0.0057
      - 0.037
      - -0.044
      grasp_joint_upper: 0.8
      mating_sensor: assembly_contacts
      grasp_sensor: grasp_contacts
      contact_points_per_ring: 64
      assembly_contact_capacity: 4096
      grasp_contact_capacity: 4096
      grasp_force_threshold: 0.05
      grasp_max_air_time: 0.005
      penetration_tolerance: 0.0001
      penetration_clearance_fraction: 0.5
      success_hold_steps: 3
      failure_distance: 0.25
      grasp_failure_after_steps: 25
      contact_band: 0.001
      milestone_depth: 0.001
      hinge_entity_cfg:
        uid: gear_a
      gear_tilt_tolerance: 0.05
      assembly_profile: study
      preserve_source_contacts: true
      require_heterogeneous_assets: false
      grasp_warmup_steps: 10
      initial_position_range: 0.0075
      grasp_position_range: 0.0025
      joint_stiffness: 40.0
      joint_damping: 20.0
      gripper_model: parallel_jaw
      robot_asset_source: menagerie
      file_visuals: true
  scene_preparation:
    func: embodichain.extensions.tasks.manipulation.assembly.preparation:prepare_assembly_scene
    params: {}
  resource_export:
    func: embodichain.extensions.tasks.manipulation.assembly.resources:export_assembly_resources
    params: {}
