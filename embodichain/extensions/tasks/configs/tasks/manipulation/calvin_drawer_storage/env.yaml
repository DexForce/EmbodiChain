environment_id: calvin_drawer_storage
physics: default
max_episodes: 1
max_episode_steps: 4200
num_envs: 1
arena_space: 3.0
simulation:
  light:
    direct:
    - uid: workcell_light
      light_type: sun
      color: [1.0, 1.0, 1.0]
      intensity: 3.0
      direction: [-0.3, 0.5, -1.0]
  articulation:
  - uid: drawer
    fpath: CalvinPlayTableD/calvin_table_D/calvin_table_D_contact.urdf
    body_scale: [0.8, 0.8, 0.8]
    root_props: {fixed_base: true}

  background:
  - uid: robot_pedestal
    body_type: static
    shape: {shape_type: Cube, size: [0.22, 0.22, 0.12]}
    init_pos: [-0.17, -0.68, 0.06]
  rigid_object:
  - uid: block_red
    body_type: dynamic
    shape:
      shape_type: Cube
      size: [0.056, 0.04, 0.04]
      visual_material: {base_color: [1, 0, 0, 1]}
    init_pos: [-0.12, -0.12, 0.49]
    attrs:
      # Calibrated for the FR3 hand in PhysX. CALVIN specifies 1 kg.
      mass_props: {mass: 0.10}
      material_props: {static_friction: 0.7, dynamic_friction: 0.7}
  - uid: block_blue
    body_type: dynamic
    shape:
      shape_type: Cube
      size: [0.04, 0.04, 0.04]
      visual_material: {base_color: [0, 0, 1, 1]}
    init_pos: [0, -0.12, 0.49]
    attrs:
      mass_props: {mass: 1.0}
      material_props: {static_friction: 0.7, dynamic_friction: 0.7}
  - uid: block_pink
    body_type: dynamic
    shape:
      shape_type: Cube
      size: [0.08, 0.04, 0.04]
      visual_material: {base_color: [1, 0, 1, 1]}
    init_pos: [0.12, -0.12, 0.49]
    attrs:
      mass_props: {mass: 1.0}
      material_props: {static_friction: 0.7, dynamic_friction: 0.7}
env:
  sim_steps_per_control: 4
  events: {}
