graph:
  roots: [cube_contained, rail_closed, hand_open, fingers_clear]
  rules:
    cube_contained:
      kind: corner_containment
      bindings: {pose: rigid_objects/block_red/frame, frame: links/drawer_tray/frame}
      params:
        corners:
          - [-0.028, -0.020, -0.020]
          - [-0.028, -0.020, 0.020]
          - [-0.028, 0.020, -0.020]
          - [-0.028, 0.020, 0.020]
          - [0.028, -0.020, -0.020]
          - [0.028, -0.020, 0.020]
          - [0.028, 0.020, -0.020]
          - [0.028, 0.020, 0.020]
        # Drawer CAD in its link frame after the 0.8 scale; local +Y points upwards.
        lower: [-0.178, 0.020, -0.038]
        upper: [0.178, 0.081, 0.157]
        tolerance: 0.001
    rail_closed:
      kind: joint_range
      bindings: {position: articulations/drawer/qpos/base__drawer}
      params: {lower: -0.001, upper: 0.01}
    hand_open:
      kind: command_preset_match
      bindings: {position: robot/primary_manipulator/grasp/qpos}
      params: {preset: open, tolerance: 0.002}
    first_finger_near:
      kind: link_object_distance
      bindings: {position: robot_links/first_grasp_finger/position, target: rigid_objects/block_red/pose}
      params: {tolerance: 0.08, inclusive: true}
    second_finger_near:
      kind: link_object_distance
      bindings: {position: robot_links/second_grasp_finger/position, target: rigid_objects/block_red/pose}
      params: {tolerance: 0.08, inclusive: true}
    first_finger_clear:
      kind: not
      refs: [first_finger_near]
    second_finger_clear:
      kind: not
      refs: [second_finger_near]
    fingers_clear:
      kind: all
      refs: [first_finger_clear, second_finger_clear]
final_acceptance: [cube_contained, rail_closed, hand_open, fingers_clear]
