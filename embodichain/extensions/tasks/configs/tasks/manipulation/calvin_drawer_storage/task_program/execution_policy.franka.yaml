policy_id: calvin_drawer_storage_franka_trajectory_v1
preset_id: trajectory

requires:
  embodiment_contract: single_arm_parallel_gripper

motion:
  strategy: ik_interp
  # Seed each Cartesian waypoint from the preceding Franka posture.
  ik_seed_mode: sequential
  velocity_limit: 0.25
  velocity_targets: auto
  sample_count: 40
  dynamic_collision_mode: "off"

tracking:
  kind: timed

recovery:
  # The table's passive rail yields slightly when the cube is released.
  # Both rail opening and final closure are independently measured.
  goal_translation_threshold: 0.05
  max_replans: 0
  max_action_retries: 0
  action_timeout: 120.0

workflow_recovery:
  max_recovery_attempts: 0

runner:
  minimum_cycle_time: 0.0
  hold_on_completion: false
  hold_during_effect_verification: false

effect_assurance: projected
