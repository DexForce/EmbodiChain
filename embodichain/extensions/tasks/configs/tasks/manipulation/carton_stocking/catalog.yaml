task_key: carton_stocking
title: Directional Carton Stocking
summary: Place a carton at a requested position and yaw using source-backed or camera-enabled
  Task Program deployments.
tags:
- pick_place
- single_arm
- task_program
- real2sim
- trajectory_expansion
default_deployment: panda
deployments:
  panda:
    config: task.panda.yaml
  panda_rgbd:
    config: task.panda.rgbd.yaml
  dexuni:
    config: task.ur5.dexuni.yaml
    note: Uses a UR5 with DH PGI-140-80 and measures the settled carton position and front alignment.
