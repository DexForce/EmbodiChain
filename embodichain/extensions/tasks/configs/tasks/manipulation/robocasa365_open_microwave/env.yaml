environment_id: robocasa365_open_microwave
physics: default
max_episodes: 1
max_episode_steps: 300
num_envs: 1
arena_space: 3.0
simulation:
  light:
    direct:
    - uid: workcell_light
      light_type: sun
      color: [1.0, 1.0, 1.0]
      intensity: 3.0
      direction: [-0.3, 0.5, -1.0]
  articulation:
  - uid: microwave
    fpath: RoboCasa365Microwave048/Microwave048.usdc
    init_pos: [0, 0, 0.64363]
    root_props: {fixed_base: true}

  background:
  - uid: robot_pedestal
    body_type: static
    shape: {shape_type: Cube, size: [0.22, 0.22, 0.32]}
    init_pos: [-0.10, -1.00, 0.16]
  - uid: counter
    body_type: static
    shape: {shape_type: Cube, size: [0.80, 0.55, 0.40]}
    init_pos: [0, 0, 0.2]
env:
  task_instruction: Open the microwave door.
  sim_steps_per_control: 4
  actions:
    arm:
      func: RelativeJointPositionAction
      params: {part_name: arm, scale: 0.05}
    hand:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        lower_command: {".*": 0.0}
        upper_command: {".*": 0.04}
  observations:
    fixture_joints:
      func: get_entity_state
      mode: add
      name: fixture/qpos
      params: {entity_cfg: {uid: microwave}, quantity: qpos}
  rewards:
    opened: {func: success_reward, mode: add, weight: 1.0, params: {}}
