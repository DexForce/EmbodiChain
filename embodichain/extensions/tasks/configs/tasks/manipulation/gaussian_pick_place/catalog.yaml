task_key: gaussian_pick_place
group: pick_place
title: Pick and Place in Captured Gaussian Scenes
summary: Physically pick and place a cube in scenes with captured 3D Gaussian backgrounds.
tags:
- pick_place
- single_arm
- task_program
- gaussian_background
- rgb
default_deployment: office
deployments:
  office:
    validation: validation/office.json
    config: task.office.yaml
  discoverse:
    validation: validation/discoverse.json
    config: task.discoverse.yaml
  robosimgs:
    validation: validation/robosimgs.json
    config: task.robosimgs.yaml
  dexuni:
    note: Uses a UR5 with DH PGI-140-80, native DexUni rigid contacts and the original Office Gaussian capture.
    config: task.office.dexuni.yaml
