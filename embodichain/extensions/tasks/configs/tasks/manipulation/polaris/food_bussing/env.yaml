environment_id: polaris_food_bussing
physics: default
physics_config:
  physics_dt: 0.0010416666666666667
num_envs: 1
arena_space: 3
max_episode_steps: 450
render_cfg:
  preset: gaussian
  renderer: hybrid
  gaussian:
    apply_display_srgb: false
simulation:
  visual_object:
  - uid: scan_background
    init_pos: [0.52, 0.6, 0.42]
    init_rot: [-90.0, -90.0, 0.0]
    visuals:
    - id: capture
      scale: 1
      representation:
        type: gaussian_splat
        file_path: PolarisDroidFoodBussing/background.ply
  background:
  - uid: support
    body_type: static
    render_enabled: false
    shape:
      shape_type: Cube
      size: [2, 2, 0.04]
    init_pos: [0.5, 0, -0.02]
  rigid_object:
  - uid: battery
    body_type: dynamic
    init_pos: [0.385111838579175, 0.05145630825998462, 0.009920946206443461]
    body_scale: [0.07, 0.07, 0.07]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidFoodBussing/objects/battery/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: blue_cup
    body_type: dynamic
    init_pos: [0.5236179232597317, 0.05274643234823769, 0.01804890737800555]
    body_scale: [0.12, 0.12, 0.12]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidFoodBussing/objects/blue_cup/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: grapes
    body_type: dynamic
    init_pos: [0.4995833039283832, -0.050881497631258196, 0.04123384405184905]
    body_scale: [0.08, 0.08, 0.08]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidFoodBussing/objects/grapes/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: ice_cream
    body_type: dynamic
    init_pos: [0.43022724986076344, 0.15205697715282424, 0.02001154885077262]
    body_scale: [0.12, 0.12, 0.12]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidFoodBussing/objects/ice_cream/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: yellow_bowl
    body_type: dynamic
    init_pos: [0.42552608251572016, -0.21786836577456603, 0.014558143884765229]
    body_scale: [0.18, 0.18, 0.18]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidFoodBussing/objects/yellow_bowl/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  light:
    direct:
    - uid: fill
      light_type: point
      init_pos: [0, -1, 2]
      intensity: 10
env:
  target_control_frequency: 15
  sim_steps_per_control: 64
  task_instruction: Put all the foods in the bowl
  extensions:
    expert:
    - object: ice_cream
      target: yellow_bowl
      grasp_xy: [0, 0]
      grasp_z: 0.025
      yaw: 90
      place_xy: [-0.026, 0]
      surface_z: 0.074
    - object: grapes
      target: yellow_bowl
      grasp_xy: [0, 0]
      linear: true
      place_yaw_offset: 90
      grasp_z: 0.039
      yaw: 0
      place_xy: [0.027, 0]
      surface_z: 0.074
    initial_condition_names:
      battery: battery1
      blue_cup: cup
      ice_cream: ice_cream_
      yellow_bowl: bowl
  actions:
    arm:
      contract: joint_position.absolute@1
      params:
        part_name: arm
    gripper:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        use_joint_limits: true
