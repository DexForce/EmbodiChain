environment_id: polaris_pan_clean
physics: default
physics_config:
  physics_dt: 0.0010416666666666667
num_envs: 1
arena_space: 3
max_episode_steps: 450
render_cfg:
  preset: gaussian
  renderer: hybrid
  gaussian:
    apply_display_srgb: false
simulation:
  visual_object:
  - uid: scan_background
    init_pos: [-0.45, 0.0, -0.275]
    init_rot: [0.0, 0.0, -90.0]
    visuals:
    - id: capture
      scale: 1
      representation:
        type: gaussian_splat
        file_path: PolarisDroidPanClean/background.ply
  background:
  - uid: support
    body_type: static
    render_enabled: false
    shape:
      shape_type: Cube
      size: [2, 2, 0.04]
    init_pos: [0.5, 0, -0.02]
  rigid_object:
  - uid: bell_pepper
    body_type: dynamic
    init_pos: [0.6868054606124152, -0.09376765412594976, 0.07364526317467109]
    body_scale: [0.08, 0.08, 0.08]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidPanClean/objects/bell_pepper/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: blue_mug
    body_type: dynamic
    init_pos: [0.5183660226463038, 0.4163992332634181, -0.045273515484170024]
