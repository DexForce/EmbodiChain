env:
  target_control_frequency: 15
  sim_steps_per_control: 64
  task_instruction: Use the yellow sponge to scrub the blue handle frying pan
  extensions:
    initial_condition_names:
      bell_pepper: pepper
      blue_mug: mug
      frying_pan: pan
  actions:
    arm:
      contract: joint_position.absolute@1
      params:
        part_name: arm
    gripper:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        use_joint_limits: true
