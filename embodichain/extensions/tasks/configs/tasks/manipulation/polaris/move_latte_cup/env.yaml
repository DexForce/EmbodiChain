environment_id: polaris_move_latte_cup
physics: default
physics_config:
  physics_dt: 0.0010416666666666667
num_envs: 1
arena_space: 3
max_episode_steps: 450
render_cfg:
  preset: gaussian
  renderer: hybrid
  gaussian:
    apply_display_srgb: false
simulation:
  visual_object:
  - uid: scan_background
    init_pos: [0.087, 0.175, -0.01]
    init_rot: [0.0, 0.0, 0.0]
    visuals:
    - id: capture
      scale: 0.98
      representation:
        type: gaussian_splat
        file_path: PolarisDroidMoveLatteCup/background.ply
  background:
  - uid: support
    body_type: static
    render_enabled: false
    shape:
      shape_type: Cube
      size: [2, 2, 0.04]
    init_pos: [0.5, 0, -0.02]
  rigid_object:
  - uid: cleaner
    body_type: dynamic
    init_pos: [0.6732833898725151, -0.029656703945114327, 0.1115361781066837]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidMoveLatteCup/objects/cleaner_eval/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: coke
    body_type: dynamic
    init_pos: [0.6801107133255605, -0.10206733249862565, 0.12591785111461729]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidMoveLatteCup/objects/coke_eval/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: cutting_board
    body_type: dynamic
    init_pos: [0.45471049958577026, -0.180505348408468, 0.14329105966329259]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidMoveLatteCup/objects/cuttingboard_eval/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: latte_art_cup
    body_type: dynamic
    init_pos: [0.6542510275715706, -0.30076297869788315, 0.12330198101848916]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidMoveLatteCup/objects/latteartcup_eval/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  light:
    direct:
    - uid: fill
      light_type: point
      init_pos: [0, -1, 2]
      intensity: 10
env:
  target_control_frequency: 15
  sim_steps_per_control: 64
  task_instruction: put the latte art cup on top of the cutting board
  extensions:
    expert:
    - object: latte_art_cup
      target: cutting_board
      grasp_xy: [-0.01, -0.038]
      grasp_z: 0.111
      yaw: 90
      place_xy: [0, 0]
    initial_condition_names:
      cleaner: cleaner_eval
      coke: coke_eval
      cutting_board: cuttingboard_eval
      latte_art_cup: latteartcup_eval
  actions:
    arm:
      contract: joint_position.absolute@1
      params:
        part_name: arm
    gripper:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        use_joint_limits: true
