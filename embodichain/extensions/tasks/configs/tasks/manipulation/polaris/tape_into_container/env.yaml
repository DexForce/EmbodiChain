environment_id: polaris_tape_into_container
physics: default
physics_config:
  physics_dt: 0.0010416666666666667
num_envs: 1
arena_space: 3
max_episode_steps: 450
render_cfg:
  preset: gaussian
  renderer: hybrid
  gaussian:
    apply_display_srgb: false
simulation:
  visual_object:
  - uid: scan_background
    init_pos: [0.0, 0.0, 0.0]
    init_rot: [0.0, 0.0, 0.0]
    visuals:
    - id: capture
      scale: 1
      representation:
        type: gaussian_splat
        file_path: PolarisDroidTapeIntoContainer/background.ply
  background:
  - uid: support
    body_type: static
    render_enabled: false
    shape:
      shape_type: Cube
      size: [2, 2, 0.04]
    init_pos: [0.5, 0, -0.02]
  rigid_object:
  - uid: container_02
    body_type: dynamic
    init_pos: [0.44215725465121536, 0.10966270076795323, 0.09355609544023435]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidTapeIntoContainer/objects/container_02/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: tape_00
    body_type: dynamic
    init_pos: [0.3822483446264099, 0.304611901718318, 0.12136276658690792]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidTapeIntoContainer/objects/tape_00/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: wrench
    body_type: dynamic
    init_pos: [0.5042372952961356, -0.11081426529984865, 0.12350797493131171]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidTapeIntoContainer/objects/wrench/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  light:
    direct:
    - uid: fill
      light_type: point
      init_pos: [0, -1, 2]
      intensity: 10
env:
  target_control_frequency: 15
  sim_steps_per_control: 64
  task_instruction: put the tape into the container
  extensions:
    expert:
    - object: tape_00
      target: container_02
      grasp_xy: [-0.049, 0.0]
      grasp_z: 0.023
      yaw: 0
      surface_z: 0.018
  actions:
    arm:
      contract: joint_position.absolute@1
      params:
        part_name: arm
    gripper:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        use_joint_limits: true
