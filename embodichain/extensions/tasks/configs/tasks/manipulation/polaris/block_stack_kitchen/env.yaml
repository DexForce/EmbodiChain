      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/uw_corn/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
