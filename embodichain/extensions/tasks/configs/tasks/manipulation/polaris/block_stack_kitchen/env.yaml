  - uid: wood_cube
    body_type: dynamic
    init_pos: [0.41919292386568763, -0.09747371822595585, 0.07723409933417806]
    body_scale: [0.06, 0.06, 0.06]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/wood_cube/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  light:
    direct:
    - uid: fill
      light_type: point
      init_pos: [0, -1, 2]
      intensity: 10
env:
  target_control_frequency: 15
  sim_steps_per_control: 64
  task_instruction: Place and stack the blocks on top of the green tray
  extensions:
    initial_condition_names:
      green_tray: tray
      pink_bowl: bowl
      purple_plate: plate_
      uw_corn: corn
  actions:
    arm:
      contract: joint_position.absolute@1
      params:
        part_name: arm
    gripper:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        use_joint_limits: true
