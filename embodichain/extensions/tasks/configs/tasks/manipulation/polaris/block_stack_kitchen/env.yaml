environment_id: polaris_block_stack_kitchen
physics: default
physics_config:
  physics_dt: 0.0010416666666666667
num_envs: 1
arena_space: 3
max_episode_steps: 450
render_cfg:
  preset: gaussian
  renderer: hybrid
  gaussian:
    apply_display_srgb: false
simulation:
  visual_object:
  - uid: scan_background
    init_pos: [-0.225, -0.24, 0.0]
    init_rot: [0.0, 0.0, 180.0]
    visuals:
    - id: capture
      scale: 1
      representation:
        type: gaussian_splat
        file_path: PolarisDroidBlockStackKitchen/background.ply
  background:
  - uid: support
    body_type: static
    render_enabled: false
    shape:
      shape_type: Cube
      size: [2, 2, 0.04]
    init_pos: [0.5, 0, -0.02]
  rigid_object:
  - uid: green_cube
    body_type: dynamic
    init_pos: [0.3208774626255044, -0.11194607066881795, 0.0804820482926792]
    body_scale: [0.06, 0.06, 0.06]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/green_cube/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: green_tray
    body_type: dynamic
    init_pos: [0.3517783956667713, 0.09136301147498842, 0.05371089447294813]
    body_scale: [0.28, 0.28, 0.28]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/green_tray/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: pink_bowl
    body_type: dynamic
    init_pos: [0.5336140386925854, 0.11516009020424095, 0.06645985800557358]
    body_scale: [0.13, 0.13, 0.13]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/pink_bowl/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: purple_plate
    body_type: dynamic
    init_pos: [0.47936457938369215, -0.0038916438062898406, 0.1738220553802526]
    body_scale: [0.13, 0.13, 0.13]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/purple_plate/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: tomato
    body_type: dynamic
    init_pos: [0.3722157695699017, -0.015744171924207098, 0.1668820572717904]
    body_scale: [0.06, 0.06, 0.06]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidBlockStackKitchen/objects/tomato/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
