environment_id: polaris_organize_tools
physics: default
physics_config:
  physics_dt: 0.0010416666666666667
num_envs: 1
arena_space: 3
max_episode_steps: 450
render_cfg:
  preset: gaussian
  renderer: hybrid
  gaussian:
    apply_display_srgb: false
simulation:
  visual_object:
  - uid: scan_background
    init_pos: [0.0, 0.0, 0.01]
    init_rot: [0.0, 0.0, 0.0]
    visuals:
    - id: capture
      scale: 1
      representation:
        type: gaussian_splat
        file_path: PolarisDroidOrganizeTools/background.ply
  background:
  - uid: support
    body_type: static
    render_enabled: false
    shape:
      shape_type: Cube
      size: [2, 2, 0.04]
    init_pos: [0.5, 0, -0.02]
  rigid_object:
  - uid: container_00
    body_type: dynamic
    init_pos: [0.869080252583182, -0.20250619640083167, 0.14476258666169595]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidOrganizeTools/objects/container_00/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: container_01
    body_type: dynamic
    init_pos: [0.605066204255155, -0.2104109425515579, 0.0830626850093904]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidOrganizeTools/objects/container_01/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: scissor
    body_type: dynamic
    init_pos: [0.47367935020492635, 0.008480527112721958, 0.20958048058047396]
    body_scale: [1.2, 1.2, 1.2]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidOrganizeTools/objects/scissor/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  - uid: tape
    body_type: dynamic
    init_pos: [0.840408118120672, -0.1766861334390354, 0.22018023809242637]
    body_scale: [1.0, 1.0, 1.0]
    shape:
      shape_type: Mesh
      fpath: PolarisDroidOrganizeTools/objects/tape/mesh.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 16
        acd_method: vhacd
    attrs:
      mass_props:
        density: 300.0
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
  light:
    direct:
    - uid: fill
      light_type: point
      init_pos: [0, -1, 2]
      intensity: 10
env:
  target_control_frequency: 15
  sim_steps_per_control: 64
  task_instruction: put the scissor into the large container
  actions:
    arm:
      contract: joint_position.absolute@1
      params:
        part_name: arm
    gripper:
      contract: gripper.parallel@1
      params:
        part_name: eef
        command_mode: continuous
        use_joint_limits: true
