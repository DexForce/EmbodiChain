environment_id: workspace_pose_pick_place
physics: newton
max_episodes: 1
max_episode_steps: 1200
num_envs: 1
arena_space: 2.5
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color:
      - 0.6
      - 0.6
      - 0.6
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
    - uid: rect_light
      light_type: rect
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 8.0
      init_pos:
      - -0.42
      - 0.08
      - 0.8
      direction:
      - 0.0
      - 0.0
      - -1.0
      rect_width: 0.5
      rect_height: 0.5
  background:
  - uid: goal
    shape:
      shape_type: Cube
      size:
      - 0.01
      - 0.01
      - 0.001
    body_type: static
    init_pos:
    - -0.4
    - 0.48
    - -0.1
    attrs:
      collision_props:
        collision_enabled: false
  rigid_object:
  - uid: cube
    shape:
      shape_type: Cube
      size:
      - 0.06
      - 0.04
      - 0.04
    body_type: dynamic
    init_pos:
    - -0.42
    - -0.08
    - 0.02
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
      collision_props:
        backend: newton
        condim: 4
      material_props:
        dynamic_friction: 0.97
        static_friction: 0.99
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
  rigid_object_group: []
  articulation: []
env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  collision_cfg: null
  dexuni_mujoco_joints_per_arena: 13
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 50
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
