environment_id: drawer_storage
physics: newton
max_episodes: 1
max_episode_steps: 4800
num_envs: 1
arena_space: 3.0
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color:
      - 0.6
      - 0.6
      - 0.6
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: pickup_table
    body_type: static
    shape:
      shape_type: Cube
      size:
      - 0.25
      - 0.25
      - 0.4
    init_pos:
    - -0.35
    - 0.45
    - 0.2
  - uid: robot_pedestal
    body_type: static
    shape:
      shape_type: Cube
      size:
      - 0.25
      - 0.25
      - 0.2
    init_pos:
    - -0.1
    - 0.0
    - 0.1
  rigid_object:
  - uid: cube
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    init_pos:
    - -0.35
    - 0.45
    - 0.427
    attrs:
      mass_props:
        mass: 0.05
      material_props:
        static_friction: 0.8
        dynamic_friction: 0.8
        restitution: 0.0
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
      collision_props:
        backend: newton
        condim: 4
  rigid_object_group: []
  articulation:
  - uid: drawer
    fpath: Drawer/model_split_links_with_inertials.urdf
    init_pos:
    - -1.1
    - 0.0
    - 0.0
    init_rot:
    - 0.0
    - 0.0
    - 90.0
    init_qpos:
    - 0.0
    root_props:
      fixed_base: true
    asset_physics_mode: overlay
    joint_drive_props:
      drive_type: none
      friction: 0.1
    attrs:
      material_props:
        static_friction: 1.0
        dynamic_friction: 1.0
    link_attrs:
      handle_contact:
        link_names_expr:
        - large_handle_bar
        attrs:
          collision_props:
            backend: newton
            condim: 4
          material_props:
            backend: newton
            ke: 40000.0
            kd: 400.0
            torsional_friction: 0.1
            rolling_friction: 0.01
            dynamic_friction: 1.1
            static_friction: 1.2
env:
  sim_steps_per_control: 4
  events: {}
  task_instruction: Open the drawer, put the cube inside, release it, and close the
    drawer.
physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 20
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
  dexuni_mujoco_joints_per_arena: 34
  collision_cfg: null
