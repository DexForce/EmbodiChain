environment_id: whiteboard_draw_table
physics: default
num_envs: 1
arena_space: 4.0
max_episode_steps: 4800
simulation:
  background:
  - uid: board
    body_type: static
    shape: {shape_type: Cube, size: [0.0111125, 2.4384, 1.2192]}
    init_pos: [0.50555625, 0.05, 1.524]
    attrs:
      material_props: {static_friction: 0.18, dynamic_friction: 0.12}
  - uid: stand
    body_type: static
    shape: {shape_type: Cube, size: [0.30, 0.30, 0.63]}
    init_pos: [-0.05, 0.0, 0.315]
  articulation:
  - uid: pen
    fpath: WhiteboardMarkerV1/marker.urdf
    asset_physics_mode: overlay
    init_pos: [0.1, 0.6, 0.02]
    root_props: {fixed_base: false}
    init_qpos: [0.0]
    link_attrs:
      barrel_grip:
        link_names_expr: [barrel]
        attrs:
          material_props: {static_friction: 2.0, dynamic_friction: 1.5}
      compliant_nib:
        link_names_expr: [nib]
        attrs:
          material_props: {static_friction: 0.2, dynamic_friction: 0.15}
    joint_drive_props:
      stiffness: {nib_slide: 1200.0}
      damping: {nib_slide: 2.0}
      max_effort: {nib_slide: 4.0}
env:
  target_control_frequency: 20
  sim_steps_per_control: 20
  task_instruction: Draw the table frame, header and two dividers on the whiteboard.
