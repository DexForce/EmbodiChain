environment_id: place_object_drawer
physics: newton
max_episodes: 5
env:
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        color_range:
        - - 0.6
          - 0.6
          - 0.6
        - - 1
          - 1
          - 1
        intensity_range:
        - 2.0
        - 8.0
    init_object_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: object
        position_range:
        - - 0.66
          - -0.15
          - 0.919
        - - 0.7
          - -0.1
          - 0.919
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    settle_tabletop_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: object
        min_steps: 10
        max_steps: 240
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        control_parts:
        - eef
    object_pose:
      func: get_rigid_object_pose
      mode: add
      name: object_pose
      params:
        entity_cfg:
          uid: object
  scene_preparation:
    func: embodichain.extensions.tasks.manipulation.tableware.place_object_drawer:prepare_tableware_drawer
    params:
      articulation:
        uid: drawer
        init_pos:
        - 0.725
        - 0.16
        - 0.914
        init_rot:
        - 0.0
        - 0.0
        - 180.0
        asset_physics_mode: overlay
        joint_drive_props:
          drive_type: none
          friction: 0.06
        link_attrs:
          inner_box:
            link_names_expr:
            - inner_box
            attrs:
              material_props: &id001
                backend: newton
                ke: 40000.0
                kd: 400.0
                torsional_friction: 0.1
                rolling_friction: 0.01
                static_friction: 1.15
                dynamic_friction: 1.05
              collision_props:
                backend: newton
                condim: 4
        init_qpos:
        - 0.166
  task_instruction: Place the toy duck in the open drawer, then close the drawer.
simulation:
  light:
    direct:
    - uid: light_1
      light_type: sun
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: table
    shape:
      shape_type: Mesh
      fpath: CircleTableSimple/circle_table_simple.ply
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
      collision_props:
        collision_enabled: false
    body_scale:
    - 1
    - 1
    - 1
    body_type: static
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    init_rot:
    - 0
    - 90
    - 0
  - uid: table_collision
    body_type: static
    shape:
      shape_type: Cylinder
      half_height: 0.05
      radius: 0.5
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    render_enabled: false
  - uid: arm_pedestal
    body_type: static
    shape:
      shape_type: Cube
      size:
      - 0.21
      - 0.21
      - 0.875
    init_pos:
    - 0.1
    - 0
    - 0.4375
  - uid: drawer_plinth
    body_type: static
    shape:
      shape_type: Cube
      size:
      - 0.202
      - 0.205
      - 0.039
    init_pos:
    - 0.725
    - 0.16
    - 0.8945
  rigid_object:
  - uid: object
    shape:
      shape_type: Mesh
      fpath: ToyDuck/toy_duck.glb
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    attrs:
      mass_props:
        mass: 0.01
      rigid_props:
        max_depenetration_velocity: 2.0
        linear_damping: 2.0
        angular_damping: 2.0
        max_linear_velocity: 5.0
        max_angular_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        backend: newton
        condim: 4
      material_props: *id001
    init_pos:
    - 0.725
    - -0.1
    - 0.919
    init_rot:
    - 0
    - 0
    - 0
    body_scale:
    - 0.3
    - 0.3
    - 0.3
max_episode_steps: 3600
physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 50
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
      use_mujoco_cpu: true
  collision_cfg: null
  dexuni_mujoco_joints_per_arena: 15
