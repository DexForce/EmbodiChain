  steps:
    pick:
      object: block_sphere_1
      grasp: block_sphere_1_grasp
      resources:
        primary: primary_manipulator
  validators:
  - kind: object_lifted
    object: block_sphere_1
    minimum_lift: 0.035
- segment: place_block_sphere_1
  instruction: Place the first sphere at its target.
