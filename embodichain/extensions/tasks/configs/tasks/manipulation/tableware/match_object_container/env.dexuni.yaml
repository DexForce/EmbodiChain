  - uid: table
    shape:
      shape_type: Mesh
      fpath: CircleTableSimple/circle_table_simple.ply
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
      collision_props:
        collision_enabled: false
    body_scale:
    - 1
    - 1
    - 1
    body_type: static
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    init_rot:
    - 0
    - 90
    - 0
