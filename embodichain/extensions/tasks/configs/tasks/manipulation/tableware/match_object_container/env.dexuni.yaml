physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 50
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
  collision_cfg: null
  dexuni_mujoco_joints_per_arena: 18
