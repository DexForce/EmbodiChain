      radius: 0.5
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    render_enabled: false
    attrs:
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
      collision_props:
        backend: newton
        condim: 4
