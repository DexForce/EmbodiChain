environment_id: match_object_container
physics: newton
max_episodes: 5
env:
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        color_range:
        - - 0.6
          - 0.6
          - 0.6
        - - 1
          - 1
          - 1
        intensity_range:
        - 2.0
        - 8.0
    init_block_cube_1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_cube_1
        position_range:
        - - 0.55
          - -0.1
          - 0.897
        - - 0.58
          - -0.05
          - 0.897
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    init_block_sphere_1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_sphere_1
        position_range:
        - - 0.62
          - -0.1
          - 0.902
        - - 0.65
          - -0.05
          - 0.902
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    init_block_cube_2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_cube_2
        position_range:
        - - 0.55
          - 0.05
          - 0.897
        - - 0.58
          - 0.1
          - 0.897
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    init_block_sphere_2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_sphere_2
        position_range:
        - - 0.62
          - 0.05
          - 0.902
        - - 0.65
          - 0.1
          - 0.902
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    settle_tabletop_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: block_cube_1
        - uid: block_cube_2
        - uid: block_sphere_1
        - uid: block_sphere_2
        - uid: container_cube
        - uid: container_sphere
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        control_parts:
        - eef
    block_cube_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_cube_1_pose
      params:
        entity_cfg:
          uid: block_cube_1
    block_sphere_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_sphere_1_pose
      params:
        entity_cfg:
          uid: block_sphere_1
    container_cube_pose:
      func: get_rigid_object_pose
      mode: add
      name: container_cube_pose
      params:
        entity_cfg:
          uid: container_cube
    container_sphere_pose:
      func: get_rigid_object_pose
      mode: add
      name: container_sphere_pose
      params:
        entity_cfg:
          uid: container_sphere
    block_cube_2_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_cube_2_pose
      params:
        entity_cfg:
          uid: block_cube_2
    block_sphere_2_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_sphere_2_pose
      params:
        entity_cfg:
          uid: block_sphere_2
simulation:
  light:
    direct:
    - uid: light_1
      light_type: sun
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
