environment_id: stack_cups
physics: newton
max_episodes: 5
env:
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        color_range:
        - - 0.6
          - 0.6
          - 0.6
        - - 1
          - 1
          - 1
        intensity_range:
        - 2.0
        - 8.0
    init_cup_1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: cup_1
        position_range:
        - - 0.66
          - -0.15
          - 0.921
        - - 0.74
          - -0.05
          - 0.921
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    init_cup_2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: cup_2
        position_range:
        - - 0.76
          - -0.15
          - 0.921
        - - 0.84
          - -0.05
          - 0.921
        rotation_range:
        - - 0
          - 0
          - -0.52
        - - 0
          - 0
          - 0.52
        relative_position: false
    settle_tabletop_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: cup_1
        - uid: cup_2
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        control_parts:
        - eef
    cup_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: cup_1_pose
      params:
        entity_cfg:
          uid: cup_1
    cup_2_pose:
      func: get_rigid_object_pose
      mode: add
      name: cup_2_pose
      params:
        entity_cfg:
          uid: cup_2
