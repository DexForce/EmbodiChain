environment_id: pour_water
physics: newton
physics_config:
  physics_dt: 0.005
  # Resolve the thin bottle wall at 0.833 ms per fluid update.
  num_substeps: 6
  collision_cfg: null
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      solver: newton
      integrator: implicitfast
      iterations: 50
      ls_iterations: 100
      cone: elliptic
      impratio: 1000.0
      use_mujoco_contacts: true
      enable_multiccd: false
      ccd_iterations: 10
    # Keep 30 rigid steps per 5 ms outer step.
    sph_rigid_substeps: 5
    sph_rne_mode: disabled
    sph_cfg:
      sph_method: dfsph
      particle_support_radius: 0.003375
      max_neighbors: 192
      viscosity: 0.0006
      surface_tension_coefficient: 0.002
      surface_normal_threshold: 0.08
      pressure_relaxation: 0.2
      divergence_max_iterations: 10
      density_max_iterations: 20
      max_velocity: 2.0
      volume_map_boundary_enabled: true
      volume_map_resolution: 192
      volume_map_quadrature_samples: 6
      volume_map_volume_scale: 0.8
      sdf_boundary_enabled: false
max_episodes: 5
max_episode_steps: 5500
num_envs: 1
arena_space: 3.0
render_cfg:
  renderer: fast-rt
simulation:
  light:
    direct:
    - uid: light_1
      light_type: rect
      color: [1.0, 0.95, 0.88]
      intensity: 5.0
      init_pos: [0.35, -0.5, 2.1]
      direction: [0.35, 0.4, -1.0]
      rect_width: 1.0
      rect_height: 0.8
    - uid: fill_light
      light_type: rect
      color: [0.88, 0.94, 1.0]
      intensity: 1.5
      init_pos: [1.25, 0.6, 1.7]
      direction: [-0.5, -0.5, -1.0]
      rect_width: 0.8
      rect_height: 0.8
  background:
  - uid: table
    shape:
      shape_type: Cylinder
      axis: Z
      radius: 0.5
      half_height: 0.05
    attrs:
      collision_props:
        backend: newton
        has_particle_collision: true
    body_scale: [1, 1, 1]
    body_type: static
    init_pos: [0.725, 0.0, 0.825]
    visual_shape:
      shape_type: Mesh
      fpath: PourWaterAssets/table.glb
  rigid_object:
  - uid: cup
    shape:
      shape_type: Compound
      parts:
      - position: [0, 0, -0.022]
        shape:
          shape_type: Cylinder
          radius: 0.022
          half_height: 0.022
          axis: Z
      - position: [0, 0, 0.022]
        shape:
          shape_type: Cylinder
          radius: 0.027
          half_height: 0.022
          axis: Z
    attrs:
      mass_props:
        mass: 0.03
        com_position: [0.0, 0.0, -0.00172497]
        inertia:
        - [3.067136e-05, 0.0, -0.0]
        - [0.0, 3.067136e-05, -0.0]
        - [-0.0, -0.0, 1.6138378e-05]
      collision_props:
        backend: newton
        has_particle_collision: true
        condim: 6
        contact_offset: 0.0005
        rest_offset: 0.0001
      material_props:
        backend: newton
        dynamic_friction: 1.1
        ke: 400000
        kd: 1265
    init_pos: [0.75, 0.1, 0.921]
    body_scale: [1, 1, 1]
    particle_collision_shape:
      shape_type: Mesh
      fpath: ./boundaries/cup.obj
      collision: &id001
        approximation: sdf
        force_sdf: true
        sdf_resolution: 192
        sdf_narrow_band_range: [-0.025, 0.025]
        sdf_padding: 0.012
        sdf_texture_format: uint16
    visual_shape:
      shape_type: Mesh
      fpath: PourWaterAssets/cup.glb
  - uid: bottle
    shape:
      shape_type: Compound
      parts:
      - position: [0, 0, -0.023]
        shape:
          shape_type: Cylinder
          radius: 0.028
          half_height: 0.063
          axis: Z
      - position: [0, 0, 0.048]
        shape:
          shape_type: Cylinder
          radius: 0.024
          half_height: 0.008
          axis: Z
      - position: [0, 0, 0.063]
        shape:
          shape_type: Cylinder
          radius: 0.012
          half_height: 0.007
          axis: Z
    attrs:
      mass_props:
        mass: 0.03
        com_position: [0.0, 0.0, -0.016862]
        inertia:
        - [7.3447308e-05, 0.0, -0.0]
        - [0.0, 7.3447308e-05, -0.0]
        - [-0.0, -0.0, 1.9968357e-05]
      collision_props:
        backend: newton
        has_particle_collision: true
        condim: 6
        contact_offset: 0.0005
        rest_offset: 0.0001
      material_props:
        backend: newton
        dynamic_friction: 1.1
        ke: 400000
        kd: 1265
        torsional_friction: 0.1
        rolling_friction: 0.03
    init_pos: [0.75, -0.1, 0.962]
    body_scale: [1, 1, 1]
    particle_collision_shape:
      shape_type: Mesh
      fpath: ./boundaries/bottle.obj
      collision: *id001
    visual_shape:
      shape_type: Mesh
      fpath: PourWaterAssets/bottle.glb
  rigid_object_group: []
  articulation: []
  # The source profile is inside the bottle shell, including the narrow neck.
  fluid_object:
  - uid: water
    density: 1000.0
    particle_spacing: 0.0015
    particle_radius: 0.00045
    spawn:
      kind: revolved_volume
      profile:
      - [-0.082, 0.021]
      - [-0.077, 0.026]
      - [0.037, 0.026]
      - [0.052, 0.021]
      - [0.062, 0.009]
      - [0.070, 0.009]
      fill_level: 0.68
      clearance: 0.0015
      reference_uid: bottle
    render:
      mode: mesh_surface
      render_radius: 0.00045
      clip_below_z: 0.87
      material:
        base_color: [0.03, 0.4, 0.88, 1.0]
        roughness: 0.12
        metallic: 0.0
        ior: 1.333
      mesh_surface:
        gpu_enabled: true
        cell_size: 0.0008100000000000001
        max_res: 512
        kernel_radius: 0.00225
        iso_density: 0.57
        density_smooth_iters: 2
        aabb_trim_fraction: 0.0
        min_component_tris: 32
        laplacian_iters: 4
        laplacian_alpha: 0.11
        update_period: 1
env:
  target_control_frequency: 100
  events:
    settle_pour_objects_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: bottle
        - uid: cup
        min_steps: 10
        max_steps: 180
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
    refill_water:
      func: reset_fluid_in_container
      mode: reset
      params:
        entity_cfgs:
        - uid: water
        - uid: bottle
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        robot_meta:
          robot_type: CobotMagic
        extra:
          scene_type: Commercial
          task_description: Pour water
          data_type: sim
        use_videos: true
  control_parts: [left_arm, left_eef, right_arm, right_eef]
  observations:
    water_summary:
      func: get_fluid_summary
      mode: add
      name: fluid/summary
      params:
        entity_cfg:
          uid: water
      extra:
        shape: [5]
    received_volume:
      func: get_fluid_volume_in_region
      mode: add
      name: fluid/received_volume
      params:
        entity_cfgs:
        - uid: water
        - uid: cup
        lower: [-0.026, -0.026, -0.039]
        upper: [0.026, 0.026, 0.04]
        # Local (height, inner radius) pairs; exclude water above the rim and outside the wall.
        radial_profile:
        - [-0.039, 0.0165]
        - [-0.034, 0.018]
        - [0.032, 0.0255]
        - [0.04, 0.027]
      extra:
        shape: [1]
