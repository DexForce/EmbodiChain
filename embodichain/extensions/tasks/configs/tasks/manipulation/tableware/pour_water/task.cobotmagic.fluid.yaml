id: PourWater-CobotMagic-Fluid-v1

collection:
  qualification:
    observations:
      received_volume: {min: [0.00005]}
      water_summary: {min: [null, null, null, null, 1.0], when: always}
environment:
  component: env.fluid.yaml

evaluation:
  component: task_program/evaluation.fluid.yaml

task_program:
  program: task_program/program.fluid.yaml
  integration: task_program/integration.fluid.yaml
  execution_policy:
    component: ../../../../components/execution_policies/trajectory_open_loop.yaml
    overrides:
      motion:
        sample_count: 160
      recovery:
        goal_rotation_threshold: 3.141592653589793

embodiment:
  component: ../../../../components/embodiments/cobotmagic.yaml
  overrides:
    root_props:
      newton_mimic_stabilizer: true
