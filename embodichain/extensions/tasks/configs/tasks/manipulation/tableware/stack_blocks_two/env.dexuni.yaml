environment_id: stack_blocks_two
physics: newton
max_episodes: 5
max_episode_steps: 2400
simulation:
  light:
    direct:
    - uid: light_1
      light_type: sun
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: table
    shape:
      shape_type: Mesh
      fpath: CircleTableSimple/circle_table_simple.ply
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
      collision_props:
        collision_enabled: false
    body_scale:
    - 1
    - 1
    - 1
    body_type: static
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    init_rot:
    - 0
    - 90
    - 0
  - uid: table_collision
    body_type: static
    shape:
      shape_type: Cylinder
      half_height: 0.05
      radius: 0.5
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    render_enabled: false
    attrs:
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
      collision_props:
        backend: newton
        condim: 4
  rigid_object:
  - uid: block_1
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        backend: newton
        condim: 4
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
    init_pos:
    - 0.75
    - -0.1
    - 0.9
    body_scale:
    - 1
    - 1
    - 1
  - uid: block_2
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        backend: newton
        condim: 4
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
    init_pos:
    - 0.75
    - 0.1
    - 0.9
    body_scale:
    - 1
    - 1
    - 1
env:
  task_instruction: Stack the two blocks into a stable tower with block 2 on top of
    block 1.
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        extra:
          scene_type: tabletop
          task_description: stack_blocks_two
          data_type: sim
        use_videos: true
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        color_range:
        - - 0.6
          - 0.6
          - 0.6
        - - 1
          - 1
          - 1
        intensity_range:
        - 2.0
        - 8.0
    init_block_1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_1
        position_range:
        - - -0.08
          - -0.08
          - 0.0
        - - 0.08
          - 0.08
          - 0.0
        rotation_range:
        - - 0
          - 0
          - -0.75
        - - 0
          - 0
          - 0.75
        relative_position: true
    init_block_2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_2
        position_range:
        - - -0.08
          - -0.08
          - 0.0
        - - 0.08
          - 0.08
          - 0.0
        rotation_range:
        - - 0
          - 0
          - -0.75
        - - 0
          - 0
          - 0.75
        relative_position: true
    settle_tabletop_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: block_1
        - uid: block_2
        min_steps: 10
        max_steps: 120
        required_stable_checks: 3
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        control_parts:
        - eef
    block_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_1_pose
      params:
        entity_cfg:
          uid: block_1
    block_2_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_2_pose
      params:
        entity_cfg:
          uid: block_2
physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 50
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
  collision_cfg: null
  dexuni_mujoco_joints_per_arena: 14
