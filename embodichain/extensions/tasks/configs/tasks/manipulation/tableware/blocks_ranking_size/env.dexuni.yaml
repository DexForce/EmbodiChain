environment_id: blocks_ranking_size
physics: newton
max_episodes: 5
env:
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        color_range:
        - - 0.6
          - 0.6
          - 0.6
        - - 1
          - 1
          - 1
        intensity_range:
        - 2.0
        - 8.0
    init_block_1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_1
        position_range:
        - - 0.665
          - -0.15
          - 0.9085
        - - 0.705
          - -0.11
          - 0.9085
        rotation_range:
        - - 0
          - 0
          - -43.0
        - - 0
          - 0
          - 43.0
        relative_position: false
    init_block_2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_2
        position_range:
        - - 0.665
          - -0.025
          - 0.9025
        - - 0.705
          - 0.015
          - 0.9025
        rotation_range:
        - - 0
          - 0
          - -43.0
        - - 0
          - 0
          - 43.0
        relative_position: false
    init_block_3_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_3
        position_range:
        - - 0.665
          - 0.1
          - 0.8965
        - - 0.705
          - 0.14
          - 0.8965
        rotation_range:
        - - 0
          - 0
          - -43.0
        - - 0
          - 0
          - 43.0
        relative_position: false
    settle_tabletop_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: block_1
        - uid: block_2
        - uid: block_3
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        control_parts:
        - eef
    block_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_1_pose
      params:
        entity_cfg:
          uid: block_1
    block_2_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_2_pose
      params:
        entity_cfg:
          uid: block_2
    block_3_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_3_pose
      params:
        entity_cfg:
          uid: block_3
simulation:
  light:
    direct:
    - uid: light_1
      light_type: sun
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: table
    shape:
      shape_type: Mesh
      fpath: CircleTableSimple/circle_table_simple.ply
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
      collision_props:
        collision_enabled: false
    body_scale:
    - 1
    - 1
    - 1
    body_type: static
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    init_rot:
    - 0
    - 90
    - 0
  - uid: table_collision
    body_type: static
    shape:
      shape_type: Cylinder
      half_height: 0.05
      radius: 0.5
    init_pos:
    - 0.725
    - 0.0
    - 0.825
    render_enabled: false
    attrs:
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
      collision_props:
        backend: newton
        condim: 4
  rigid_object:
  - uid: block_1
    shape:
      shape_type: Cube
      size:
      - 0.063
      - 0.063
      - 0.063
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        backend: newton
        condim: 4
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
    init_pos:
    - 0.685
    - -0.13
    - 0.9085
    body_scale:
    - 1
    - 1
    - 1
  - uid: block_2
    shape:
      shape_type: Cube
      size:
      - 0.051
      - 0.051
      - 0.051
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        backend: newton
        condim: 4
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
    init_pos:
    - 0.685
    - -0.005
    - 0.9025
    body_scale:
    - 1
    - 1
    - 1
  - uid: block_3
    shape:
      shape_type: Cube
      size:
      - 0.039
      - 0.039
      - 0.039
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        backend: newton
        condim: 4
      material_props:
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
        dynamic_friction: 0.97
        static_friction: 0.99
    init_pos:
    - 0.685
    - 0.12
    - 0.8965
    body_scale:
    - 1
    - 1
    - 1
max_episode_steps: 2400
physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 50
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
  collision_cfg: null
  dexuni_mujoco_joints_per_arena: 15
