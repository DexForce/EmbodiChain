          shape_type: Cube
          size: [0.026, 0.028, 0.012]
        position: [-0.04, 0, 0.1035]
    init_pos: [0.2, -0.45, 0.866]
    init_rot: [0, 90, 0]
    attrs:
      mass_props:
        mass: 0.105
        inertia: [0.001, 0.001, 0.001]
      material_props:
        static_friction: 2.0
        dynamic_friction: 1.6
  - uid: trash
    body_type: dynamic
    shape:
      shape_type: Cube
      size: [0.04, 0.04, 0.04]
    init_pos: [-0.2, 0.45, 0.831]
    attrs:
      mass_props:
        mass: 0.04
        inertia: [0.001, 0.001, 0.001]
      material_props:
        static_friction: 1.15
        dynamic_friction: 0.95
env:
  target_control_frequency: 20
  sim_steps_per_control: 8
  task_instruction: Clear the destination bin and pass the hammer between the two arms into it.
