environment_id: robosuite_two_arm_transport
physics: default
num_envs: 1
max_episode_steps: 2200
arena_space: 3.5
simulation:
  background:
  - uid: table_source
    body_type: static
    shape:
      shape_type: Cube
      size: [0.8, 0.3, 0.05]
    init_pos: [0, -0.45, 0.775]
  - uid: table_destination
