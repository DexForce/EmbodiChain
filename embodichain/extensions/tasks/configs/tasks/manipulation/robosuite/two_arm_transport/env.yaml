  - uid: pedestal_1
    body_type: static
    shape:
      shape_type: Cube
      size: [0.22, 0.22, 0.72]
    init_pos: [0, 0.67, 0.36]
  - uid: start_bin
    body_type: static
    shape:
      shape_type: Compound
      parts:
      - shape:
          shape_type: Cube
          size: [0.3, 0.3, 0.01]
        position: [0, 0, 0.005]
      - shape:
