        position: [-0.145, 0, 0.08]
      - shape:
          shape_type: Cube
          size: [0.01, 0.28, 0.14]
        position: [0.145, 0, 0.08]
    init_pos: [0.2, -0.45, 0.8]
  - uid: target_bin_floor
    body_type: static
    shape: {shape_type: Cube, size: [0.3, 0.3, 0.01]}
    init_pos: [-0.2, 0.45, 0.805]
  - uid: target_bin_walls
    body_type: static
    shape:
      shape_type: Compound
      parts:
      - shape:
          shape_type: Cube
          size: [0.3, 0.01, 0.14]
        position: [0, -0.145, 0.08]
      - shape:
          shape_type: Cube
          size: [0.3, 0.01, 0.14]
        position: [0, 0.145, 0.08]
      - shape:
          shape_type: Cube
          size: [0.01, 0.28, 0.14]
        position: [-0.145, 0, 0.08]
      - shape:
          shape_type: Cube
