environment_id: hand_over
physics: newton
max_episodes: 1
max_episode_steps: 3600
num_envs: 1
arena_space: 3.0
physics_config:
  physics_dt: 0.01
  num_substeps: 20
  sync_to_renderer: false
  collision_cfg: null
  dexuni_mujoco_joints_per_arena: 24
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    contact_mode: auto
    mujoco_options:
      integrator: implicitfast
      iterations: 20
      ls_iterations: 50
      cone: elliptic
      impratio: 10.0
      enable_multiccd: true
      use_mujoco_contacts: true
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color:
      - 0.6
      - 0.6
      - 0.6
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: support_surface
    shape:
      shape_type: Cube
      size:
      - 0.8
      - 1.2
      - 0.02
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        dynamic_friction: 0.9
        static_friction: 0.95
        restitution: 0.01
    body_type: static
    init_pos:
    - 0.0
    - 0.0
    - 0.49
    init_rot:
    - 0.0
    - 0.0
    - 0.0
  rigid_object:
  - uid: handover_object
    shape:
      shape_type: Mesh
      fpath: SodaCan/simple_cola_can.obj
      compute_uv: false
      collision:
        approximation: convex_decomposition
        max_hulls: 16
    attrs:
      mass_props:
        mass: 0.33
      rigid_props:
        angular_damping: 1.0
        linear_damping: 0.5
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.0
        backend: newton
        condim: 4
      material_props:
        dynamic_friction: 0.97
        static_friction: 0.99
        restitution: 0.01
        backend: newton
        ke: 40000.0
        kd: 400.0
        torsional_friction: 0.1
        rolling_friction: 0.01
    init_pos:
    - 0.0
    - 0.02
    - 0.62
    init_rot:
    - 90.0
    - 0.0
    - 0.0
    body_scale:
    - 0.56
    - 0.56
    - 0.56
  rigid_object_group: []
  articulation: []
env:
  sim_steps_per_control: 4
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        extra:
          scene_type: tabletop
          task_description: hand_over
          data_type: sim
        use_videos: true
  events:
    settle_can_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: handover_object
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  extensions: {}
