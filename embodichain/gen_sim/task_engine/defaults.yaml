schema_version: embodichain.task-engine-defaults/v1

workflow:
  max_parallel_workers: 2
  max_scene_attempts: 2
  max_action_attempts: 1

planning:
  candidate_count: 3
  planning_mode: offline
  max_episodes: 1
  max_episode_steps: 6000

execution:
  num_envs: 1
  success_policy: any
  min_successful_envs: 1
