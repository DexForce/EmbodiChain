<header class="topbar">

</header>
<section class="run-heading">
  <div class="run-title"><div><span class="eyebrow">GENSIM / TASK ENGINE</span><h1 id="task-title"></h1></div><div id="run-status" class="status-line"></div></div>

  <span id="translation-status" class="caption"></span>
  <details id="original-instruction"><summary data-i18n="originalInstruction">原始指令</summary><p id="original-instruction-text"></p></details>
  <div id="run-meta" class="run-meta"></div>
</section>
<section id="metrics" class="metrics" data-aria="summary"></section>
<main class="workspace">
  <div class="main-pane">
    <section class="asset-band"><div class="section-head"><h2><span class="section-number">01</span><span data-i18n="assets">关联资产</span></h2><span class="section-note" id="asset-count"></span></div><div id="assets" class="assets"></div></section>
    <section class="graph-section">
      <div class="section-head"><h2><span class="section-number">02</span><span data-i18n="dependencies">执行依赖</span></h2><span class="section-note" id="visibility"></span></div>
      <div class="graph-bar">
        <div class="segmented" role="group" data-aria="graphView"><button id="mode-groups" aria-pressed="true"><svg class="icon"><use href="#i-GitBranch"/></svg><span data-i18n="stages">阶段</span></button><button id="mode-calls" aria-pressed="false"><svg class="icon"><use href="#i-ListTree"/></svg><span data-i18n="calls">调用</span></button></div>
        <label class="search"><svg class="icon"><use href="#i-Search"/></svg><input id="search" type="search" data-placeholder="search" data-aria="search"></label>
        <select id="environment" data-aria="environment"></select>
        <select id="status-filter" data-aria="statusFilter"><option value="all" data-i18n="allStates">全部状态</option><option value="succeeded" data-i18n="passed">通过</option><option value="failed" data-i18n="failed">失败</option><option value="unknown" data-i18n="unknown">未验证</option></select>
        <div class="graph-tools"><button id="zoom-out" class="icon-button" data-title="zoomOut"><svg class="icon"><use href="#i-ZoomOut"/></svg></button><output id="zoom">100%</output><button id="zoom-in" class="icon-button" data-title="zoomIn"><svg class="icon"><use href="#i-ZoomIn"/></svg></button><button id="fit" class="icon-button" data-title="fit"><svg class="icon"><use href="#i-Maximize"/></svg></button><button id="reset" class="icon-button" data-title="reset"><svg class="icon"><use href="#i-RotateCcw"/></svg></button><span class="divider"></span><button id="export-svg" class="icon-button" data-title="exportSvg"><svg class="icon"><use href="#i-Download"/></svg></button><button id="export-json" class="icon-button" data-title="exportJson"><svg class="icon"><use href="#i-FileJson"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" data-aria="dependencyGraph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#3C5E86" stroke-width="1.5"/></marker></defs><g id="world"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g></g></svg></div>
      <div class="graph-legend"><span><i></i><span data-i18n="dependency">依赖关系</span></span><span><i class="selected-line"></i><span data-i18n="selection">当前选择</span></span><span class="legend-note" data-i18n="orderNote">依赖顺序，不是等比例时间轴</span></div>
    </section>
    <section class="goals"><div class="section-head"><h2><span class="section-number">03</span><span data-i18n="finalGoals">终态目标</span></h2><span id="goal-summary" class="section-note"></span></div><div id="goal-list" class="goal-list"></div></section>
  </div>
  <aside id="inspector" class="inspector" data-aria="inspector">
    <div class="inspector-top"><span class="eyebrow" data-i18n="inspector">证据详情</span><button id="close-detail" class="icon-button mobile-only" data-title="close"><svg class="icon"><use href="#i-X"/></svg></button><svg class="icon desktop-only"><use href="#i-SlidersHorizontal"/></svg></div>
    <div id="detail"></div>
    <section id="recording" class="recording"><div class="section-head"><h3 data-i18n="recording">运行记录</h3><a id="video-link" target="_blank" rel="noopener" data-title="openVideo"><svg class="icon"><use href="#i-ExternalLink"/></svg></a></div><video id="video" controls preload="metadata" playsinline data-aria="recording"></video><p id="recording-caption" class="caption"></p></section>
  </aside>
</main>
