schema_version: 1
name: atomic_dual_ur5_pgi_hand_over_spatial_generalization
suite_version: atomic_dual_ur5_pgi_hand_over_spatial_generalization_v4
profile: coverage

robot:
  id: dual_ur5_pgi_hand_over
  provider: dual_arm
  config:
    robot_type: ur5
    uid: benchmark_dual_ur5_hand_over
    urdf_name: benchmark_dual_ur5_hand_over
    tcp_z: 0.15
    solver: ur
    ur_ik_nearest_weight: [1.0, 4.0, 1.0, 1.0, 1.0, 1.0]

planners:
  - id: toppra
    adapter: toppra
    role: primary_baseline
    enabled: true
    config: {}

protocol:
  report_schema_version: "3"
  # Preserve the existing Atomic motion budget for every timed planner.
  joint_velocity_limit_rad_s: 0.2
  joint_acceleration_limit_rad_s2: 0.5
  warmup_trials: 1
  measured_trials: 1
  sample_interval: 80
  validation_samples: 512
  position_threshold_m: 0.01
  rotation_threshold_rad: 0.1
  joint_limit_tolerance_rad: 0.00001

tracks:
  - id: spatial-hand-over
    scenario: atomic_skill
    enabled: true
    domains:
      - id: nominal
        version: v1
        kind: nominal
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: fixed_scene
        perturbations:
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.0, 0.0, 0.0]
      - id: object_xy
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.03, 0.03, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.0, 0.0, 0.0]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            object_translation_jitter_m: [0.03, 0.03, 0.0]
            object_yaw_jitter_rad: 0.0
            target_translation_jitter_m: [0.0, 0.0, 0.0]
            seed_stride: 1
      - id: object_yaw
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.523599
          target_translation_jitter_m: [0.0, 0.0, 0.0]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            pose_batch_size: 8
            object_translation_jitter_m: [0.0, 0.0, 0.0]
            object_yaw_jitter_rad: 0.523599
            target_translation_jitter_m: [0.0, 0.0, 0.0]
            seed_stride: 1
      - id: target_relative_pose
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.02, 0.02, 0.0]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            object_translation_jitter_m: [0.0, 0.0, 0.0]
            object_yaw_jitter_rad: 0.0
            target_translation_jitter_m: [0.02, 0.02, 0.0]
            seed_stride: 1
      - id: task_frame_planar
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: deterministic_stratified_pose_batch
        perturbations:
          distribution: stratified
          task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
          task_frame_yaw_jitter_rad: 0.174533
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            sampling_pattern: stratified
            pose_batch_size: 8
            task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
            task_frame_yaw_jitter_rad: 0.174533
            seed_stride: 1
      - id: object_target_position
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: deterministic_stratified_pose_batch
        perturbations:
          distribution: stratified
          object_translation_jitter_m: [0.03, 0.03, 0.0]
          object_yaw_jitter_rad: 0.523599
          target_translation_jitter_m: [0.02, 0.02, 0.02]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            sampling_pattern: stratified
            pose_batch_size: 8
            object_translation_jitter_m: [0.03, 0.03, 0.0]
            object_yaw_jitter_rad: 0.523599
            target_translation_jitter_m: [0.02, 0.02, 0.02]
            seed_stride: 1
      - id: target_relative_shell
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: deterministic_workspace_shell_batch
        perturbations:
          distribution: workspace_shell
          target_translation_jitter_m: [0.04, 0.04, 0.02]
          workspace_buckets: [near, mid, far]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            sampling_pattern: workspace_shell
            pose_batch_size: 8
            target_translation_jitter_m: [0.04, 0.04, 0.02]
            seed_stride: 1
      - id: bilateral_role_mirror
        version: v1
        kind: robustness
        applicability: [hand_over]
        scene_layout: dual_ur5_pgi_soda_can_table_v1
        case_generator: mirrored_control_assignment
        perturbations:
          mirror_axis: y
          source_arm: right
          destination_arm: left
        overrides:
          batch_sizes: [1]
          control_parts:
            source: {motion: right_arm, grasp: right_eef}
            destination: {motion: left_arm, grasp: left_eef}
    config:
      batch_sizes: [1]
      seeds: [11, 23, 47]
      physics:
        steps_per_waypoint: 16
        hold_steps: 80
        hold_sim_steps: 2
        joint_tracking_tolerance_rad: 0.05
      grippers:
        - control_part: left_eef
          open_qpos: [0.0]
          grasp_qpos: [0.04]
        - control_part: right_eef
          open_qpos: [0.0]
          grasp_qpos: [0.04]
      fixtures:
        - id: support_surface
          kind: cube
          size: [0.8, 1.2, 0.02]
          position: [0.0, 0.0, 0.49]
          mass: 10.0
          dynamic_friction: 0.9
          static_friction: 0.95
          restitution: 0.01
      objects:
        - id: soda_can
          kind: mesh
          asset_path: SodaCan/simple_cola_can.obj
          scale: [0.56, 0.56, 0.56]
          rotation_deg: [90.0, 0.0, 0.0]
          position: [0.0, 0.02, 0.62]
          max_convex_hull_num: 16
          mass: 0.01
          dynamic_friction: 0.97
          static_friction: 0.99
          restitution: 0.01
          linear_damping: 0.5
          angular_damping: 1.0
          contact_offset: 0.001
          rest_offset: 0.0
          settle_steps: 500
      skills:
        - id: hand_over
          sample_count: 220
          pre_grasp_distance_m: 0.08
          lift_height_m: 0.15
          hand_interp_steps: 10
          grasp_sample_count: 10000
          pre_action_settle_steps: 500
          cases:
            - name: spatial_soda_can_left_to_right
              object: soda_can
              task_difficulty: medium
              target_object_offset_m: [0.0, -0.22, 0.06]
