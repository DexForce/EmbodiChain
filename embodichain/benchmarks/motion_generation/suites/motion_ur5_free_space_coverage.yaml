schema_version: 1
name: motion_ur5_free_space_coverage
suite_version: motion_ur5_free_space_coverage_v3
profile: coverage

robot:
  id: ur5
  provider: ur5
  config: {}

planners:
  - id: curobo
    adapter: curobo
    role: primary_baseline
    enabled: true
    config:
      max_attempts: 5
      max_planning_time: null
      interpolation_dt: 0.025
      collision_activation_distance: 0.01
      use_cuda_graph: true
      cuda_graph_fallback: true
      warmup_iterations: 1
      preserve_plan_samples: true
      world:
        multi_env: false
      auto_gen:
        sphere_density: 0.1
        collision_sphere_buffer: 0.0
  - id: ik_interpolate
    adapter: ik_interpolate
    role: diagnostic_baseline
    enabled: true
    config:
      interpolation_dt: 0.025
  - id: toppra
    adapter: toppra
    role: diagnostic_baseline
    enabled: true
    config: {}
  - id: nmg
    adapter: nmg_onnx
    role: candidate
    enabled: false
    config: &nmg_policy
      # Supply the external UR5 policy with --nmg-onnx-path; otherwise NMG is skipped.
      onnx_model_path: null
      num_waypoints: 5
      steps_per_waypoint: 30
      max_steps: 150
      action_scale: 0.2
      num_arm_joints: 6
      joint_periodic_features: true
      use_relative_obs: true
      intermediate_orientation: true
      pos_eps: 0.01
      rot_eps: 0.1
      joint_eps: 0.01
  # Same policy and inputs, with shared-limit retiming.
  - id: nmg_retimed
    adapter: nmg_onnx
    role: candidate
    enabled: false
    config:
      <<: *nmg_policy
      retime: true

protocol:
  report_schema_version: "3"
  warmup_trials: 3
  measured_trials: 5
  sample_interval: 80
  validation_samples: 256
  position_threshold_m: 0.01
  rotation_threshold_rad: 0.1
  joint_limit_tolerance_rad: 0.00001
  # Effective robot velocity caps; acceleration is a benchmark budget.
  joint_velocity_limit_rad_s: null
  joint_acceleration_limit_rad_s2: 10.0
  joint_jerk_limit_rad_s3: null

tracks:
  - id: free-space-common
    scenario: free_space
    enabled: true
    config:
      sampling_method: cartesian
      population_design: balanced
      batch_modes: [homogeneous, heterogeneous]
      distance_bins: [near, mid, far]
      motion_components: [translation, rotation, combined]
      target_types: [eef, joint]
      joint_threshold_rad: 0.02
      batch_sizes: [1, 8, 64]
      waypoint_counts: [1, 3, 5]
      path_shapes: [direct, l_turn, s_curve]
      start_state_bins: [nominal, random_reachable, near_limit, near_singularity]
      seeds: [11, 23, 37]
