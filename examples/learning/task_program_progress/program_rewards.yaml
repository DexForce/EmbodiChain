    objective:
      skill_id: pick_up
      binding:
        robot: CobotMagic
        motion_part: right_arm
        object: block_2
        support: table
        pad_links: &id001
        - right_link7
        - right_link8
        hand_links: &id002
        - right_gripper_base
        - right_link7
        - right_link8
      goal:
        position:
        - 0.75
        - 0.1
        - 1.05
  - stage: stack_block
    objective:
      skill_id: place
      binding:
        robot: CobotMagic
        motion_part: right_arm
        object: block_2
        support: block_1
        pad_links: *id001
        hand_links: *id002
      goal:
        position:
        - 0.0
        - 0.0
        - 0.05
        reference: block_1
