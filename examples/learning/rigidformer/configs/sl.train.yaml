# Fixed CPU geometry archive; paths resolve from the caller's working directory.
factory: embodichain_models.dynamics.rigidformer.sl_recipe:build_rigidformer_trainer
data:
  path: geometry.pt
  max_resident_bytes: 536870912
  max_batch_bytes: 67108864
model:
  dim: 128
  dim_head: 32
  heads: 4
  num_register_tokens: 4
  object_self_attn_depth: 3
  anchor_cross_attn_depth: 3
  object_hidden_layers: [0, 1, 3]
  num_anchors: 4
  vertex_properties_dim: 3
  max_pairwise_bytes: 268435456
optimizer:
  lr: 0.0003
  weight_decay: 0.01
trainer:
  output_dir: outputs/rigidformer/sl
  total_updates: 1000
  batch_size: 8
  seed: 42
  device: cpu
