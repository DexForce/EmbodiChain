factory: embodichain_models.dynamics.rigidformer.sl_recipe:build_rigidformer_trainer
model:
  preset: movi_a
  attention_backend: sdpa
precision: bf16
data:
  root: outputs/rigidformer/data/MOVi-A
  split_file: outputs/rigidformer/data/MOVi-A/splits.json
  scale_file: outputs/rigidformer/data/MOVi-A/object_scales.json
trainer:
  output_dir: outputs/rigidformer/movi_a/sl
  device: cuda
  batch_size: 32
  seed: 42
  checkpoint_interval: 5000

