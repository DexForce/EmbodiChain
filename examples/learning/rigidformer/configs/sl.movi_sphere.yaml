factory: embodichain_models.dynamics.rigidformer.sl_recipe:build_rigidformer_trainer
model:
  preset: movi_sphere
  attention_backend: sdpa
precision: bf16
data:
  root: outputs/rigidformer/data/MOVi-Sphere
  split_file: outputs/rigidformer/data/MOVi-Sphere/splits.json
  scale_file: outputs/rigidformer/data/MOVi-Sphere/object_scales.json
trainer:
  output_dir: outputs/rigidformer/movi_sphere/sl
  device: cuda
  batch_size: 32
  seed: 42
  checkpoint_interval: 5000
