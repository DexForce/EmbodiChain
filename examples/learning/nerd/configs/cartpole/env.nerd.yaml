# Train and export the matching dynamics model first; run from the repository root.
id: CartpoleDynamics-v1
physics: newton
physics_config:
  device: cpu
  physics_dt: 0.016666666666666666
  num_substeps: 1
  requires_grad: true
  use_cuda_graph: false
  collision_cfg: null
  solver_cfg:
    solver_type: nerd
    options:
      checkpoint: outputs/dynamics/cartpole/full/export
num_envs: 16
headless: true
renderer: auto
arena_space: 0.0
enable_ground_plane: false
enable_entity_gizmo: false
robot_ik_gizmo: null
max_episode_steps: 500
robot: null
sensor: []
env:
  sim_steps_per_control: 1
  extensions:
    random_reset: true
