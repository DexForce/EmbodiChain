environment_id: usd_scene_pick_place
physics: default
max_episodes: 1
max_episode_steps: 2400
num_envs: 1
physics_config:
  enable_ccd: true
simulation:
  usd_scene:
    name: environment
    source:
      file_path: ./scene.usda
    asset_cfgs:
      /World/table:
        uid: support_surface
      /World/cube:
        uid: cube
env:
  sim_steps_per_control: 4
  events:
    settle_cube_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs: [{uid: cube}]
        min_steps: 10
        max_steps: 120
        timeout_behavior: raise
