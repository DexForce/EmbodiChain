environment_id: library_pick_place
physics: default
num_envs: 1
max_episode_steps: 2400
enable_ground_plane: false
physics_config:
  physics_dt: 0.01
  enable_ccd: true
render_cfg:
  preset: gaussian
  renderer: hybrid
  spp: 1
  denoising: {window: 'off', offscreen: 'off'}
simulation:
  usd_scene:
    name: library
    source:
      # Replaced with the verified cache entry by run.py.
      file_path: library_asset.usda
      root_prim_path: /Asset/Visual
    pose:
      - [1.0, 0.0, 0.0, 0.8]
      - [0.0, 0.0, 1.0, 3.0]
      - [0.0, -1.0, 0.0, -0.05]
      - [0.0, 0.0, 0.0, 1.0]
    asset_cfgs:
      /Asset/Visual: {uid: library_background}
  background:
    - uid: support_surface
      body_type: static
      init_pos: [0.6, 0.0, 0.73]
      shape:
        shape_type: Cube
        size: [0.6, 1.0, 0.04]
        visual_material: {base_color: [0.25, 0.3, 0.35, 1.0], roughness: 0.9}
      attrs:
        material_props: {static_friction: 0.99, dynamic_friction: 0.97}
  rigid_object:
    - uid: cube
      body_type: dynamic
      init_pos: [0.45, 0.15, 0.777]
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
        visual_material:
          base_color: [0.95, 0.12, 0.015, 1.0]
          roughness: 0.7
          emissive: [0.8, 0.08, 0.005]
          emissive_intensity: 0.5
      attrs:
        mass_props: {mass: 0.05}
        rigid_props: {linear_damping: 0.2, angular_damping: 0.2}
        material_props: {static_friction: 0.99, dynamic_friction: 0.97}
env:
  sim_steps_per_control: 4
  events:
    settle_cube_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs: [{uid: cube}]
        min_steps: 10
        max_steps: 120
        timeout_behavior: raise
