id: LibraryPickPlace-DualUR5-v1
enable_sensor: true
environment: {component: env.yaml}
embodiment:
  # run.py snapshots the SDK component and replaces its sensor list.
  component: embodiment.rgbd.yaml
  overrides:
    init_pos: [1.683, 0.0, 0.4525]
    init_rot: [0.0, 0.0, -90.0]
task_program:
  program: task_program/program.yaml
  integration: task_program/integration.yaml
  execution_policy:
    component: policy.yaml
    overrides:
      motion: {velocity_limit: 0.5}
