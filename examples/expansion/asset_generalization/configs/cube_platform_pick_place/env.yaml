environment_id: cube_platform_pick_place
physics: default
max_episode_steps: 2400
num_envs: 1
arena_space: 2.5
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color: [0.6, 0.6, 0.6]
      intensity: 5.0
      direction: [0.0, 0.0, -1.0]
    - uid: rect_light
      light_type: rect
      color: [1.0, 1.0, 1.0]
      intensity: 8.0
      init_pos: [-0.42, 0.08, 0.8]
      direction: [0.0, 0.0, -1.0]
      rect_width: 0.5
      rect_height: 0.5
  background:
  - uid: platform
    shape:
      shape_type: Cube
      size: [0.16, 0.16, 0.05]
    body_type: static
    init_pos: [-0.42, 0.3, 0.025]
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
      material_props:
        dynamic_friction: 0.97
        static_friction: 0.99
  rigid_object:
  - uid: cube
    shape:
      shape_type: Cube
      size: [0.04, 0.04, 0.04]
    body_type: dynamic
    init_pos: [-0.42, -0.08, 0.02]
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
      material_props:
        dynamic_friction: 0.97
        static_friction: 0.99
  rigid_object_group: []
  articulation: []
env:
  sim_steps_per_control: 4
  events: {}
  dataset: {}
  record_trajectory: true
  trajectory_auto_save: true
