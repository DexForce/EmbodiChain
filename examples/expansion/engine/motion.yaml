schema_version: 1
source:
  kind: task_program
  source_id: repeated_cube_pick_place
  source_revision: one-cycle-v1
  unit_scope: episode
  template_id: task_program_call
  call_count: 2
  affordance_call_indices:
  - 0
  trajectory_call_indices:
  - 1
scene_randomization:
  enabled: false
  reference_family_count: 1
  profile: none
  change_scope: none
  keep_drop_targets: true
affordance:
  enabled: false
  branches_per_family: 1
  max_proposals: 1
  fallback: next_surviving_branch
trajectory:
  variants_per_family: 2
  spatial:
    enabled: true
    operators:
    - joint_residual
    joint_offset_scale: 0.002
    via_count: 1
    dedup_tolerance: 0.0001
  timing:
    enabled: false
visual:
  enabled: false
  profile_file: extensions/embodichain_tasks/configs/components/randomization_profiles/rgb_visual.yaml
  profiles: []
  apply_per_rollout: true
  balance: round_robin
  restore_before_next_candidate: true
observation:
  profiles: []
  capture_rgb: false
  capture_video: false
scheduling:
  policy: round_robin_fifo
  candidate_budget: 2
  reference_family_budget: 1
execution:
  max_inflight: 1
  compatibility: strict
persistence:
  sink: lerobot
  output_dir: /tmp/embodichain-expansion
