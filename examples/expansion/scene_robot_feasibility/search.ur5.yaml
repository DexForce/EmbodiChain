  max_wall_time_s: 600.0
  max_candidates: 8
  max_regions: 2
  validation_samples: 2
  ik_seeds: 2
  beam_width: 4
  max_rrt_nodes: 128
task_program:
  deployment: ../../../extensions/embodichain_tasks/configs/tasks/manipulation/repeated_pick_place/task.ur5.yaml
  program: program.yaml
  simulation_device: cpu
  enable_sensor: false
  settle_steps: 30
  initial_semantics:
  - kind: pose_near
    entity: cube
    position:
    - -0.42
    - -0.08
    - 0.025
    tolerance_m: 0.08
  initial_geometry:
  - kind: support_bounds
    entity: cube
    lower:
    - -1.0
    - -1.0
    - -0.003
    upper:
    - 1.0
    - 1.0
    - 0.08
  final_checks:
  - &id003
    kind: pose_near
    entity: cube
    position:
    - -0.4
    - 0.48
    - 0.025
    tolerance_m: 0.04
  - &id004
    kind: joint_range
    joint: gripper_finger1_joint_1
    lower: -0.001
    upper: 0.005
  - &id005
    kind: speed_below
    entity: cube
    linear_m_s: 0.03
    angular_rad_s: 0.2
  events:
  - event_id: lift
    conditions:
    - kind: lifted
      entity: cube
      height_m: 0.05
  - event_id: placed_and_released
    conditions:
    - *id003
    - *id004
    - *id005
    consecutive_steps: 3
  runtime_phase_by_call:
    '0': lift
    '1': place
  ignored_contacts:
