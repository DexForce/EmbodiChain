    - UR5/gripper_finger1_link_1
  - - UR5/gripper_base_link_1
    - UR5/gripper_finger2_link_1
  - - UR5/arm_base_link
    - default_plane
  - - UR5/wrist_3_link
    - UR5/gripper_base_link_1
  runtime_phase_by_segment:
