environment_id: pick_place
physics: default
physics_config:
  physics_dt: 0.004166666666666667
  enable_ccd: true
num_envs: 1
max_episode_steps: 600
arena_space: 2.5
simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.8, 0.8, 0.8]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  visual_object:
    - uid: goal_marker
      shape:
        shape_type: Cube
        size: [0.06, 0.06, 0.001]
        visual_material:
          base_color: [0.1, 0.8, 0.2, 1.0]
      init_pos: [-0.42, 0.28, 0.001]
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
        visual_material:
          base_color: [0.9, 0.35, 0.05, 1.0]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.025]
      attrs:
        mass_props: {mass: 0.05}
        rigid_props: {linear_damping: 0.2, angular_damping: 0.2}
        material_props: {static_friction: 0.99, dynamic_friction: 0.97}
  rigid_object_group: []
  articulation: []
env:
  control_parts: [arm, eef]
  target_control_frequency: 30
  task_instruction: Pick up the cube and place it in the target region.
  observations:
    tcp_pose:
      func: get_robot_eef_pose
      mode: add
      name: tcp_pose
      params: {part_name: arm}
      extra: {shape: [4, 4]}
    cube_velocity:
      func: get_rigid_object_velocity
      mode: add
      name: cube_velocity
      params:
        entity_cfg: {uid: cube}
      extra: {shape: [6]}
    cube_pose:
      func: get_object_pose
      mode: add
      name: cube_pose
      params:
        entity_cfg: {uid: cube}
        to_matrix: false
      extra: {shape: [7]}
    goal_position:
      func: target_position
      mode: add
      name: goal_position
      params: {}
      extra: {shape: [3]}
