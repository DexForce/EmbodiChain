# .github/release.yml

changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking

    - title: "🚀 New Features"
      labels:
        - feature

    - title: "🐛 Bug Fixes"
      labels:
        - bug

    - title: "🔧 Improvements"
      labels:
        - refactor
        - enhancement
        - performance

    - title: "📚 Documentation"
      labels:
        - docs

    - title: "🛠 Internal / CI"
      labels:
        - ci
        - dependencies
        - devtools

    - title: "Other Changes"
      labels:
        - "*"

  exclude:
    labels:
      - skip-release-notes
