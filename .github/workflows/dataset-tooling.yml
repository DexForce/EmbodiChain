name: Expert dataset tools

on:
  pull_request:
    paths:
      - 'embodichain/data_pipeline/**'
      - 'embodichain/cli/dataset.py'
      - 'embodichain/cli/main.py'
      - 'embodichain/lab/gym/envs/managers/datasets.py'
      - 'embodichain/lab/gym/envs/managers/async_datasets.py'
      - 'embodichain/lab/gym/envs/embodied_env.py'
      - 'tests/data_pipeline/**'
      - 'tools/lerobot_export/**'
      - '.github/workflows/dataset-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline inspection dependencies
        run: python -m pip install pytest 'numpy<2.3' pandas pyarrow av
      - name: Check offline imports and dataset inspection
        run: >-
          python -m pytest -q -c /dev/null --noconftest
          tests/data_pipeline/test_offline_imports.py
          tests/data_pipeline/test_dataset_inspection.py
          tests/data_pipeline/recording/test_journal.py
          tests/data_pipeline/recording/test_segments.py

  lerobot-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated converter with CPU PyTorch
        run: |
          python -m pip install uv==0.12.5
          uv pip install --system --torch-backend cpu './tools/lerobot_export[test]' 'torch==2.11.0+cpu' 'torchvision==0.26.0+cpu' 'torchcodec==0.11.1+cpu'
      - name: Verify official LeRobot reader, language recipes, and depth
        run: >-
          python -m pytest -q -c tools/lerobot_export/pyproject.toml
          tools/lerobot_export/tests
