name: Promote qualified EmbodiChain containers

on:
  push:
    branches: ['codex/container-promote-qualified-20261102']
    paths: ['.github/workflows/container-promote.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: embodichain-container-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: Linux
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_TOKEN: ${{ secrets.EMBODICHAIN_DOCKERHUB_PUBLISH_ONCE }}
    steps:
      - name: Initialize temporary publication files
        shell: bash
        run: |
          printf 'REGCTL_CONFIG=%s/embodichain-promote-%s.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'REGCTL_BIN=%s/regctl-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'PUBLICATION_REPORT=%s/embodichain-promotion-%s.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Require successful CI for the implementation commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          source = 'df878c6eb913d00f25f4b2c73226304814fb1c57'
          for run in (41471747933, 41471747895):
              request = Request(
                  f'https://api.github.com/repos/DexForce/EmbodiChain/actions/runs/{run}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              expected = {'head_sha': source, 'event': 'pull_request',
                          'status': 'completed', 'conclusion': 'success'}
              for key, value in expected.items():
                  if result[key] != value:
                      raise RuntimeError(f'CI run {run}: expected {key}={value}, got {result[key]}')
              print(f'CI run {run}: success at {source}')
          PY
      - name: Install the pinned registry client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64 \
            --output "$REGCTL_BIN"
          printf '%s  %s\n' \
            3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc \
            "$REGCTL_BIN" | sha256sum --check
          chmod 700 "$REGCTL_BIN"
      - name: Preserve the previous release and promote exact manifests
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$REGCTL_CONFIG"' EXIT
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import subprocess

          registry = [os.environ['REGCTL_BIN'], '--host',
                      'reg=192.168.3.13:5000,tls=disabled']
          source_revision = 'c42e8a0b0857ae00aeeb21d414d30318abb2e171'
          public_repo = 'docker.io/dexforce/embodichain'
          public_digest = 'sha256:7e0627b9ab3f7da3cb81109e8bd7fcc6e9231492d250026130ea518426b366dc'
          previous_digest = 'sha256:5cfd8f52237d8da7bf2461239295f4c136c482e30dd3c588ee283f882036ff6c'
          internal_repo = '192.168.3.13:5000/dexsdk'
          internal_digest = 'sha256:c3514d70890af98e413fdfe5ba2859c039d51f5b23be24639c3fed14cf31f322'
          public_alias = public_repo + ':ubuntu22.04-cuda12.8'
          legacy_alias = public_repo + ':ubuntu22.04-cuda12.8-legacy-5cfd8f52237d'
          targets = {
              public_repo + ':ubuntu22.04-cuda12.8-py312': (public_repo, public_digest),
              public_alias: (public_repo, public_digest),
              internal_repo + ':ubuntu22.04-cuda12.8.0-h5ffmpeg-v4-py311-py312':
                  (internal_repo, internal_digest),
          }

          def execute(*args):
              return subprocess.check_output(registry + list(args), text=True, timeout=120).strip()

          def digest(reference, allow_missing=False):
              result = subprocess.run(registry + ['image', 'digest', reference],
                                      text=True, capture_output=True, timeout=60)
              if result.returncode == 0:
                  return result.stdout.strip()
              if allow_missing and '[http 404]' in result.stderr:
                  return None
              raise RuntimeError(f'Cannot inspect {reference}: {result.stderr.strip()}')

          def promote(source, target, expected):
              execute('image', 'copy', source, target)
              actual = digest(target)
              if actual != expected:
                  raise RuntimeError(f'{target}: expected {expected}, got {actual}')
              print(f'{target} -> {actual}')

          token = os.environ['DOCKERHUB_TOKEN']
          if not token:
              raise RuntimeError('Temporary publishing credential is missing')
          subprocess.run(registry + ['registry', 'login', 'docker.io', '--user',
                                     'dexforce', '--pass-stdin'],
                         input=token, text=True, check=True, timeout=60)
          for repo, expected in ((public_repo, public_digest),
                                 (internal_repo, internal_digest)):
              pinned = repo + '@' + expected
              if digest(pinned) != expected:
                  raise RuntimeError(f'Qualified digest changed: {pinned}')
              config = json.loads(execute('image', 'inspect', pinned, '--format', '{{json .}}'))
              if config['architecture'] != 'amd64' or config['os'] != 'linux':
                  raise RuntimeError(f'Unexpected platform: {pinned}')
              revision = config['config']['Labels']['org.opencontainers.image.revision']
              if revision != source_revision:
                  raise RuntimeError(f'Unexpected source revision: {revision}')

          before = {target: digest(target, allow_missing=True) for target in targets}
          for target, (_, expected) in targets.items():
              allowed = (previous_digest, expected) if target == public_alias else (None, expected)
              if before[target] not in allowed:
                  raise RuntimeError(f'Concurrent tag change at {target}: {before[target]}')
          legacy = digest(legacy_alias, allow_missing=True)
          if legacy not in (None, previous_digest):
              raise RuntimeError(f'Rollback tag already identifies another image: {legacy}')
          if legacy is None:
              promote(public_repo + '@' + previous_digest, legacy_alias, previous_digest)
          for target, (repo, expected) in targets.items():
              if before[target] != expected:
                  promote(repo + '@' + expected, target, expected)
          after = {target: digest(target) for target in targets}
          if any(after[target] != expected for target, (_, expected) in targets.items()):
              raise RuntimeError('Post-promotion digest verification failed')
          report = {
              'published_at': datetime.now(timezone.utc).isoformat(),
              'qualified_image_source': source_revision,
              'ci_source': 'df878c6eb913d00f25f4b2c73226304814fb1c57',
              'ci_runs': [41471747933, 41471747895],
              'before': before, 'after': after,
              'rollback': {legacy_alias: digest(legacy_alias)},
          }
          Path(os.environ['PUBLICATION_REPORT']).write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: rm -f "$REGCTL_CONFIG"
      - name: Save publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-promotion-${{ github.run_id }}
          path: ${{ env.PUBLICATION_REPORT }}
          if-no-files-found: error
