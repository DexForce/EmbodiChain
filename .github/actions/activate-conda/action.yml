name: Activate conda py312 environment
description: Activate py312 and expose its executables on PATH.
runs:
  using: composite
  steps:
    - name: Activate conda py312 environment
      shell: bash -l {0}
      run: |
        source activate py312
        echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"
        python --version
        which python pip
