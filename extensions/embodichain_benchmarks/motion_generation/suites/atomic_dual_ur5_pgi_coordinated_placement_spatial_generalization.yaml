schema_version: 1
name: atomic_dual_ur5_pgi_coordinated_placement_spatial_generalization
suite_version: atomic_dual_ur5_pgi_coordinated_placement_spatial_generalization_v7
profile: coverage

robot:
  id: dual_ur5_pgi_coordinated_placement
  provider: dual_arm
  config:
    robot_type: ur5
    uid: benchmark_dual_ur5_coordinated_placement
    urdf_name: benchmark_dual_ur5_coordinated_placement
    tcp_z: 0.121
    solver: ur
    init_pos: [1.85, 0.0, 0.1]

planners:
  - id: toppra
    adapter: toppra
    role: primary_baseline
    enabled: true
    config: {}

protocol:
  report_schema_version: "3"
  # Preserve the existing Atomic motion budget for every timed planner.
  joint_velocity_limit_rad_s: 0.2
  joint_acceleration_limit_rad_s2: 0.5
  warmup_trials: 1
  measured_trials: 1
  sample_interval: 80
  validation_samples: 512
  position_threshold_m: 0.01
  rotation_threshold_rad: 0.1
  joint_limit_tolerance_rad: 0.00001

tracks:
  - id: spatial-coordinated-placement
    scenario: atomic_skill
    enabled: true
    domains:
      - id: nominal
        version: v1
        kind: nominal
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: fixed_scene
        perturbations:
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.0, 0.0, 0.0]
      - id: object_xy
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.03, 0.03, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.0, 0.0, 0.0]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            object_translation_jitter_m: [0.03, 0.03, 0.0]
            object_yaw_jitter_rad: 0.0
            target_translation_jitter_m: [0.0, 0.0, 0.0]
            seed_stride: 1
      - id: object_yaw
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.523599
          target_translation_jitter_m: [0.0, 0.0, 0.0]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            pose_batch_size: 8
            object_translation_jitter_m: [0.0, 0.0, 0.0]
            object_yaw_jitter_rad: 0.523599
            target_translation_jitter_m: [0.0, 0.0, 0.0]
            seed_stride: 1
      - id: target_relative_pose
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.02, 0.02, 0.0]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            object_translation_jitter_m: [0.0, 0.0, 0.0]
            object_yaw_jitter_rad: 0.0
            target_translation_jitter_m: [0.02, 0.02, 0.0]
            seed_stride: 1
      - id: target_yaw
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          object_translation_jitter_m: [0.0, 0.0, 0.0]
          object_yaw_jitter_rad: 0.0
          target_translation_jitter_m: [0.0, 0.0, 0.0]
          target_yaw_jitter_rad: 0.523599
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            pose_batch_size: 8
            target_yaw_jitter_rad: 0.523599
            seed_stride: 1
      - id: target_z
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          target_translation_jitter_m: [0.0, 0.0, 0.02]
          target_yaw_jitter_rad: 0.0
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            target_translation_jitter_m: [0.0, 0.0, 0.02]
            seed_stride: 1
      - id: support_object_xy
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          support_object_translation_jitter_m: [0.03, 0.03, 0.0]
          support_object_yaw_jitter_rad: 0.0
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            support_object_translation_jitter_m: [0.03, 0.03, 0.0]
            seed_stride: 1
      - id: support_object_yaw
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          support_object_translation_jitter_m: [0.0, 0.0, 0.0]
          support_object_yaw_jitter_rad: 0.523599
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            pose_batch_size: 8
            support_object_yaw_jitter_rad: 0.523599
            seed_stride: 1
      - id: task_frame_xy
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
          task_frame_yaw_jitter_rad: 0.0
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            pose_batch_size: 8
            task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
            seed_stride: 1
      - id: task_frame_yaw
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_uniform_pose_batch
        perturbations:
          distribution: uniform
          task_frame_translation_jitter_m: [0.0, 0.0, 0.0]
          task_frame_yaw_jitter_rad: 0.174533
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            pose_batch_size: 8
            task_frame_yaw_jitter_rad: 0.174533
            seed_stride: 1
      - id: task_frame_planar
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_stratified_pose_batch
        perturbations:
          distribution: stratified
          task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
          task_frame_yaw_jitter_rad: 0.174533
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            sampling_pattern: stratified
            pose_batch_size: 8
            task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
            task_frame_yaw_jitter_rad: 0.174533
            seed_stride: 1
      - id: object_support_target_task_frame_pose
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_stratified_pose_batch
        perturbations:
          distribution: stratified
          object_translation_jitter_m: [0.03, 0.03, 0.0]
          object_yaw_jitter_rad: 0.523599
          target_translation_jitter_m: [0.02, 0.02, 0.02]
          target_yaw_jitter_rad: 0.523599
          support_object_translation_jitter_m: [0.03, 0.03, 0.0]
          support_object_yaw_jitter_rad: 0.523599
          task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
          task_frame_yaw_jitter_rad: 0.174533
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: planar_pose
            sampling_pattern: stratified
            pose_batch_size: 8
            object_translation_jitter_m: [0.03, 0.03, 0.0]
            object_yaw_jitter_rad: 0.523599
            target_translation_jitter_m: [0.02, 0.02, 0.02]
            target_yaw_jitter_rad: 0.523599
            support_object_translation_jitter_m: [0.03, 0.03, 0.0]
            support_object_yaw_jitter_rad: 0.523599
            task_frame_translation_jitter_m: [0.03, 0.03, 0.0]
            task_frame_yaw_jitter_rad: 0.174533
            seed_stride: 1
      - id: support_relative_shell
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: deterministic_workspace_shell_batch
        perturbations:
          distribution: workspace_shell
          support_object_translation_jitter_m: [0.04, 0.04, 0.0]
          workspace_buckets: [near, mid, far]
          samples_per_seed: 8
        overrides:
          batch_sizes: [8]
          randomization:
            enabled: true
            mode: translation
            sampling_pattern: workspace_shell
            pose_batch_size: 8
            support_object_translation_jitter_m: [0.04, 0.04, 0.0]
            seed_stride: 1
      - id: bilateral_role_mirror
        version: v1
        kind: robustness
        applicability: [coordinated_placement]
        scene_layout: dual_ur5_pgi_bread_pan_table_v1
        case_generator: mirrored_control_assignment
        perturbations:
          mirror_axis: y
          placing_arm: right
          support_arm: left
        overrides:
          batch_sizes: [1]
          control_parts:
            placing: {motion: right_arm, grasp: right_eef}
            support: {motion: left_arm, grasp: left_eef}
    config:
      batch_sizes: [1]
      seeds: [11, 23, 47]
      physics:
        clock: compiled
        steps_per_waypoint: 16
        hold_steps: 80
        hold_sim_steps: 2
        joint_tracking_tolerance_rad: 0.05
      grippers:
        - control_part: left_eef
          open_qpos: [0.0]
          grasp_qpos: [0.030]
        - control_part: right_eef
          open_qpos: [0.0]
          grasp_qpos: [0.040]
      fixtures:
        - id: table
          kind: mesh
          asset_path: CoordinatedPlacementAndPickment/table.glb
          body_type: kinematic
          position: [0.000146, 0.000233, 0.268229]
          rotation_deg: [90.755789, 89.343732, 179.244269]
          mass: 10.0
          dynamic_friction: 0.9
          static_friction: 0.95
          restitution: 0.01
      objects:
        - id: bread
          kind: mesh
          asset_path: CoordinatedPlacementAndPickment/bread.glb
          scale: [1.75, 1.75, 1.75]
          position: [0.007266, 0.172187, 0.675881]
          rotation_deg: [88.282569, -85.590228, -1.661869]
          max_convex_hull_num: 8
          mass: 0.01
          restitution: 0.01
          contact_offset: 0.003
          rest_offset: 0.001
          settle_steps: 100
        - id: pan
          kind: mesh
          asset_path: CoordinatedPlacementAndPickment/pan.glb
          scale: [1.75, 1.75, 1.75]
          position: [0.000968, -0.141895, 0.651]
          rotation_deg: [90.589028, -8.186552, -179.231704]
          max_convex_hull_num: 16
          mass: 0.01
          dynamic_friction: 0.97
          static_friction: 0.99
          restitution: 0.01
          linear_damping: 1.0
          angular_damping: 2.0
          contact_offset: 0.001
          rest_offset: 0.0
          settle_steps: 100
      skills:
        - id: coordinated_placement
          sample_count: 120
          placing_height_offset_m: 0.1
          support_height_offset_m: 0.0
          lift_height_m: 0.05
          hand_interp_steps: 10
          hold_steps: 6
          retreat_steps: 18
          pick_pre_grasp_distance_m: 0.12
          placing_pick_sample_count: 100
          placing_pick_lift_height_m: 0.12
          placing_pick_hand_interp_steps: 10
          support_pick_sample_count: 130
          support_pick_lift_height_m: 0.10
          support_pick_hand_interp_steps: 32
          placing_grasp_z_clearance_m: 0.018
          support_grasp_z_clearance_m: 0.0
          pre_action_settle_steps: 100
          cases:
            - name: spatial_bread_onto_pan
              object: bread
              support_object: pan
              task_difficulty: hard
