# Requires a separately trained/qualified model at the checkpoint path below.
# Run from repository root: embodichain train-rl --config <this file>
trainer:
  exp_name: ant_nerd_apg
  learning_env:
    name: AntDynamics-v1
    cfg:
      checkpoint: outputs/dynamics/ant/full/export
      max_episode_steps: 1000
      random_reset: true
  seed: 42
  device: cuda:0
  num_envs: 64
  iterations: 500
  segment_length: 16
  update_horizon: 16
  enable_eval: true
  eval_freq: 32000
  num_eval_envs: 16
  num_eval_episodes: 32
  eval_seed: 10042
  best_eval_metric: eval/avg_reward
  best_eval_mode: max
  save_frequency_updates: 50
  use_wandb: false
policy:
  name: actor_only
  initial_log_std: -2.0
  actor:
    type: mlp
    network_cfg:
      hidden_sizes: [64, 64]
      activation: tanh
      last_activation: tanh
      orthogonal_init: [1.414, 1.414, 0.01]
algorithm:
  name: apg
  cfg:
    optimizer:
      name: adam
      learning_rate: 0.00025
    gamma: 0.99
    max_grad_norm: 0.5
    ent_coef: 0.0
