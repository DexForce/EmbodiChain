# Dynamics workflow configuration; not a runnable Gym deployment.
robot: cartpole
output_dir: ../../../../../../outputs/dynamics/cartpole/smoke/data
device: cpu
num_envs: 4
trajectories: 64
horizon: 32
seed: 0
teacher_solver:
  solver_type: mujoco_warp
  use_mujoco_cpu: true
  separate_worlds: true
num_substeps: 10
trajectories_per_shard: 16
resume: false
motion_mode: random_effort
initial_states: default
effort_scale: 1.0
split_seed: 0
