# Dynamics workflow configuration; not a runnable Gym deployment.
dataset: ../../../../../../outputs/dynamics/cartpole/smoke/data
output_dir: ../../../../../../outputs/dynamics/cartpole/smoke/train
model:
  input_dims:
    states_embedding: 4
    joint_f: 2
  output_dim: 4
  n_embd: 24
  n_layer: 1
  n_head: 3
  block_size: 32
  history_length: 10
  head_hidden_dims:
  - 16
  bias: false
  dropout: 0.0
  normalize_input: true
  normalize_output: true
train:
  total_steps: 100
  batch_size: 16
  learning_rate: 0.001
  final_learning_rate: 0.0001
  max_grad_norm: 1.0
  seed: 0
  device: cpu
  validation_interval: 25
  validation_batches: null
  checkpoint_interval: 25
  lr_update_interval: 1
  lr_offset: 0
