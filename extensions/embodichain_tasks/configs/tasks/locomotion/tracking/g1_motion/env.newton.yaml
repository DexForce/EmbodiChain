id: UnitreeG1MotionRL-v1
physics: newton
num_envs: 8
max_episode_steps: 500
headless: true
device: cuda:0
arena_space: 0.0
scene_node_capacity: 131071
renderer: no-render
physics_config:
  physics_dt: 0.02
  num_substeps: 4
  sync_to_renderer: false
  solver_cfg:
    solver_type: mujoco_warp
    rne_mode: last_substep
    njmax: 500
    nconmax: 128
    integrator: implicitfast
    cone: pyramidal
    separate_worlds: true
    use_mujoco_contacts: true
    update_data_interval: 0
  use_cuda_graph: true
env:
  sim_steps_per_control: 1
  extensions:
    motion_tracking:
      motion_path: LAFAN1G1/motion.npz
      quaternion_order: xyzw
      observation_noise: true
      random_start: true
robot:
  uid: robot
  fpath: LAFAN1G1/robot/g1_29dof_rev_1_0.urdf
  build_pk_chain: false
  init_pos:
  - 0.0
  - 0.0
  - 0.8
sensor: []
light: {}
background:
- uid: floor
  shape:
    shape_type: Plane
  body_type: static
  attrs:
    material_props:
      dynamic_friction: 1.0
rigid_object: []
rigid_object_group: []
articulation: []
