trainer:
  learning_env:
    name: MotionTrackingModelRL
    cfg:
      horizon: 32
  num_envs: 512
  rollout_mode: complete
  deterministic_actions: true
policy:
  name: motion_tracking
  cfg:
    latent_dim: 128
    encoder_hidden:
    - 2048
    - 1024
    - 512
    - 256
    decoder_hidden:
    - 2048
    - 1024
    - 512
    - 256
    critic_hidden:
    - 256
    - 128
    amp_bfloat16: true
algorithm:
  name: apg_actor_critic
  cfg:
    gamma: 0.99
    gae_lambda: 0.95
    max_grad_norm: 1.0
    optimizer:
      learning_rate: 0.0002
      kwargs:
        betas:
        - 0.9
        - 0.95
        fused: true
    critic_optimizer:
      learning_rate: 0.0002
      kwargs:
        fused: true
    critic_epochs: 5
    critic_minibatches: 4
    actor_grad_value_clip: 0.1
    update_critic_normalization: true
workflow:
  kind: convergence
  seed: 0
  clips:
  - walk1_subject1
  - dance1_subject1
  - jumps1_subject1
  - fallAndGetUp1_subject1
  num_envs: 512
  buffer_steps: 1000
  prefill_steps: 64
  warmup_updates: 500
  iterations: 2000
  utd: 0.4
  wm_batches: 10
  wm_batch: 512
  wm_horizon: 8
  wm_hidden:
  - 2048
  - 2048
  - 2048
  lr: 0.0002
  lr_final_frac: 0.03
  lr_decay_iters: 250000
  amp: true
  tf32: false
  norm_update_every: 5
  action_noise: 0.1
  collect_det_frac: 0.25
  eval_every: 500
  save_every: 500
  log_every: 100
  task_options:
    adaptive_sampling: true
    reset_noise: true
    domain_randomization: true
  collection_env: extensions/embodichain_tasks/configs/tasks/locomotion/tracking/g1_motion/env.newton.yaml
  evaluation_env: extensions/embodichain_tasks/configs/tasks/locomotion/tracking/g1_motion/env.newton.yaml
