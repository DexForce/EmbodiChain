physics: default
scene_node_capacity: 131071
id: UnitreeGo2FlatRL-v1
max_episode_steps: 1000
num_envs: 8
headless: true
device: cuda:0
arena_space: 2.0
physics_config:
  cache_material: true
  gravity:
  - 0.0
  - 0.0
  - -9.81
  physics_dt: 0.005
env:
  sim_steps_per_control: 4
  control_parts:
  - locomotion
  events:
    push_robot:
      func: push_articulation_by_setting_velocity
      mode: interval
      interval_step: 1
      is_global: false
      params:
        entity_cfg:
          uid: robot
        interval_range_s:
        - 5.0
        - 6.0
        velocity_range:
          x:
          - -0.5
          - 0.5
          y:
          - -0.5
          - 0.5
          z:
          - -0.4
          - 0.4
          roll:
          - -0.52
          - 0.52
          pitch:
          - -0.52
          - 0.52
          yaw:
          - -0.78
          - 0.78
  observations:
    policy:
      func: velocity_locomotion_observation
      mode: add
      name: policy
      params:
        privileged: false
        enable_corruption: true
    critic:
      func: velocity_locomotion_observation
      mode: add
      name: critic
      params:
        privileged: true
        enable_corruption: false
  rewards:
    total:
      func: velocity_locomotion_total_reward
      mode: add
      weight: 1.0
      params: {}
  actions:
    joint_position:
      contract: joint_position.default_offset@1
      params: {}
  extensions: {}
robot:
  class_type: UnitreeGo2
  uid: robot
sensor:
- uid: locomotion_contacts
  sensor_type: ContactSensor
  articulation_cfg_list:
  - articulation_uid: robot
    link_name_list: []
  filter_need_both_actor: false
  max_contacts_per_env: 96
light: {}
background: []
rigid_object: []
rigid_object_group: []
articulation: []
