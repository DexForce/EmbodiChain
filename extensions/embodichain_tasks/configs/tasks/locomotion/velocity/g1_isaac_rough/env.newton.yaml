physics: newton
id: UnitreeG1IsaacRoughRL-v1
max_episode_steps: 1000
num_envs: 1
scene_node_capacity: 65535
headless: true
device: cuda:0
arena_space: 0.0
render_cfg:
  renderer: no-render
physics_config:
  mesh_bvh_constructor: cubql
  sync_to_renderer: false
  gravity:
  - 0.0
  - 0.0
  - -9.81
  num_substeps: 2
  collision_cfg:
    broad_phase: explicit
    reduce_contacts: true
    max_triangle_pairs: 2500000
    update_interval: null
  solver_cfg:
    solver_type: mujoco_warp
    njmax: 300
    nconmax: 300
    iterations: 100
    ls_iterations: 50
    integrator: implicitfast
    separate_worlds: true
    tolerance: 1.0e-06
    solver: newton
    use_mujoco_contacts: false
    cone: pyramidal
    impratio: 1.0
    ccd_iterations: 35
  physics_dt: 0.005
env:
  episode_context_in_info: false
  sim_steps_per_control: 4
  control_parts:
  - locomotion
  events: {}
  observations:
    policy:
      func: velocity_locomotion_observation
      mode: add
      name: policy
      params:
        privileged: false
        enable_corruption: false
    critic:
      func: velocity_locomotion_observation
      mode: add
      name: critic
      params:
        privileged: true
        enable_corruption: false
  rewards:
    total:
      func: velocity_locomotion_total_reward
      mode: add
      weight: 1.0
      params: {}
  actions:
    joint_position:
      contract: joint_position.default_offset@1
      params: {}
  extensions:
    reference_deterministic_reset: false
    reference_randomization: true
    reference_origin:
    - 0.0
    - 0.0
    - 0.0
    reference_terrain: G1RoughTerrains/training/terrain.npz
robot:
  uid: robot
  fpath: UnitreeG1Rough/g1.usda
  build_pk_chain: false
  init_pos:
