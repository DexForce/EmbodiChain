id: ANYmalCFlatRL-v1
max_episode_steps: 1000
num_envs: 8
headless: true
device: cuda:0
arena_space: 4.0
physics_config:
  gravity:
  - 0.0
  - 0.0
  - -9.81
  physics_dt: 0.005
env:
  sim_steps_per_control: 4
  control_parts:
  - locomotion
  events: {}
  observations:
    policy:
      func: velocity_locomotion_observation
      mode: add
      name: policy
      params:
        privileged: false
        enable_corruption: false
    critic:
      func: velocity_locomotion_observation
      mode: add
      name: critic
      params:
        privileged: true
        enable_corruption: false
  rewards:
    total:
      func: velocity_locomotion_total_reward
      mode: add
      weight: 1.0
      params: {}
  actions:
    joint_position:
      contract: joint_position.default_offset@1
      params: {}
  extensions: {}
robot:
  class_type: ANYmalC
  uid: robot
sensor:
- uid: locomotion_contacts
  sensor_type: ContactSensor
  articulation_cfg_list:
  - articulation_uid: robot
    link_name_list:
    - LF_FOOT
    - LH_FOOT
    - RF_FOOT
    - RH_FOOT
    - base
    - LF_THIGH
    - LH_THIGH
    - RF_THIGH
    - RH_THIGH
  filter_need_both_actor: false
  max_contacts_per_env: 96
light: {}
background: []
rigid_object: []
rigid_object_group: []
articulation: []
physics: default
scene_node_capacity: 131071
