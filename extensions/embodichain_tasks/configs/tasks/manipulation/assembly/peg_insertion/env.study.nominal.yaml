# Closed fixture and friction settings follow the public author model.
environment_id: peg_insertion_study.nominal
physics: newton
max_episode_steps: 250
num_envs: 1
arena_space: 2.0
physics_config:
  physics_dt: 0.001
  num_substeps: 1
  sync_to_renderer: false
  solver_cfg:
    solver_type: mujoco_warp
    njmax: 4096
    nconmax: 4096
    iterations: 100
    ls_iterations: 50
    integrator: implicitfast
    separate_worlds: true
    tolerance: 1.0e-08
    cone: elliptic
    impratio: 10.0
render_cfg:
  renderer: no-render
simulation: {}
env:
  control_parts:
  - arm
  sim_steps_per_control: 20
  enable_sensor: true
  init_rollout_buffer: false
  actions:
    arm_delta:
      func: RelativeJointPositionAction
      params:
        part_name: arm
        scale: 0.02
        target_limits: &id001
        - - -2.8222039999999997
          - 2.8222039999999997
        - - -2.3090759999999997
          - 2.3090759999999997
        - - -2.993214
          - 2.993214
        - - -1.9075010000000001
          - 2.7278010000000004
        - - -2.993214
          - 2.993214
        - - -1.4224140000000003
          - 4.564014
        - - -2.993214
          - 2.993214
  observations:
    proprioception:
      func: AssemblyProprioception
      mode: add
      name: proprioception
      params:
        history_length: 30
        history_layout: current_history
      extra:
        shape:
        - 1023
    privileged:
      func: assembly_privileged_state
      mode: add
      name: privileged
      params: {}
    contact_labels:
      func: assembly_contact_labels
      mode: add
      name: contact_labels
      params: {}
      extra:
        shape:
        - 64
  events:
    reset_assembly:
      func: reset_assembly
      mode: reset
      params: {}
  rewards:
    assembly_milestones:
      func: assembly_milestone_reward
      mode: add
      weight: 1.0
      params: {}
  extensions:
    assembly_profile: study
    preserve_source_contacts: true
    require_heterogeneous_assets: false
    grasp_warmup_steps: 10
    initial_position_range: 0.0125
    grasp_position_range: 0.0055
    joint_stiffness: 80.0
    joint_damping: 20.0
    proprioception_convention: official_v1
    proprioceptive_joint_limits: *id001
    proprioceptive_velocity_scale:
    - 2.0943951023931953
    - 2.0943951023931953
    - 2.443460952792061
    - 2.443460952792061
    - 4.886921905584122
    - 4.886921905584122
    - 4.886921905584122
    assembly_config:
      bottom_thickness: 0.002
