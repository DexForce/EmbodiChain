environment_id: nut_threading_study
physics: newton
max_episode_steps: 750
num_envs: 1
arena_space: 2.0
physics_config:
  physics_dt: 0.001
  num_substeps: 1
  sync_to_renderer: false
  solver_cfg:
    solver_type: mujoco_warp
    njmax: 4096
    nconmax: 4096
    iterations: 100
    ls_iterations: 50
    integrator: implicitfast
    separate_worlds: true
    tolerance: 1.0e-08
render_cfg:
  renderer: no-render
simulation: {}
env:
  control_parts:
  - arm
  sim_steps_per_control: 20
  enable_sensor: true
  init_rollout_buffer: false
  actions:
    arm_delta:
      func: RelativeJointPositionAction
      params:
        part_name: arm
        scale:
        - 0.04
        - 0.04
        - 0.04
        - 0.04
        - 0.04
        - 0.04
        - 0.2
  observations:
    proprioception:
      func: AssemblyProprioception
      mode: add
      name: proprioception
      params:
        history_length: 30
      extra:
        shape:
        - 1116
    privileged:
      func: assembly_privileged_state
      mode: add
      name: privileged
      params: {}
    contact_labels:
      func: assembly_contact_labels
      mode: add
      name: contact_labels
      params: {}
      extra:
        shape:
        - 64
  events:
    reset_assembly:
      func: reset_assembly
      mode: reset
      params: {}
  rewards:
    assembly_milestones:
      func: assembly_milestone_reward
      mode: add
      weight: 1.0
      params: {}
  extensions:
    assembly_profile: study
    preserve_source_contacts: true
    require_heterogeneous_assets: true
    grasp_warmup_steps: 10
    initial_position_range: 0.015
    grasp_position_range: 0.001
    joint_stiffness: 40.0
    joint_damping: 20.0
