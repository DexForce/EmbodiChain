environment_id: franka_gs_robosimgs
physics: default
num_envs: 1
max_episode_steps: 2400
physics_config:
  physics_dt: 0.01
  enable_ccd: true
render_cfg:
  preset: gaussian
  renderer: hybrid
  spp: 8
  gaussian:
    apply_display_srgb: false
  denoising:
    window: 'off'
    offscreen: optix
simulation:
  visual_object:
  - uid: scan_background
    visuals:
    - id: scan
      representation:
        type: gaussian_splat
        file_path: RoboSimGSTabletopGS/source/original.ply
  background:
  - uid: support_surface
    body_type: static
    init_pos:
    - 0.45
    - 0.0
    - -0.03
    render_enabled: false
    shape:
      shape_type: Cube
      size:
      - 1.3
      - 0.85
      - 0.06
      visual_material:
        base_color:
        - 0.38
        - 0.32
        - 0.23
        - 1
        roughness: 0.65
    attrs:
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
  rigid_object:
  - uid: cube
    body_type: dynamic
    init_pos:
    - 0.4
    - 0.0
    - 0.027
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
      visual_material:
        base_color:
        - 0.95
        - 0.12
        - 0.015
        - 1
        roughness: 0.7
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
  light:
    direct:
    - uid: task_fill
      light_type: point
      init_pos:
      - 0.5
      - -1.0
      - 2.3
      intensity: 12
env:
  sim_steps_per_control: 4
  events:
    settle_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: cube
        min_steps: 10
        max_steps: 120
        timeout_behavior: raise
enable_ground_plane: false
