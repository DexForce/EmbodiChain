environment_id: franka_gs_office
physics: default
num_envs: 1
max_episode_steps: 2400
physics_config:
  physics_dt: 0.01
  enable_ccd: true
render_cfg:
  preset: gaussian
  renderer: hybrid
  spp: 8
  gaussian:
    apply_display_srgb: false
  denoising:
    window: 'off'
    offscreen: optix
simulation:
  visual_object:
  - uid: scan_background
    # The packaged USD applies this source Y-up to scene Z-up conversion once.
    init_rot: [90, 0, 0]
    visuals:
    - id: scan
      representation:
        type: gaussian_splat
        file_path: RoboSplatterOfficeGS/source/original.ply
  background:
  - uid: support_surface
    body_type: static
    init_pos:
    - 0.30000000000000004
    - -0.1
    - 0.73
    render_enabled: true
    shape:
      shape_type: Cube
      size:
      - 1.3
      - 0.85
      - 0.06
      visual_material:
        base_color:
        - 0.38
        - 0.32
        - 0.23
        - 1
        roughness: 0.65
    attrs:
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
  - uid: table_leg_0
    body_type: static
    init_pos:
    - -0.26
    - -0.45999999999999996
    - 0.35
    shape:
      shape_type: Cube
      size:
      - 0.045
      - 0.045
      - 0.7
      visual_material:
        base_color:
        - 0.08
        - 0.09
        - 0.1
        - 1
        roughness: 0.6
  - uid: table_leg_1
    body_type: static
    init_pos:
    - -0.26
    - 0.26
    - 0.35
    shape:
      shape_type: Cube
      size:
      - 0.045
      - 0.045
      - 0.7
      visual_material:
        base_color:
        - 0.08
        - 0.09
        - 0.1
        - 1
        roughness: 0.6
  - uid: table_leg_2
    body_type: static
    init_pos:
    - 0.86
    - -0.45999999999999996
    - 0.35
    shape:
      shape_type: Cube
      size:
      - 0.045
      - 0.045
      - 0.7
      visual_material:
        base_color:
        - 0.08
        - 0.09
        - 0.1
        - 1
        roughness: 0.6
  - uid: table_leg_3
    body_type: static
    init_pos:
    - 0.86
    - 0.26
    - 0.35
    shape:
      shape_type: Cube
      size:
      - 0.045
      - 0.045
      - 0.7
      visual_material:
        base_color:
        - 0.08
        - 0.09
        - 0.1
        - 1
        roughness: 0.6
  rigid_object:
  - uid: cube
    body_type: dynamic
    init_pos:
    - 0.25
    - -0.1
    - 0.787
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
      visual_material:
        base_color:
        - 0.95
        - 0.12
        - 0.015
        - 1
        roughness: 0.7
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
  light:
    direct:
    - uid: task_fill
      light_type: point
      init_pos:
      - 0.35
      - -1.1
      - 3.0599999999999996
      intensity: 12
env:
  sim_steps_per_control: 4
  events:
    settle_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: cube
        min_steps: 10
        max_steps: 120
        timeout_behavior: raise
enable_ground_plane: false
