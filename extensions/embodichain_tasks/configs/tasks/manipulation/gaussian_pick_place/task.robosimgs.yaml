        - 0.85
        target:
        - 0.3
        - 0
        - 0.38
        up:
        - 0
        - 0
        - 1
task_program:
  program: task_program/program.robosimgs.yaml
  integration: task_program/integration.yaml
  execution_policy: ../../../components/execution_policies/franka_gs_verified.yaml
