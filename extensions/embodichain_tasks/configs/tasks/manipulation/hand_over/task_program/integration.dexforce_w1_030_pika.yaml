integration_id: hand_over_dexforce_w1_030_pika_v1
program_id: tabletop_hand_over
requires:
  scene_contract: hand_over_bar_scene
  embodiment_contract: dual_arm_parallel_gripper
scene_binding:
  contract_id: hand_over_bar_scene
  registry_id: tabletop_bar_handover
  rigid_objects:
  - entity_id: bar
    simulation_uid: handover_object
    dynamics: dynamic
    semantic_type: transfer_bar
    affordances:
    - entity_id: bar_antipodal_grasp
      kind: antipodal_grasp
  - entity_id: support_surface
    simulation_uid: support_surface
    dynamics: static
    semantic_type: support_surface
profile:
  defaults:
    hand_over:
      source: left
      destination: right
  action_options:
    hand_over:
      kind: hand_over
      pre_grasp_distance: 0.06
      lift_height: 0.08
      hand_interp_steps: 20
  effect_monitors:
    hand_over:
      monitor_id: builtin.composite_effect
      revision: '1'
      params:
        consecutive_samples: 10
  grounding_providers:
    hand_over: simulation.configured_handover_pose
runtime_services:
  handover_pose_providers:
  - kind: configured_pose
    final_position:
    - 0.62
    - -0.12
    - 1.06
    final_quaternion_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
