environment_id: hand_over_dexforce_w1_030_pika
physics: default
max_episode_steps: 3200
num_envs: 1
arena_space: 3.0
physics_config:
  enable_ccd: true
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color:
      - 0.8
      - 0.8
      - 0.8
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: support_surface
    shape:
      shape_type: Cube
      size:
      - 0.6
      - 1.0
      - 0.04
    body_type: static
    init_pos:
    - 0.7
    - 0.0
    - 0.88
    attrs:
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
  rigid_object:
  - uid: handover_object
    shape:
      shape_type: Cube
      size:
      - 0.06
      - 0.06
      - 0.24
    attrs:
      mass_props:
        mass: 0.1
      rigid_props:
        angular_damping: 1.0
        linear_damping: 0.5
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.0
      material_props:
        dynamic_friction: 0.97
        static_friction: 0.99
        restitution: 0.01
    init_pos:
    - 0.62
    - 0.0
    - 1.023
    init_rot:
    - 0.0
    - 0.0
    - 0.0
  rigid_object_group: []
  articulation: []
env:
  sim_steps_per_control: 4
  events:
    settle_can_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: handover_object
        min_steps: 10
        max_steps: 120
        timeout_behavior: raise
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
