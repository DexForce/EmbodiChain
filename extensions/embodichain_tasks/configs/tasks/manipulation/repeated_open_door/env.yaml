environment_id: repeated_open_door
physics: default
max_episode_steps: 2000
num_envs: 1
arena_space: 2.5
simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  articulation:
    - uid: microwave
      fpath: Microwave/microwave.urdf
      asset_physics_mode: overlay
      init_pos: [-1.0, 0.2, 0.4]
      init_rot: [0.0, 0.0, 90.0]
      root_props:
        fixed_base: true
      joint_drive_props:
        drive_type: none
env:
  sim_steps_per_control: 1
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: /tmp/embodichain-manipulation/repeated_open_door/datasets
        extra:
          scene_type: tabletop
          task_description: repeated_open_door
          data_type: sim
        use_videos: true
  seed: 0
