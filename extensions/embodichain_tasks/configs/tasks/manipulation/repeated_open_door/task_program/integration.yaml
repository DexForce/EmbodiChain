      kind: open_door
      hand_interp_steps: 30
      door_waypoint_count: 50
      approach_distance: 0.1
      retract_distance: 0.1
  effect_monitors: {}
runtime_services:
  registered_semantic_lowerers:
    - kind: open_door
      articulation_id: microwave
      articulation_simulation_uid: microwave
      link_entity_id: microwave_open_door_target
