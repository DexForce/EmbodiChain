integration_id: repeated_open_door_v1
program_id: repeated_open_door
requires:
  scene_contract: repeated_open_door_scene_v1
  embodiment_contract: single_arm_parallel_gripper
scene_binding:
  contract_id: repeated_open_door_scene_v1
  registry_id: repeated_open_door_scene
  articulations:
    - entity_id: microwave
      simulation_uid: microwave
      dynamics: dynamic
  links:
    - entity_id: microwave_open_door_target
      articulation_id: microwave
      native_link_name: handle_link
      dynamics: dynamic
profile:
  defaults:
    open_door:
      primary: primary_manipulator
  action_options:
