environment_id: repeated_axis_align
physics: default
max_episode_steps: 2000
num_envs: 1
arena_space: 2.5
simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.05]
      attrs:
        mass_props:
          mass: 0.05
        rigid_props:
          linear_damping: 0.2
          angular_damping: 0.2
        material_props:
          dynamic_friction: 0.97
          static_friction: 0.99
env:
  sim_steps_per_control: 1
  events:
    settle_cube:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: cube
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: /tmp/embodichain-manipulation/repeated_axis_align/datasets
        extra:
          scene_type: tabletop
          task_description: repeated_axis_align
          data_type: sim
        use_videos: true
  seed: 0
