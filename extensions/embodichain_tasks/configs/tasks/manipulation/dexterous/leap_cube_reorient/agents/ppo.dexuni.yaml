trainer:
  exp_name: leap_cube_reorient_dexuni
  learning_env:
    name: LeapCubeReorientDexSim-v1
    cfg:
      solver_kind: dexuni
      cuda_graph: true
  seed: 42
  device: cuda:0
  num_envs: 32
  iterations: 10
  buffer_size: 24
  enable_eval: false
  save_freq: 768
  use_wandb: false
policy:
  name: actor_critic
  actor_obs_normalization: true
  critic_obs_normalization: true
  initial_log_std: -0.693147
  actor:
    type: mlp
    network_cfg:
      hidden_sizes:
      - 256
      - 256
      activation: elu
  critic:
    type: mlp
    network_cfg:
      hidden_sizes:
      - 256
      - 256
      activation: elu
  obs_groups:
    actor:
    - obs
    critic:
    - critic_obs
algorithm:
  name: ppo
  cfg:
    optimizer:
      name: adam
      learning_rate: 0.0003
    n_epochs: 4
    batch_size: 256
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 1.0
