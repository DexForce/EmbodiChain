trainer:
  exp_name: leap_cube_reorient_ppo
  gym_config: extensions/embodichain_tasks/configs/tasks/manipulation/dexterous/leap_cube_reorient/env.yaml
  seed: 42
  device: cuda:0
  headless: true
  num_envs: 4096
  iterations: 920
  buffer_size: 40
  enable_eval: false
  save_frequency_updates: 100
  use_wandb: false
  wandb_project_name: embodichain-dexterous
policy:
  name: actor_critic
  actor_obs_normalization: true
  critic_obs_normalization: true
  obs_groups:
    actor:
    - policy
    critic:
    - critic
  actor:
    type: mlp
    network_cfg:
      hidden_sizes:
      - 512
      - 256
      - 128
      activation: elu
  critic:
    type: mlp
    network_cfg:
      hidden_sizes:
      - 512
      - 256
      - 128
      activation: elu
  initial_action_std: 0.5
algorithm:
  name: ppo
  cfg:
    optimizer:
      name: adam
      learning_rate: 0.0001
    schedule: adaptive
    desired_kl: 0.02
    minimum_learning_rate: 1.0e-05
    maximum_learning_rate: 0.0003
    n_epochs: 4
    num_mini_batches: 32
    batch_size: 5120
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.3
    ent_coef: 0.001
    vf_coef: 0.5
    use_clipped_value_loss: true
    max_grad_norm: 1.0
