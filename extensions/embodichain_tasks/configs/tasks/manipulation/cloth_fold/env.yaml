environment_id: cloth_fold
physics: newton
max_episode_steps: 991
num_envs: 1
render_cfg:
  renderer: no-render

physics_config:
  device: cuda:0
  physics_dt: 0.016666666666666666
  num_substeps: 10
  use_cuda_graph: false
  collision_cfg: null
  solver_cfg:
    solver_type: dexuni
    mujoco_articulation_paths: [arena_0/w1]
    joint_mode: kinematic
    contact_mode: soft
    vbd_preset: surface-fast
    collision_options:
      soft_contact_margin: 0.003
    vbd_options:
      iterations: 16
      deterministic: NOT_GUARANTEED
      friction_epsilon: 0.0001
      rigid_contact_hard: false
      rigid_contact_history: false
      rigid_body_contact_buffer_size: 4096
      particle_enable_self_contact: true
      particle_self_contact_radius: 0.002
      particle_self_contact_margin: 0.002
      particle_rest_shape_contact_exclusion_radius: 0.005
      particle_chebyshev_spectral_radius: 0.95
      particle_multilevel_fallback_iterations: 16

simulation:
  background:
    - uid: table
      body_type: static
      shape: {shape_type: Cube, size: [0.6, 1.64, 0.05]}
      init_pos: [0.46, 0.0, 0.835]
      attrs: &table_attrs
        collision_props: {margin: 0.001, gap: 0.002}
        material_props: {ke: 20000.0, kd: 100.0, dynamic_friction: 0.8}
    - uid: leg_0_0
      body_type: static
      shape: &leg_shape {shape_type: Cube, size: [0.05, 0.05, 0.81]}
      init_pos: [0.21, -0.74, 0.405]
      attrs: *table_attrs
    - uid: leg_0_1
      body_type: static
      shape: *leg_shape
      init_pos: [0.21, 0.74, 0.405]
      attrs: *table_attrs
    - uid: leg_1_0
      body_type: static
      shape: *leg_shape
      init_pos: [0.71, -0.74, 0.405]
      attrs: *table_attrs
    - uid: leg_1_1
      body_type: static
      shape: *leg_shape
      init_pos: [0.71, 0.74, 0.405]
      attrs: *table_attrs

  replay:
    kind: native_joint_positions
    id: cloth_joint_commands
    trajectory: ./task_program/trajectory.npz
    sha256: 51f01325407ecc256c374d4d8c82a43222b90b10e69e7984daa620f1a346ab24
    fps: 60

  replay_surface:
    mesh: cloth_mesh.npz
    mesh_sha256: a99816d80199900c2180b97be83835acf7f7c148d89007469d37e731d92f7b79
    robot_sha256: 5a800a7811c2d6d8012e7f0a09c55509e84b7b48bf3658bc7b73ac2d66c1e558
    visual_material:
      base_color: [0.25, 0.65, 0.9, 1.0]
      roughness: 0.7
    object:
      uid: cloth
      particle_radius: 0.003
      attrs:
        density: 0.002
        contact_material:
          stiffness: 10000.0
          damping: 0.01
          dynamic_friction: 0.3
        surface_props:
          tri_ke: 1000.0
          tri_ka: 1000.0
          tri_kd: 0.00001
          tri_drag: 0.0
          tri_lift: 0.0
          edge_ke: 0.1
          edge_kd: 0.05

env:
  sim_steps_per_control: 1
