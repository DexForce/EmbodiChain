environment_id: blocks_ranking_rgb_dexforce_w1_030_pika
physics: default
max_episode_steps: 2400
simulation:
  light:
    direct:
    - uid: light_1
      light_type: sun
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      direction:
      - 0.0
      - 0.0
      - -1.0
  background:
  - uid: table
    shape:
      shape_type: Mesh
      fpath: CircleTableSimple/circle_table_simple.ply
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.875
    - 0.0
    - 0.85
    init_rot:
    - 0
    - 90
    - 0
  rigid_object:
  - uid: block_1
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        static_friction: 0.5
        dynamic_friction: 0.5
        restitution: 0.0
    init_pos:
    - 0.725
    - -0.015
    - 0.928
    body_scale:
    - 1
    - 1
    - 1
  - uid: block_2
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        static_friction: 0.5
        dynamic_friction: 0.5
        restitution: 0.0
    init_pos:
    - 0.725
    - -0.015
    - 0.928
    body_scale:
    - 1
    - 1
    - 1
  - uid: block_3
    shape:
      shape_type: Cube
      size:
      - 0.05
      - 0.05
      - 0.05
    attrs:
      mass_props:
        mass: 0.05
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        static_friction: 0.5
        dynamic_friction: 0.5
        restitution: 0.0
    init_pos:
    - 0.725
    - -0.015
    - 0.928
    body_scale:
    - 1
    - 1
    - 1
env:
  task_instruction: Arrange the red, green, and blue blocks from left to right while
    keeping the green block stationary.
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        extra:
          scene_type: tabletop
          task_description: blocks_ranking_rgb
          data_type: sim
        use_videos: true
        robot_meta:
          robot_type: DexforceW1V030Pika
        depth_video:
          enable: true
          vcodec: libx265
          lossless: true
          depth_min: 0.005
          depth_max: 3.0
          use_log: false
          input_unit: m
          output_unit: m
          keep_numeric_fallback: false
  events:
    random_light:
      func: randomize_light
      mode: interval
      interval_step: 10
      params:
        entity_cfg:
          uid: light_1
        color_range:
        - - 0.6
          - 0.6
          - 0.6
        - - 1
          - 1
          - 1
        intensity_range:
        - 2.0
        - 8.0
    init_block_1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_1
        position_range:
        - - 0.6
          - -0.18
          - 0.928
        - - 0.65
          - -0.12
          - 0.928
        rotation_range:
        - - 0
          - 0
          - 0
        - - 0
          - 0
          - 0
        relative_position: false
    init_block_2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_2
        position_range:
        - - 0.65
          - -0.03
          - 0.928
        - - 0.7
          - 0.03
          - 0.928
        rotation_range:
        - - 0
          - 0
          - 0
        - - 0
          - 0
          - 0
        relative_position: false
    init_block_3_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: block_3
        position_range:
        - - 0.7
          - 0.12
          - 0.928
        - - 0.75
          - 0.18
          - 0.928
        rotation_range:
        - - 0
          - 0
          - 0
        - - 0
          - 0
          - 0
        relative_position: false
    set_block_1_color:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: block_1
        mat_cfg:
          uid: red_block_mat
          base_color:
          - 1.0
          - 0.0
          - 0.0
          - 1.0
          metallic: 0.0
          roughness: 0.5
    set_block_2_color:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: block_2
        mat_cfg:
          uid: green_block_mat
          base_color:
          - 0.0
          - 1.0
          - 0.0
          - 1.0
          metallic: 0.0
          roughness: 0.5
    set_block_3_color:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: block_3
        mat_cfg:
          uid: blue_block_mat
          base_color:
          - 0.0
          - 0.0
          - 1.0
          - 1.0
          metallic: 0.0
          roughness: 0.5
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        control_parts:
        - left_eef
        - right_eef
    block_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_1_pose
      params:
        entity_cfg:
          uid: block_1
    block_2_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_2_pose
      params:
        entity_cfg:
          uid: block_2
    block_3_pose:
      func: get_rigid_object_pose
      mode: add
      name: block_3_pose
      params:
        entity_cfg:
          uid: block_3
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
num_envs: 1
