program_id: pick_pour_return_cup
targets:
  cup_return_pose:
    kind: cyclic_pose
    values:
      - position: [-0.75, 0.0, 0.552]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

program:
  kind: segment
  name: pick_pour_return_cup
  steps:
    kind: sequence
    items:
      - kind: invoke
        call:
          kind: pick
          object: cup
          grasp: cup_grasp
      - kind: invoke
        call:
          kind: registered
          call_id: simulation.pour
          arguments:
            object: cup
      - kind: invoke
        call:
          kind: place
          object: cup
          at:
            kind: target_ref
            target: cup_return_pose
  post:
    - kind: wait_stable
      entity: cup
  validators:
    - kind: object_near_target
      object: cup
      target: cup_return_pose
      position_tolerance: 0.03
