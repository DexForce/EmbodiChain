environment_id: pour_water_dexforce_w1_030_pika
physics: default
max_episode_steps: 6000
num_envs: 1
arena_space: 3.0
render_cfg:
  renderer: hybrid
  tone_mapping_enabled: true
  tone_mapping_exposure: 1.0
simulation:
  light:
    direct:
    - uid: light_1
      light_type: rect
      color:
      - 1.0
      - 0.95
      - 0.88
      intensity: 5.0
      init_pos:
      - 0.35
      - -0.5
      - 2.1
      direction:
      - 0.35
      - 0.4
      - -1.0
      rect_width: 1.0
      rect_height: 0.8
    - uid: fill_light
      light_type: rect
      color:
      - 0.88
      - 0.94
      - 1.0
      intensity: 1.5
      init_pos:
      - 1.25
      - 0.6
      - 1.7
      direction:
      - -0.5
      - -0.5
      - -1.0
      rect_width: 0.8
      rect_height: 0.8
  background:
  - uid: table
    shape:
      shape_type: Mesh
      fpath: PourWaterAssets/table.glb
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    # The mesh top is +0.05 m locally: world tabletop height is 0.90 m.
    body_type: kinematic
    init_pos:
    - 0.875
    - 0.0
    - 0.85
  rigid_object:
  - uid: cup
    shape:
      shape_type: Mesh
      fpath: PourWaterAssets/cup.glb
      collision:
        approximation: convex_decomposition
        max_hulls: 16
    attrs:
      mass_props:
        mass: 0.03
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        static_friction: 0.9
        dynamic_friction: 0.8
        restitution: 0.01
    init_pos:
    - 0.75
    - 0.1
    - 0.946
    body_scale:
    - 1
    - 1
    - 1
  - uid: bottle
    shape:
      shape_type: Mesh
      fpath: PourWaterAssets/bottle.glb
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    attrs:
      mass_props:
        mass: 0.01
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      material_props:
        restitution: 0.01
    init_pos:
    - 0.75
    - -0.1
    - 0.987
    body_scale:
    - 1
    - 1
    - 1
  rigid_object_group: []
  articulation: []
env:
  target_control_frequency: 100
  events:
    settle_pour_objects_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: bottle
        - uid: cup
        min_steps: 10
        max_steps: 180
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        robot_meta:
          robot_type: DexforceW1V030Pika
        extra:
          scene_type: Commercial
          task_description: Pour water
          data_type: sim
        use_videos: true
        depth_video:
          enable: true
          vcodec: libx265
          lossless: true
          depth_min: 0.005
          depth_max: 3.0
          use_log: false
          input_unit: m
          output_unit: m
          keep_numeric_fallback: false
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
