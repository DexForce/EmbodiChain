program_id: pour_water_with_right_arm
instruction: Pour water from the bottle into the cup and return the bottle to the table.
targets:
  bottle_return_pose:
    kind: pose
    position:
    - 0.75
    - -0.1
    - 0.837
    quaternion_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
  bottle_release_pose:
    kind: pose
    position:
    - 0.75
    - -0.1
    - 0.844
    quaternion_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
  bottle_pour_pose:
    kind: pose
    position:
    - 0.7776451358490485
    - 0.04643509710227371
    - 0.976
    quaternion_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
  cup_rest_pose:
    kind: pose
    position:
    - 0.75
    - 0.1
    - 0.796
    quaternion_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
program:
- segment: pick_bottle
  instruction: Grasp and lift the bottle.
  steps:
    pick:
      object: bottle
      grasp: bottle_grasp
- segment: move_bottle_above_cup
  instruction: Move the held bottle above the cup.
  steps:
    registered:
      call_id: simulation.move_held_object
      arguments:
        target: cup_pour_pose
  validators:
  - kind: object_near_target
    object: bottle
    target: bottle_pour_pose
    position_tolerance: 0.01
- segment: pour_water
  instruction: Tilt the bottle to pour water into the cup and return it upright.
  steps:
    registered:
      call_id: simulation.pour
      arguments:
        object: bottle
- segment: return_bottle
  instruction: Place the bottle back on the table and release it.
  steps:
    place:
      object: bottle
      at: bottle_release_pose
  post:
  - kind: wait_stable
    entity: bottle
  - kind: wait_stable
    entity: cup
  validators:
  - kind: object_near_target
    object: bottle
    target: bottle_return_pose
    position_tolerance: 0.05
  - kind: object_near_target
    object: cup
    target: cup_rest_pose
    position_tolerance: 0.002
