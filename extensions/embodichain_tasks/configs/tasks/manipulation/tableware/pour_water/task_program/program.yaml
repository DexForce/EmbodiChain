program_id: pour_water_with_right_arm
instruction: Pour water from the bottle into the cup and return the bottle to the table.
targets:
  bottle_return_pose:
    kind: cyclic_pose
    values:
      - position: [0.75, -0.1, 0.962]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  bottle_release_pose:
    kind: cyclic_pose
    values:
      # Open above the support instead of driving a held bottle into the table.
      - position: [0.75, -0.1, 0.969]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  bottle_pour_pose:
    kind: cyclic_pose
    values:
      - position: [0.7776451358490485, 0.04643509710227371, 1.101]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  cup_rest_pose:
    kind: cyclic_pose
    values:
      - position: [0.75, 0.1, 0.921]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
program:
  kind: sequence
  items:
    - kind: segment
      name: pick_bottle
      instruction: Grasp and lift the bottle.
      steps:
        kind: invoke
        call:
          kind: pick
          object: bottle
          grasp: bottle_grasp
    - kind: segment
      name: move_bottle_above_cup
      instruction: Move the held bottle above the cup.
      steps:
        kind: invoke
        call:
          kind: registered
          call_id: simulation.move_held_object
          arguments:
            target: cup_pour_pose
      # Read the physical bottle pose before allowing the pour segment.
      validators:
        - kind: object_near_target
          object: bottle
          target: bottle_pour_pose
          position_tolerance: 0.01
    - kind: segment
      name: pour_water
      instruction: Tilt the bottle to pour water into the cup and return it upright.
      steps:
        kind: invoke
        call:
          kind: registered
          call_id: simulation.pour
          arguments:
            object: bottle
    - kind: segment
      name: return_bottle
      instruction: Place the bottle back on the table and release it.
      steps:
        kind: invoke
        call:
          kind: place
          object: bottle
          at:
            kind: target_ref
            target: bottle_release_pose
      post:
        - kind: wait_stable
          entity: bottle
        - kind: wait_stable
          entity: cup
      validators:
        - kind: object_near_target
          object: bottle
          target: bottle_return_pose
          position_tolerance: 0.05
        - kind: object_near_target
          object: cup
          target: cup_rest_pose
          position_tolerance: 0.002
