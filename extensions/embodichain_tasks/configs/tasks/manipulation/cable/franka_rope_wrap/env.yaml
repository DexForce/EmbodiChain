environment_id: franka_rope_wrap
enable_ground_plane: true
physics: newton
physics_config:
  physics_dt: 0.0005208333333333333
  num_substeps: 1
  collision_cfg: null
  sync_to_renderer: false
  use_cuda_graph: true
  solver_cfg:
    solver_type: dexuni
    joint_mode: dynamic
    coupling: two_way
    mujoco_articulation_paths:
    - arena_0/franka
    vbd_options:
      iterations: 48
      rigid_contact_history: false
      rigid_contact_hard: false
      rigid_joint_linear_ke: 100000.0
      rigid_joint_angular_ke: 10.0
      friction_epsilon: 1.0e-05
    collision_options:
      contact_matching: sticky
      contact_matching_pos_threshold: 5.0e-05
      rigid_contact_max: 4096
max_episode_steps: 2161
num_envs: 1
simulation:
  background:
  - uid: table
    body_type: static
    init_pos: [0.35, 0, -0.023]
    shape:
      shape_type: Cube
      size: [1.2, 1.05, 0.05]
      visual_material:
        uid: table_mat
        base_color: [0.33, 0.37, 0.41, 1]
        roughness: 0.65
    attrs:
      collision_props:
        backend: newton
        margin: 0.0
        gap: 5.0e-05
      material_props:
        backend: newton
        dynamic_friction: 0.2
        ke: 20000.0
        kd: 1.0
  - uid: anchor_clamp
    body_type: static
    init_pos: [0.20517865683993153, -0.20357136530375444, 0.002]
    shape:
      shape_type: Cube
      size: [0.028, 0.018, 0.008]
      visual_material:
        uid: anchor_clamp_mat
        base_color: [0.08, 0.11, 0.15, 1]
        roughness: 0.65
    attrs:
      collision_props:
        backend: newton
        margin: 0.0
        gap: 5.0e-05
      material_props:
        backend: newton
        dynamic_friction: 0.2
        ke: 20000.0
        kd: 1.0
    init_rot: [0, 0, 36.52885536698517]
  - uid: post
    body_type: static
    init_pos: [0.48, 0, 0.062]
    shape:
      shape_type: Cylinder
      radius: 0.045
      half_height: 0.06
      visual_material:
        uid: post_mat
        base_color: [0.025, 0.45, 0.39, 1]
        roughness: 0.38
    attrs:
      collision_props:
        backend: newton
        margin: 0.0
        gap: 5.0e-05
      material_props:
        backend: newton
        dynamic_friction: 0.3
        ke: 20000.0
        kd: 1.0
  usd_scene:
    name: cable_scene
    source:
      file_path: ./cable.usda
    asset_cfgs:
      /World/cable:
        uid: cable
        fixed_segments: [0]
        collision_filter_span: 2
        attrs:
          density: 800.0
          stretch_stiffness: 100000.0
          shear_stiffness: 100000.0
          bend_stiffness: 0.0001
          twist_stiffness: 0.0001
          stretch_damping: 0.03
          shear_damping: 0.03
          bend_damping: 0.0001
          twist_damping: 0.0001
          collision_props:
            backend: newton
            margin: 0.0
            gap: 5.0e-05
          material_props:
            backend: newton
            dynamic_friction: 0.8
            ke: 20000.0
            kd: 1.0
env:
  sim_steps_per_control: 32
  ignore_terminations: true
  expert_trajectory:
    joint_command_mode: position_velocity
  task_instruction: Pick up the rope, wrap it around the post, tighten and hold it.
  events:
    settle_rope:
      func: settle_franka_rope
      mode: reset
      params: {}
