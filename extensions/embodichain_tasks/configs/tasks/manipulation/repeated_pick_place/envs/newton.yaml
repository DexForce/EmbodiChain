environment_id: repeated_pick_place
physics: newton
max_episode_steps: 2000
num_envs: 1
arena_space: 2.5
physics_config:
  physics_dt: 0.01
  gravity: [0.0, 0.0, -9.81]
  num_substeps: 20
  collision_cfg: null
  solver_cfg:
    solver_type: mujoco_warp
    solver: newton
    integrator: implicitfast
    iterations: 20
    ls_iterations: 100
    cone: elliptic
    impratio: 1000.0
    use_mujoco_contacts: true
    enable_multiccd: true
simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  rigid_object:
    - uid: cube
      shape:
        shape_type: Cube
        size: [0.05, 0.05, 0.05]
      body_type: dynamic
      init_pos: [-0.42, -0.08, 0.05]
      attrs:
        mass_props:
          mass: 0.05
        rigid_props:
          linear_damping: 0.2
          angular_damping: 0.2
        collision_props:
          backend: newton
          condim: 4
        material_props:
          dynamic_friction: 0.97
          static_friction: 0.99
          backend: newton
          ke: 40000.0
          kd: 400.0
          torsional_friction: 0.1
          rolling_friction: 0.01
env:
  sim_steps_per_control: 1
  events:
    settle_cube:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
          - uid: cube
        min_steps: 10
        max_steps: 120
        check_interval_steps: 2
        required_stable_checks: 3
        timeout_behavior: raise
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: /tmp/repeated-pick-place/datasets
        extra:
          scene_type: tabletop
          task_description: repeated_pick_place_combined
          data_type: sim
        use_videos: true
  seed: 0
