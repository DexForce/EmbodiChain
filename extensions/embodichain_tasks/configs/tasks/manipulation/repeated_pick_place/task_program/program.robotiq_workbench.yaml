program_id: repeated_cube_pick_place_workbench
instruction: Move the cube between the two tabletop positions three times.
targets:
  drop_pose:
    kind: cyclic_pose
    values:
    - position:
      - -0.1
      - -0.05
      - 0.785
      quaternion_xyzw:
      - 0
      - 0
      - 0
      - 1
    - position:
      - 0
      - -0.15
      - 0.785
      quaternion_xyzw:
      - 0
      - 0
      - 0
      - 1
  rest_pose:
    kind: cyclic_pose
    values:
    - position:
      - -0.1
      - -0.05
      - 0.775
      quaternion_xyzw:
      - 0
      - 0
      - 0
      - 1
    - position:
      - 0
      - -0.15
      - 0.775
      quaternion_xyzw:
      - 0
      - 0
      - 0
      - 1
program:
  kind: repeat
  count: 3
  body:
    kind: sequence
    items:
    - kind: segment
      name: pick_cube
      instruction: Grasp and lift the cube.
      steps:
        kind: invoke
        call:
          kind: pick
          object: cube
      validators:
      - kind: object_lifted
        object: cube
        minimum_lift: 0.04
    - kind: segment
      name: place_cube
      instruction: Place the cube at the next tabletop position and release it.
      steps:
        kind: invoke
        call:
          kind: place
          object: cube
          at:
            kind: target_ref
            target: drop_pose
      post:
      - kind: wait_stable
        entity: cube
      validators:
      - kind: object_near_target
        object: cube
        target: rest_pose
        position_tolerance: 0.02
      - kind: object_upright
        object: cube
        maximum_tilt_degrees: 15.0
