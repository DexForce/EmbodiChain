program_id: repeated_tabletop_cube_pick_place
instruction: Move the cube between the two tabletop positions three times.
targets:
  drop_pose:
    kind: cyclic_pose
    values:
    - position:
      - 0.76
      - 0.12
      - 0.95
      quaternion_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    - position:
      - 0.68
      - 0.22
      - 0.95
      quaternion_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
  rest_pose:
    kind: cyclic_pose
    values:
    - position:
      - 0.76
      - 0.12
      - 0.925
      quaternion_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
    - position:
      - 0.68
      - 0.22
      - 0.925
      quaternion_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
program:
  repeat:
    count: 3
    body:
    - segment: pick_cube
      instruction: Grasp and lift the cube.
      steps:
        pick:
          object: cube
    - segment: place_cube
      instruction: Place the cube at the next tabletop position and release it.
      steps:
        place:
          object: cube
          at: drop_pose
      post:
      - kind: wait_stable
        entity: cube
      validators:
      - kind: object_near_target
        object: cube
        target: rest_pose
        position_tolerance: 0.04
