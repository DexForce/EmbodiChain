# Change env.events.select_object.params.asset to cube or rubiks_cube.
physics: default
max_episodes: 1
max_episode_steps: 2400
num_envs: 1
arena_space: 3.0
physics_config:
  enable_ccd: true
env:
  sim_steps_per_control: 4
  events:
    select_object:
      func: select_rigid_object_asset
      mode: startup
      params:
        entity_cfg:
          uid: cube
        asset: cube
        assets:
          cube:
            label: cube
            shape:
              shape_type: Cube
              size:
              - 0.05
              - 0.05
              - 0.05
            init_pos:
            - 0.45
            - 0.15
            - 0.777
          rubiks_cube:
            label: Rubik's cube
            shape:
              shape_type: Mesh
              fpath: RubiksCube/rubiks_cube_001.usdc
            rigidize_usd: true
            init_pos:
            - 0.45
            - 0.15
            - 0.78078
    settle_cube_on_reset:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: cube
        min_steps: 10
        max_steps: 120
        timeout_behavior: raise
light:
  direct:
  - uid: main_light
    light_type: sun
    color:
    - 0.8
    - 0.8
    - 0.8
    intensity: 5.0
    direction:
    - 0.0
    - 0.0
    - -1.0
background:
- uid: support_surface
  shape:
    shape_type: Cube
    size:
    - 0.6
    - 1.0
    - 0.04
  body_type: static
  init_pos:
  - 0.6
  - 0.0
  - 0.73
  attrs:
    material_props:
      static_friction: 0.95
      dynamic_friction: 0.9
rigid_object:
- uid: cube
  shape:
    shape_type: Cube
    size:
    - 0.05
    - 0.05
    - 0.05
  body_type: dynamic
  init_pos:
  - 0.45
  - 0.15
  - 0.777
  attrs:
    mass_props:
      mass: 0.05
    rigid_props:
      linear_damping: 0.2
      angular_damping: 0.2
    material_props:
      static_friction: 0.99
      dynamic_friction: 0.97
rigid_object_group: []
articulation: []
id: TaskProgramRepeatedPickPlace-DualUR5-Assets-v1
task_program:
  program: task_program/program.assets.yaml
  integration: task_program/integration.dual_ur.yaml
  execution_policy: ../../../components/execution_policies/motion_gen_verified.yaml
embodiment:
  component: ../../../components/embodiments/dual_ur5_dh_pgi_140_80.yaml
  overrides:
    init_pos:
    - 1.683
    - 0.0
    - 0.4525
    init_rot:
    - 0.0
    - 0.0
    - -90.0
