id: TaskProgramOpenDrawer-Franka-v1
environment:
  default: envs/default.yaml
  newton: envs/newton.yaml
task_program:
  program: task_program/program.yaml
  integration: task_program/integration.yaml
  execution_policy:
    component: ../../../components/execution_policies/trajectory_open_loop.yaml
    overrides:
      motion:
        ik_seed_mode: sequential
        velocity_limit: 0.25
      recovery:
        skill_timeout: 120.0
embodiment:
  component: ../../../components/embodiments/franka_panda_cartesian.yaml
  overrides:
    init_pos:
    - -0.3
    - 0.0
    - 0.0
    init_rot:
    - 0.0
    - 0.0
    - 180.0
