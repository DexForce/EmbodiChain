environment_id: drawer_sorting
physics: default
num_envs: 1
max_episodes: 1
max_episode_steps: 12000
arena_space: 3.0
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color: [1.0, 1.0, 1.0]
      intensity: 5.0
      direction: [0.0, 0.0, -1.0]
  background:
  - uid: source_mat
    shape:
      shape_type: Cube
      size: [0.36, 0.34, 0.12]
    body_type: kinematic
    init_pos: [-0.16, -0.38, 0.06]
  - uid: robot_pedestal
    shape:
      shape_type: Cube
      size: [0.24, 0.24, 0.24]
    body_type: kinematic
    init_pos: [2.7755575615628914e-17, 0.0, 0.12]
  - uid: cabinet_plinth
    shape:
      shape_type: Cube
      size: [0.36, 0.44, 0.09139999999999998]
    body_type: kinematic
    init_pos: [-0.8775, 0.0, 0.04569999999999999]
  rigid_object:
  - uid: drink_can
    shape:
      shape_type: Mesh
      fpath: SodaCan/simple_cola_can.obj
      compute_uv: false
      collision:
        approximation: convex_hull
    body_type: dynamic
    init_pos: [-0.09999999999999995, -0.31999999999999995, 0.141254032]
    attrs:
      mass_props:
        mass: 0.03
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
        restitution: 0.0
    body_scale: [0.36, 0.28, 0.36]
    init_rot: [0.0, 0.0, 0.0]
  - uid: water_bottle
    shape:
      shape_type: Mesh
      fpath: ScannedBottle/yibao_processed.ply
      compute_uv: false
      collision:
        approximation: convex_hull
    body_type: dynamic
    init_pos: [-0.22, -0.31999999999999995, 0.15370540237426758]
    attrs:
      mass_props:
        mass: 0.03
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
        restitution: 0.0
    body_scale: [0.64, 0.64, 0.4]
    init_rot: [0.0, 0.0, 0.0]
  - uid: coffee_cup
    shape:
      shape_type: Mesh
      fpath: CoffeeCup/cup_translated.ply
      compute_uv: false
      collision:
        approximation: convex_hull
    body_type: dynamic
    init_pos: [-0.09999999999999995, -0.44000000000000006, 0.14024892887473103]
    attrs:
      mass_props:
        mass: 0.03
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
        restitution: 0.0
    body_scale: [1.0, 1.0, 1.0]
    init_rot: [0.0, 0.0, 0.0]
  - uid: paper_cup
    shape:
      shape_type: Mesh
      fpath: PaperCup/paper_cup.ply
      compute_uv: false
      collision:
        approximation: convex_hull
    body_type: dynamic
    init_pos: [-0.22, -0.44000000000000006, 0.151714635]
    attrs:
      mass_props:
        mass: 0.03
      rigid_props:
        linear_damping: 0.2
        angular_damping: 0.2
        min_position_iters: 32
        min_velocity_iters: 8
        max_depenetration_velocity: 2.0
      material_props:
        static_friction: 0.99
        dynamic_friction: 0.97
        restitution: 0.0
    body_scale: [0.7, 0.7, 0.7]
    init_rot: [0.0, 0.0, 0.0]
  articulation:
  - uid: drawer
    fpath: ./assets/bedside_cabinet.urdf
    init_pos: [-0.8775, 0.0, 0.09139999999999998]
    init_rot: [0.0, 0.0, 90.0]
    init_qpos: [0.0]
    root_props:
      fixed_base: true
    asset_physics_mode: overlay
    joint_drive_props:
      drive_type: force
      target_mode: velocity
      stiffness: 0.0
      damping: 40.0
      friction: 0.0
    attrs:
      material_props:
        static_friction: 1.0
        dynamic_friction: 1.0
env:
  sim_steps_per_control: 4
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: /tmp/drawer_sorting/datasets
        extra:
          scene_type: workcell
          task_description: drawer_sorting
          data_type: sim
        use_videos: true
render_cfg:
  renderer: hybrid
  tone_mapping_enabled: true
  tone_mapping_exposure: 1.0
