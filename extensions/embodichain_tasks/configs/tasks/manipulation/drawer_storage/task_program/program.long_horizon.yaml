program_id: drawer_storage_long_horizon
instruction: Open the cabinet drawer, store a drink can, water bottle, coffee cup and paper cup in their assigned
  positions, and close the loaded drawer.
targets: {}
program:
  kind: sequence
  items:
  - kind: segment
    name: open_drawer
    instruction: Pull the drawer open before storing the parts.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.articulation_link_slide
        arguments:
          handle: drawer_handle
    validators:
    - kind: articulation_joint_position
      articulation: drawer
      joint: cabinet_to_drawer
      minimum_position: 0.212
      maximum_position: 0.229
    post:
    - kind: wait_stable
      entity: drawer
      preset: articulation
  - kind: segment
    name: clear_after_open_drawer
    instruction: Lift the empty gripper above the handle and return to the source-side workspace.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.move_end_effector
        arguments:
          target: clear_open_handle
    validators:
    - kind: articulation_joint_position
      articulation: drawer
      joint: cabinet_to_drawer
      minimum_position: 0.212
      maximum_position: 0.229
  - kind: segment
    name: pick_drink_can
    instruction: Grasp and lift the drink can.
    steps:
      kind: invoke
      call:
        kind: pick
        object: drink_can
        grasp: drink_can_grasp
    validators:
    - kind: object_lifted
      object: drink_can
      minimum_lift: 0.06
  - kind: segment
    name: transport_drink_can
    instruction: Move the held drink can above the open drawer.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.move_held_object
        arguments:
          target: transport_drink_can
    validators:
    - kind: object_relative_position
      object: drink_can
      reference: drawer_floor
      reference_frame: parent
      position_offset: [-0.09, -0.04, 0.13]
      position_tolerance: [0.025, 0.025, 0.015]
  - kind: segment
    name: support_drink_can
    instruction: Lower the held object onto the drawer floor with the hand closed; verify floor height before release.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.move_held_object
        arguments:
          target: support_drink_can
    validators:
    - kind: object_relative_position
      object: drink_can
      reference: drawer_floor
      reference_frame: parent
      position_offset: [-0.09, -0.04, 0.026654031999999998]
      position_tolerance: [0.015, 0.015, 0.003]
  - kind: segment
    name: store_drink_can
    instruction: Put the drink can in its assigned drawer position.
    steps:
      kind: invoke
      call:
        kind: place
        object: drink_can
        inside: drink_can_slot
    post:
    - kind: wait_stable
      entity: drink_can
    validators:
    - kind: object_relative_position
      object: drink_can
      reference: drawer_floor
      reference_frame: parent
      position_offset: [-0.09, -0.04, 0.026654031999999998]
      position_tolerance: [0.025, 0.025, 0.015]
  - kind: segment
    name: clear_after_store_drink_can
    instruction: Lift the empty gripper above the handle and return to the source-side workspace.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.move_end_effector
        arguments:
          target: clear_loaded_drawer
    validators:
    - kind: articulation_joint_position
      articulation: drawer
      joint: cabinet_to_drawer
      minimum_position: 0.212
      maximum_position: 0.229
  - kind: segment
    name: pick_water_bottle
