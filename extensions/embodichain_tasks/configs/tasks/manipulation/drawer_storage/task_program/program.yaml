program_id: drawer_storage
instruction: Open the drawer, put the cube inside, release it and close the drawer.
targets: {}
program:
  kind: sequence
  items:
  - kind: segment
    name: open_drawer
    instruction: open drawer.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.articulation_link_slide
        arguments:
          handle: drawer_handle
          position: 0.26
    validators:
    - kind: articulation_joint_position
      articulation: drawer
      joint: cabinet_to_drawer
      minimum_position: 0.25
      maximum_position: 0.28
    post:
    - kind: wait_stable
      entity: drawer
      preset: open_rail
  - kind: segment
    name: pick_cube
    instruction: Pick the cube from the side table.
    steps:
      kind: invoke
      call:
        kind: pick
        object: cube
        grasp: cube_grasp
    validators:
    - kind: object_lifted
      object: cube
      minimum_lift: 0.04
  - kind: segment
    name: store_cube
    instruction: Place the cube inside the open drawer and release it.
    steps:
      kind: invoke
      call:
        kind: place
        object: cube
        inside: drawer_interior
    post:
    - kind: wait_stable
      entity: cube
      preset: stored_cube
    validators:
    - kind: condition
      ref: cube_contained
    - kind: condition
      ref: hand_open
    - kind: condition
      ref: fingers_clear
  - kind: segment
    name: close_drawer
    instruction: close drawer.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.articulation_link_slide
        arguments:
          handle: drawer_handle
          position: 0.0
    validators:
    - kind: articulation_joint_position
      articulation: drawer
      joint: cabinet_to_drawer
      minimum_position: 0.0
      maximum_position: 0.01
    post:
    - kind: wait_stable
      entity: cube
      preset: stored_cube
