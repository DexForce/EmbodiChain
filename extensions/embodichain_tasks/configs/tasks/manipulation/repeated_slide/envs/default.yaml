environment_id: open_drawer
physics: default
max_episode_steps: 2000
num_envs: 1
arena_space: 3.0
simulation:
  light:
    direct:
      - uid: main_light
        light_type: sun
        color: [0.6, 0.6, 0.6]
        intensity: 5.0
        direction: [0.0, 0.0, -1.0]
  articulation:
    - uid: drawer
      fpath: Drawer/model_split_links_with_inertials.urdf
      init_pos: [-1.1, 0.0, 0.0]
      init_rot: [0.0, 0.0, 90.0]
      init_qpos: [0.0]
      root_props:
        fixed_base: true
      asset_physics_mode: overlay
      joint_drive_props:
        drive_type: none
      attrs:
        material_props:
          static_friction: 1.0
          dynamic_friction: 1.0
env:
  sim_steps_per_control: 1
  events: {}
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: /tmp/open-drawer-lerobot
        extra:
          scene_type: cabinet
          task_description: open_drawer_generation
          data_type: sim
        use_videos: true
  seed: 0
