embodiment_id: franka_panda_firm_grip_newton
simulation:
  class_type: FrankaPanda
  robot_type: panda
  uid: FrankaPanda
  joint_drive_props:
    drive_type: force
    stiffness:
      fr3_joint[1-7]: 10000.0
      fr3_finger_joint[1-2]: 8000.0
    damping:
      fr3_joint[1-7]: 1000.0
      fr3_finger_joint[1-2]: 100.0
    max_effort:
      fr3_joint[1-7]: 100000.0
      fr3_finger_joint[1-2]: 80.0
  link_attrs:
    # Configure the existing finger selector for MuJoCo torsional and rolling contacts.
    newton_gripper_contacts:
      link_names_expr: [fr3_leftfinger, fr3_rightfinger]
      attrs:
        collision_props:
          backend: newton
          condim: 6
        material_props:
          backend: newton
          dynamic_friction: 1.0
          ke: 400000.0
          kd: 1265.0
          torsional_friction: 0.1
          rolling_friction: 0.03
sensor:
- sensor_type: Camera
  uid: cam_high
  width: 640
  height: 480
  intrinsics:
  - 488.1665
  - 488.1665
  - 320.0
  - 240.0
  extrinsics:
    eye:
    - -0.5
    - -0.9
    - 0.88
    target:
    - -0.5
    - 0.1
    - 0.2
    up:
    - 0.0
    - 0.0
    - 1.0
skill_profile:
  contract_id: single_arm_parallel_gripper
  profile_id: franka_panda_firm_grip_newton
  resources:
  - resource_id: primary_manipulator
    endpoints:
    - endpoint_id: motion
      control_part: arm
      capabilities:
      - kinematics.batch_inverse
      - motion.cartesian_pose
      - kinematics.forward
    - endpoint_id: grasp
      control_part: eef
      capabilities:
      - interaction.grasp
      command_preset: parallel_jaw_commands
  command_presets:
  - preset_id: parallel_jaw_commands
    control_part: eef
    commands:
      open:
      - 0.04
      - 0.04
      grasp:
      - 0.0
      - 0.0
  runtime_services:
    grasp_pose_generators:
      eef:
        kind: antipodal_parallel_jaw
        sample_count: 1000
        opening_margin: 0.002
        point_sample_density: 0.012
        filter_ground_collision: false
        model:
          model_id: franka_panda_hand
