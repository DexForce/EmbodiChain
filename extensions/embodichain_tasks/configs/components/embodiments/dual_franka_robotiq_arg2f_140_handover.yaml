# HandOver calibration qualified against the frozen #948 Robotiq 140 profile.
# Operation-specific drives are scoped to this variant; use the original
# dual_franka_robotiq_arg2f_140 component for the frozen source calibration.
embodiment_id: dual_franka_robotiq_arg2f_140_handover
simulation:
  uid: DualFrankaPanda
  urdf_cfg:
    fname: dual_franka_robotiq_arg2f_140
    name_case:
      joint: original
      link: original
    components:
    - component_type: left_arm
      urdf_path: Franka/Panda/Panda.urdf
      transform:
      - - 1.0
        - 0.0
        - 0.0
        - -1.25
      - - 0.0
