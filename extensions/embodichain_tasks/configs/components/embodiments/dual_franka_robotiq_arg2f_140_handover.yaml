      - - 0.0
        - 0.0
        - 0.0
        - 1.0
    - component_type: right_arm
      urdf_path: Franka/Panda/Panda.urdf
      transform:
      - - 1.0
        - 0.0
        - 0.0
        - -1.25
      - - 0.0
        - 1.0
        - 0.0
        - -0.3
