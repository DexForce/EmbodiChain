embodiment_id: yam_i2rt
simulation:
  class_type: YamI2rt
  uid: yam
  root_props:
    newton_gravity_compensation: 1.0
  joint_drive_props:
    stiffness:
      right_joint[1-6]: 300.0
      left_joint[1-6]: 2000.0
      .*_joint[78]: 6000.0
    damping:
      right_joint[1-6]: 30.0
      left_joint[1-6]: 90.0
      .*_joint[78]: 120.0
  link_attrs:
    pads:
      link_names_expr:
      - (right|left)_tip_(left|right)
      attrs:
        material_props:
          backend: newton
          dynamic_friction: 60.0
          ke: 10000.0
          kd: 0.1
  attrs:
    collision_props:
      contact_offset: 0.01
      rest_offset: 0.0
    material_props:
      backend: newton
      dynamic_friction: 2.0
      ke: 10000.0
      kd: 0.1
sensor: []
skill_profile:
  contract_id: dual_arm_parallel_gripper
  profile_id: yam_i2rt
  resources:
  - resource_id: right_manipulator
    endpoints:
    - endpoint_id: motion
      control_part: right_arm
      capabilities:
      - kinematics.batch_inverse
      - motion.cartesian_pose
      - kinematics.forward
      - motion.joint_position
    - endpoint_id: grasp
      control_part: right_eef
      capabilities:
      - interaction.grasp
      - motion.joint_position
      command_preset: right_jaw
  - resource_id: right_hand
    endpoints:
    - endpoint_id: motion
      control_part: right_eef
      capabilities:
      - motion.joint_position
    members:
    - right_manipulator
  - resource_id: left_manipulator
    endpoints:
    - endpoint_id: motion
      control_part: left_arm
      capabilities:
      - kinematics.batch_inverse
      - motion.cartesian_pose
      - kinematics.forward
      - motion.joint_position
    - endpoint_id: grasp
      control_part: left_eef
      capabilities:
      - interaction.grasp
      - motion.joint_position
      command_preset: left_jaw
  - resource_id: left_hand
    endpoints:
    - endpoint_id: motion
      control_part: left_eef
      capabilities:
      - motion.joint_position
    members:
    - left_manipulator
  command_presets:
  - preset_id: right_jaw
    control_part: right_eef
    commands:
      open:
      - 0.0475
      - 0.0475
      grasp:
      - 0.003
      - 0.003
  - preset_id: left_jaw
    control_part: left_eef
    commands:
      open:
      - 0.0475
      - 0.0475
      grasp:
      - 0.003
      - 0.003
