      left_arm: 10000.0
      right_arm: 10000.0
      left_eef: 50.0
      right_eef: 50.0
    damping:
      left_arm: 1000.0
      right_arm: 1000.0
      left_eef: 5.0
      right_eef: 5.0
    max_effort:
      left_arm: 330.0
      right_arm: 330.0
      left_eef: 500.0
