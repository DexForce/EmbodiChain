  root_props:
    fixed_base: true
  joint_drive_props:
    stiffness:
      left_eef: 1000.0
      right_eef: 1000.0
      head: 10000000.0
    damping:
      left_eef: 100.0
      right_eef: 100.0
      head: 10000.0
    max_effort:
      left_eef: 8.0
      right_eef: 8.0
    max_velocity:
      left_eef: 0.25
      right_eef: 0.25
  link_attrs:
