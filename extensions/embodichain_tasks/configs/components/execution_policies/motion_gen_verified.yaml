policy_id: motion_gen_verified_v1
preset_id: safe

requires:
  embodiment_contract: dual_arm_parallel_gripper

planner:
  type: toppra
  config: {}

motion:
  strategy: motion_gen
  sample_count: 140
  # Keep the physically qualified tabletop speed budget across robot limits.
  velocity_limit: 0.2
  acceleration_limit: 0.5
  dynamic_collision_mode: auto

tracking:
  kind: joint_position
  in_flight_max_abs_error: 1.0
  terminal_max_abs_error: 1.0

recovery:
  # Composite transfers retain native timing and can exceed 30 seconds.
  skill_timeout: 120.0
  max_replans: 3
  max_skill_retries: 0
  goal_rotation_threshold: 0.5

workflow_recovery:
  max_recovery_attempts: 2

runner:
  minimum_cycle_time: 0.04
  hold_on_completion: false
  hold_during_effect_verification: false

effect_assurance: verified
