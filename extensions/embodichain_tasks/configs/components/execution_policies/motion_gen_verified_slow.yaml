policy_id: motion_gen_verified_slow_v1
preset_id: safe
requires:
  embodiment_contract: dual_arm_parallel_gripper
planner:
  type: toppra
  config: {}
motion:
  strategy: motion_gen
  sample_count: 360
  velocity_limit: 0.1
  acceleration_limit: 0.5
  dynamic_collision_mode: auto
tracking:
  kind: joint_position
  in_flight_max_abs_error: 1.0
  terminal_max_abs_error: 1.0
recovery:
