[build-system]
# setup.py supplies package discovery, source mappings and bundled resources.
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "embodichain"
description = "An end-to-end, GPU-accelerated, and modular platform for building generalized Embodied Intelligence."
readme = "README.md"
authors = [ { name = "EmbodiChain Developers" } ]
requires-python = ">=3.11"
dynamic = ["version"]

# Core install dependencies (kept from requirements.txt).
dependencies = [
  "dexsim_engine==0.6.0rc1",
  # DexSim and LeRobot require different OpenCV distributions sharing cv2.
  # Keep their bindings on the same release to avoid mixed Python/native APIs.
  "opencv-python==4.12.0.88; python_version < '3.12'",
  "opencv-python-headless==4.12.0.88; python_version < '3.12'",
  "opencv-python==4.13.0.92; python_version >= '3.12'",
  "opencv-python-headless==4.13.0.92; python_version >= '3.12'",
  "shapely>=2.0",
  "setuptools>=78.1.1",
  "gymnasium>=0.29.1",
  "huggingface_hub>=0.35.3,<0.36; python_version < '3.12'",
  "huggingface_hub>=1.6,<2; python_version >= '3.12'",
  "langchain",
  "langchain-openai",
  "scipy",
  "pin",
  "pin-pink",
  "casadi",
  "qpsolvers[osqp]==4.8.1",
  "pytorch_kinematics==0.10.0",
  "polars==1.31.0",
  "PyYAML>=6.0",
  "wandb>=0.21.0",
  "tensorboard>=2.20.0",
  "ortools",
  "prettytable",
  "psutil>=5.9",
  "black==26.10.1",
  "fvcore",
  "h5py",
  "tensordict>=0.13,<0.15; python_version < '3.12'",
  "tensordict>=0.15.3,<0.16; python_version >= '3.12'",
  "viser==1.0.21",
  "lerobot==0.4.4; python_version < '3.12'",
  "lerobot[training]==0.6.1; python_version >= '3.12'",
  # TorchCodec's binary interface follows torch, not the LeRobot SDK version.
  # Keep each Python profile's torch/torchvision/TorchCodec versions paired.
  "torch>=2.7,<2.8; python_version < '3.12'",
  "torchvision>=0.22,<0.23; python_version < '3.12'",
  "torchcodec>=0.5,<0.6; python_version < '3.12'",
  "torch>=2.11,<2.12; python_version >= '3.12'",
  "torchvision>=0.26,<0.27; python_version >= '3.12'",
  "torchcodec>=0.11.1,<0.12; python_version >= '3.12'"
]

[project.optional-dependencies]
# Only this validated CUDA operator ABI is supported.
worldparticle = [
    "torchvision==0.22.1+cu128; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "numpy==2.2.6; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "torch==2.7.1+cu128; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "einops==0.8.2; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "open3d @ http://192.168.3.43:8080/packages/open3d-0.19.0%2B1e7b174-1torch271cu128sm120-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=209bcee758d25953bcc4cab284ad4fb17f5aace0a3e1e3c296750511bf4257ad ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "flash-attn @ http://192.168.3.43:8080/packages/flash_attn-2.8.3%2Bcu12torch2.7cxx11abiTRUE-cp312-cp312-linux_x86_64.whl#sha256=cafd4f708725e1be95495a86cbf418cfada08e707c8a797def61488a2a3c4f72 ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
geometry = [
  # Optional mesh inputs for pure numerical geometry; no simulation/FCL backend.
  "trimesh>=4.9",
]
rigidformer = [
  "einops>=0.8.1",
  "roma==1.5.4",
  "pyarrow>=15",
  "trimesh>=4.9",
]
policy-deploy = [
  # ORT 1.27+ defaults to CUDA 13; EmbodiChain's supported stack uses CUDA 12.
  "onnxruntime-gpu>=1.20,<1.27",
]
gensim = [
  # Blender runs in a separate Python 3.11 runtime; see docker/README.md.
  "gradio>=6.17.3,<6.18",
  "pyrender==0.1.45",
  "requests",
  "Pillow",
  "matplotlib",
]

[project.scripts]
# Unified EmbodiChain CLI with sub-commands (mirrors ``python -m embodichain``).
# ``embodichain run-task`` discovers all installed task packages (via the
# ``embodichain.tasks`` entry points) and runs their init hooks (via
# ``embodichain.init``) before building and launching the environment.
# Other commands cover environment discovery, data assets, SimReady generation,
# asset and LeRobot dataset preview, grasp annotation, RL training, URDF convex
# decomposition, benchmarks, and workspace cache management.
embodichain = "embodichain.__main__:main"

[project.entry-points."dexsim.newton_solvers"]
worldparticle = "embodichain.lab.sim.physics.worldparticle:WorldParticleProvider"

[project.entry-points."embodichain.tasks"]
embodichain_tasks = "embodichain_tasks"

[project.entry-points."embodichain.robots"]
official = "embodichain_robots._catalog:ROBOT_CONFIGS"

[project.entry-points."embodichain.assets"]
official_robots = "embodichain_robots._asset_catalog:ROBOT_ASSETS"

[tool.uv.sources]
bpy = { index = "blender" }

[[tool.uv.index]]
name = "blender"
url = "https://download.blender.org/pypi/"
explicit = true

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]

[tool.black]

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
filterwarnings = [
    "ignore:`torch\\.jit\\.script(_method)?` is deprecated.*:DeprecationWarning:torch\\.jit\\._script",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_sim: marks tests that require a real simulation backend",
    "subprocess_sim: marks tests whose simulation is isolated to a child process",
    "no_sim: marks mock-only tests that must not initialize a simulation backend",
    "requires_tasks: marks tests that require installed task-package discovery",
    "gpu: marks tests that execute CUDA/GPU code (run serially)",
    "renderer: marks tests that exercise a rendering backend",
    "xdist_group(name): keeps resource-sharing tests on one pytest-xdist worker",
]
