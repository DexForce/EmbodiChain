# Parameter anchors are the single edit surface for the first-stage primitive
# geometry sweep. Runtime object overrides and domain provenance reuse the same
# values so a replacement cannot drift from its recorded parameters.
x-cube-size-nominal: &cube_size_nominal [0.05, 0.05, 0.05]
x-cube-size-uniform-40mm: &cube_size_uniform_40mm [0.04, 0.04, 0.04]
x-cube-size-uniform-60mm: &cube_size_uniform_60mm [0.06, 0.06, 0.06]
