x-cube-size-aspect-y: &cube_size_aspect_y [0.042258, 0.07, 0.042258]
x-cube-size-aspect-z: &cube_size_aspect_z [0.042258, 0.042258, 0.07]

x-cube: &cube
  id: cube_50mm
  kind: cube
  size: *cube_size_nominal
  position: [-0.42, -0.08, 0.05]
  mass: 0.05
  dynamic_friction: 0.97
  static_friction: 0.99
  contact_offset: 0.003
  rest_offset: 0.001
  enable_ccd: true
  settle_steps: 10

x-cube-uniform-40mm: &cube_uniform_40mm
  <<: *cube
  size: *cube_size_uniform_40mm

x-cube-uniform-60mm: &cube_uniform_60mm
  <<: *cube
  size: *cube_size_uniform_60mm

# The elongated variants keep approximately the nominal cube volume while
# moving the long axis between X, Y, and Z.
x-cube-aspect-x: &cube_aspect_x
