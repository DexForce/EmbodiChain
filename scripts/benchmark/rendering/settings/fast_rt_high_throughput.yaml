# Rendering settings from DexSim MR !1629, preview_v4_materials RR q2.
# Resolution and Arena counts follow the requested EmbodiChain comparison.
# The portable fixed_reflective scene differs from the MR's preview-v4 assets.
scene: fixed_reflective
resolution: 640x480
camera_count: 1
enable_depth: true
env_sweep: [2, 4, 8, 16, 32, 64]
repeats: 5
warmup_frames: 16
measure_frames: 64
gpu_id: 0
device: cuda:0
render_cfg:
  renderer: fast-rt
  spp: 1
  min_bounces: 1
  max_bounces: 8
  denoising:
    window: dlss
    offscreen: dlss
  dlss:
    dlss_quality: 2
    tiled_enabled: true
    tiled_gutter_pixels: 0
    tiled_overscan_pixels: 0
    frame_time_delta_ms: 4.166666666666667
    exposure_compensation: 1.0
  tone_mapping_enabled: true
  tone_mapping_type: aces
  tone_mapping_exposure: 1.0
